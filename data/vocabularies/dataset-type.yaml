# Provenance of the dialogue text. Choose the most specific type the evidence supports.
dataset_types:
  real: Naturally occurring therapy or counseling sessions between a practitioner and a real client, or real help-seekers' own questions answered by practitioners.
  demonstration: Recorded or scripted sessions made to teach or illustrate a method, typically with actors, trainees or volunteers in the client role. Includes training and demonstration videos.
  dramatized: Scripted fictional sessions performed by actors for film, television or theatre, such as the drama In Treatment. Not made to teach a method, and not real clinical encounters.
  peer_support: Conversations in which trained or untrained non-clinicians support help-seekers, for example crowdsourced emotional-support chats or peer forums.
  synthetic: Dialogue generated by a model or simulation, with no human session behind each dialogue.
  hybrid: Derived from human material by a transformation such as translation, LLM expansion, paraphrase or reconstruction from reports.
  unknown: The sources reviewed do not establish provenance.

# Shape of the text, independent of provenance.
dialogue_structures:
  multi_turn: Sessions or conversations with several exchanges.
  single_turn_qa: One question or post and one or more standalone answers, without a continuing exchange.
  mixed: Contains both multi-turn dialogue and single-turn question-answer pairs.
  unknown: Not established.
