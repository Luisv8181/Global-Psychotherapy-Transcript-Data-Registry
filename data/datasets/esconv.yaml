id: esconv
title: "ESConv: Emotional Support Conversation Dataset"
canonical_url: https://github.com/thu-coai/Emotional-Support-Conversation
status: verified
dataset_type: peer_support
dialogue_structure: multi_turn
domain: emotional_support
source_context: >-
  Crowdsourced text conversations between help-seekers describing their own current or past
  emotional difficulties and crowdworkers trained as supporters through a helping-skills tutorial.
  Emotional support rather than psychotherapy; supporters are not documented as clinicians.
geography: null
languages: [en]
language_context: original
therapy_modalities:
  - emotional_support
sessions: 1053
longitudinal: false
transcript:
  available: true
  format:
    - json
modalities:
  - text
annotations:
  - support_strategies
  - problem_type
  - emotion_type
  - seeker_emotion_intensity
  - seeker_turn_feedback
  - post_conversation_survey
access:
  level: open
  requirements: Academic research use only, according to the official repository.
redistribution: conditional
license:
  type: CC-BY-NC-4.0
  verified: true
  source: https://github.com/thu-coai/Emotional-Support-Conversation/blob/main/LICENSE
  notes: The repository license is CC BY-NC 4.0. Its README also states that data and code are for academic research use only.
privacy:
  deidentified: unknown
  contextual_reidentification_assessed: unknown
evidence:
  primary_sources:
    - https://github.com/thu-coai/Emotional-Support-Conversation
    - https://aclanthology.org/2021.acl-long.269/
  supporting_publications:
    - https://arxiv.org/abs/2106.01144
publication_year: 2021
release_year: 2021
historical_significance:
  - early large-scale emotional-support dialogue benchmark with explicit supporter-strategy annotation
  - important adjacent peer-support resource distinct from professional psychotherapy corpora
notes: >-
  The 2021 paper reports 1,053 qualified conversations from 2,472 initially collected, 31,410 utterances,
  and 854 workers. The current official repository README, checked on 2026-09-29, reports that ESConv
  now contains 1,300 conversations and 10 topic problems after later collection updates; this record
  uses the 1,053 conversations documented in the original paper because that is the primary publication's
  quality-controlled release. The repository also contains 196 failed conversations added in 2024, but
  those are not counted in the main sessions field. The paper explicitly defines the task as social
  emotional support rather than professional counseling, so the registry classifies ESConv as
  peer_support rather than real psychotherapy. Help-seekers reported that 75.2 percent of conversations
  originated from their current experiences. The repository states that data and code are for academic
  research use only.
last_verified: 2026-09-29
