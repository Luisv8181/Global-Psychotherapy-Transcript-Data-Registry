historical_significance:
  - large Chinese counseling resource combining generated dialogue with explicit diagnostic and therapeutic reasoning traces
  - example of hybrid corpus construction from existing public mental-health datasets
notes: >-
  The official project repository states that OpenR1-Psy is constructed from Reddit posts derived from the LRF,
  Identifying Depression and Dreaddit research datasets, then transformed with LLM-based diagnostic and therapeutic
  reasoning. The current dataset host reports 19,302 rows/dialogues, with 18.9k train and 450 test examples. The
  dataset host reports Chinese language and an MIT license. Because the corpus is generated from human-source posts,
  it is classified as hybrid rather than synthetic under the registry's provenance taxonomy. The source datasets'
  individual licenses and terms remain relevant to downstream use.
