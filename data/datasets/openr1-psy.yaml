dialogue_structure: multi_turn
domain: mental_health_counseling
source_context: >-
  Multi-turn psychological counseling dialogues generated from real-world mental-health posts drawn from
  three publicly available research datasets. The pipeline transforms source posts with LLM-based diagnostic
  and therapeutic reasoning, producing counseling dialogues with reasoning traces rather than preserving the
  original human counseling interaction as a session transcript.
