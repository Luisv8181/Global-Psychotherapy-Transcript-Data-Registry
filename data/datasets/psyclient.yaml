id: psyclient
title: "PsyCLIENT-CP: Chinese Client Profiles for Counseling Simulation"
canonical_url: https://github.com/qiuhuachuan/PsyCLIENT
status: partially-verified
dataset_type: hybrid
dialogue_structure: unknown
domain: psychotherapy

source_context: >-
  Client-profile dataset and behavior-trajectory files for LLM-based
  simulated counseling clients, from the EMNLP 2026 paper "Client
  Simulation via Conversational Trajectory Modeling for Trainee Practice
  and Model Evaluation in Mental Health Counseling" (Qiu et al.). Two
  professional counselors constructed 120 Chinese client profiles spanning
  60 counseling topics. A further 324 conversational trajectories were
  derived from the Chinese counseling-dialogue dataset of Li et al. (2023),
  keeping dialogues with more than 30 turns and replacing client utterances
  with a de-identified content representation plus behavior labels. The
  simulator (Claude 3.5 Sonnet) conditions each client turn on a profile,
  a trajectory of target behaviors and reference content, and the dialogue
  history. The repository also ships a practice-room web app. The profiles
  are fictional constructed clients, not real clients, and no dialogue text
  is released. The trajectory file holds turn-ordered behavior labels only.
  The hybrid call is a judgment call. The profiles are human-constructed,
  while the trajectories are transformed from real human dialogues.

