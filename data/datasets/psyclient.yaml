last_verified: 2026-11-12
notes: >-
  Counted from the repository on 2026-11-12. client_profile/ holds 10 .txt
  files (one profile each, 1,503 to 3,188 characters), not the 120 profiles
  the paper and README claim, and conv_trajectory/ holds a single 1.json
  with 102 turns of role plus behavior labels and no reference-content text,
  not the 324 trajectories the paper reports. The paper reports profile
  lengths of 1,421 to 7,740 characters (mean 3,930), 89 of 120 profiles over
  2,000 characters, and 60 counseling topics. The README "Search 120 client
  profiles" claim does not match the shipped files. The full 120-profile set
  and the remaining trajectories have no locatable access route in the
  repository as of this check. Upstream lineage. The trajectories derive
  from Li et al. (2023), "Understanding client reactions in online mental
  health counseling" (ACL 2023, the Client-Reactions dataset, 550 dialogues
  in the PsyCLIENT paper account, 324 retained). That dataset has no registry
  record of its own yet. Evaluation involved 24 professional counselors
  rating authenticity and training utility. The paper reports Westlake
  University Institutional Ethics Committee approval No. 20211013LZZ001.
  Authors are Huachuan Qiu, Zhaoming Chen, Yuqian Chen, Yuan Xie, Yu Lu
  and Zhenzhong Lan (Westlake University and University of Utah). arXiv
  2601.07312, submitted 12 Jan 2026. EMNLP 2026 main, pages 975-1016.
