notes: >-
  The New York State Archives finding aid identifies 120 volumes, 60 cubic feet, covering 1859-1898.
  It describes typical entries as including names, admissions, ages, origins, physical conditions,
  observations of behavior, treatment procedures and other notes. The registry treats this as a
  historical clinical-record archive, not a verified psychotherapy transcript corpus. The finding
  aid was reachable through web search but returned an access error when opened directly in this session,
  so access and license remain unconfirmed.
