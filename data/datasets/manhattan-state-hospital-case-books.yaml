source_context: >-
  New York State Archives series B2579, 120 patient case books (60 cubic feet),
  1859-1898, from Manhattan State Hospital and its predecessor and branch
  facilities (New York City Asylum for the Insane, Blackwell's Island, Hart's
  Island Branch Lunatic Asylum). The finding aid's volume list numbers 120
  volumes, 1-120, spanning mixed, female-only, and male-only case books, plus
  Hart's Island branch case books (volumes 104-120) and one 1887-1889 volume
  covering people found arriving on ships from Europe and held for return.
  Typical entries record names, admission dates, ages, origins, physical
  conditions, observations of behavior, treatment procedures, and other notes.
