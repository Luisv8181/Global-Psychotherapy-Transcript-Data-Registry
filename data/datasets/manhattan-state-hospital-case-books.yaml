notes: >-
  The New York State Archives finding aid (series B2579) identifies 120 volumes,
  60 cubic feet, covering 1859-1898. It describes typical entries as including
  names, admissions, ages, origins, physical conditions, observations of behavior,
  treatment procedures and other notes. Re-verified 2026-11-20. The finding aid
  now opens directly (it returned an access error in September 2026) and the
  NYSA iarchives mirror carries the full 120-volume list, confirming the volume
  count and the branch coverage (Blackwell's Island, Hart's Island, and the New
  York City Asylum for the Insane). The registry treats this as a historical
  clinical-record archive, not a verified psychotherapy transcript corpus. Session
  and participant counts are not established, since 120 volumes is a volume count,
  not a session count. No license is stated on the finding aid. Related NYSA
  series under the same creator are patient case files W0133, patient indexes
  B2405, and annual reports B2604, which are separate records, not part of this
  series.
