id: anno-augmi
title: "Anno-AugMI and Anno-FairMI: Augmented AnnoMI Therapist Utterances"
canonical_url: https://github.com/vsrana-ai/Augmenting-AnnoMI
status: verified
dataset_type: hybrid
dialogue_structure: utterance_level
domain: psychotherapy
source_context: >-
  Therapist utterances from AnnoMI's motivational-interviewing demonstration transcripts, augmented
  with NL-Augmenter (noising, paraphrasing and similar transformations) to balance high- and
  low-quality MI labels, either across the whole set (Anno-AugMI) or within each topic
  (Anno-FairMI). Released as isolated labelled utterances, without conversation ids or turn order.
languages: [en]
language_context: original
therapy_modalities:
  - motivational_interviewing
sessions: null
longitudinal: false
transcript:
  available: true
  format:
    - csv
modalities:
  - text
annotations:
  - mi_quality_labels
  - topic_labels
access:
  level: open
  requirements: None. Both CSV files are in the public GitHub repository.
redistribution: conditional
license:
  type: none-selected
  verified: true
  source: https://github.com/vsrana-ai/Augmenting-AnnoMI
  notes: >-
    The repository has no license file and its README states no license. The utterances derive from
    AnnoMI, whose own release terms are recorded on the AnnoMI record and remain partly unconfirmed.
privacy:
