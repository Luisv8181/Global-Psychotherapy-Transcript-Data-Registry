publication_year: 2023
historical_significance:
  - augmentation for label balance and topic-wise fairness in counseling-quality classification
notes: >-
  Counted from the repository on 2026-09-26 (commit 2bdecfa). Anno-AugMI.csv has 5,302 rows (5,182
  distinct utterances), 2,938 with mi_quality 0 and 2,364 with mi_quality 1, over 43 topics.
  Anno-FairMI.csv has 9,154 rows (5,369 distinct utterances), 4,556 with 0 and 4,598 with 1, over
  10 topics. Topic counts treat labels that differ only by a trailing space as one; the raw files
  hold 44 and 11 distinct strings. Which of 0 and 1 means high quality is not stated in the files or
  README. Each row holds only the utterance, its label and its topic, so conversations cannot be
  reconstructed, hence dialogue_structure utterance_level. The bundled preprint describes an 11-step
  NL-Augmenter pipeline applied to single therapist utterances. The README cites the SDAIH 2023
  workshop paper (SciTePress, DOI above). AnnoMI itself is recorded separately as demonstration.
last_verified: 2026-09-26
