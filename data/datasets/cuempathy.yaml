notes: >-
  156 selected sessions from 428 recorded November 2017 to October 2019 in a 20-week
  psychotherapy practicum at a CUHK counseling clinic. 39 therapist-client dyads with
  4 sessions each, about 50 minutes each. Clients are real help-seeking adults seen by
  trainee therapists under supervision. Sessions are in Hong Kong Cantonese with
  occasional English code-mixing, transcribed in traditional Chinese characters. Names
  and locations were removed from the transcriptions. Only research personnel involved
  in the study may access the audio data and text transcriptions, and no public release,
  repository, dataset card or download route exists as of this check, so no dataset
  license could be established. The record's earlier language value of English came from
  the publication page, which describes the paper, not the data. Because the corpus holds
  recordings of real identifiable clients, any change to how this record is used needs
  the repository owner.
