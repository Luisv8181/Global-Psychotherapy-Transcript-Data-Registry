id: daic-woz
title: "DAIC-WOZ: Distress Analysis Interview Corpus, Wizard-of-Oz Interviews"
canonical_url: https://dcapswoz.ict.usc.edu/
status: verified
dataset_type: real
dialogue_structure: multi_turn
domain: clinical_interview
source_context: >-
  Semi-structured clinical interviews designed to support the diagnosis of depression, PTSD and
  anxiety, conducted in English by Ellie, an animated virtual interviewer controlled by a human in
  another room. The Wizard-of-Oz participants were recruited through Craigslist online ads only;
  the US veterans' facility recruitment in the wider DAIC was for the face-to-face and automated
  arms, not this subset. Participants include both distressed and non-distressed people, 60 of 193
  collected interviews distressed per the paper's Table 1. These are screening interviews, not
  therapy sessions.
