access:
  level: research-agreement
  requirements: >-
    Request through the DAIC-WOZ site's Apply Now route with a signed DAIC-WOZ End-User License
    Agreement; the form asks for a university-affiliated email. The 2014 paper says the corpus is
    shared case by case, on request, for research purposes.
redistribution: prohibited
license:
  type: research_access_agreement
  verified: true
  source: https://forms.zohopublic.com/websupport2/form/DAICWOZEndUserLicenseAgreement/formperma/hI_A2994P58EhnvMBTuMF7QwCKGY-XHogrksVpC0OZk
  notes: >-
    The DAIC-WOZ End-User License Agreement itself, read 2026-11-16 at the agreement form for
    this database. It allows non-commercial research use only, forbids commercial use, forbids
    distributing the database or parts of it to any third party, allows illustrative use in
    publications with subjects' identities protected, and requires citing Gratch et al. (LREC
    2014). The Extended DAIC has a separate agreement form with near-identical terms that
    additionally requires citing the AVEC 2019 paper, and the ihp-lab.org PDF previously recorded
    is that Extended DAIC agreement.
