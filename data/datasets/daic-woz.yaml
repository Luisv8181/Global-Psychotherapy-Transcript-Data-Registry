publication_year: 2014
historical_significance:
  - widely used benchmark for automatic depression detection from interviews (AVEC challenges)
notes: >-
  Re-verified 2026-11-16 against live primary sources. The DAIC-WOZ site now loads; it returned
  HTTP 403 (Cloudflare) in September 2026. The site, updated 2026-10-26, confirms 189 sessions of
  7 to 33 minutes with an average of 16 minutes, each with a transcript, participant audio and
  facial features. The LREC 2014 paper (Gratch et al.) describes the wider DAIC, with
  face-to-face, teleconference, Wizard-of-Oz and automated interviews; participants completed a
  consent form that included optional consent to share their data for research. Its Table 1
  counts 193 Wizard-of-Oz interviews collected, 60 distressed and 133 not, all transcribed, so
  the released package holds 189 after 4 exclusions for technical reasons. Its documentation
  (re-read 2026-11-16) says the package holds 189 session folders numbered 300 to 492, with
  sessions 342, 394, 398 and 460 excluded, and gives per-session scrubbed audio, a scrubbed
  transcript, facial and acoustic features, and PHQ-8 labels and train/dev/test splits from AVEC
  2017. Sessions 451, 458 and 480 lack the interviewer's side of the transcript. Duration figures
  disagree, and both are recorded. The paper says Wizard-of-Oz interviews ran 5 to 20 minutes,
  while the site says released sessions range 7 to 33 minutes with an average of 16 minutes. The
  DAIC-WOZ agreement itself was read 2026-11-16 (see license). No ethics-review statement was
  found in the paper, so ethics_review_documented stays unknown. The Extended DAIC is a separate,
  larger release not recorded here, and its documentation is still being created per the site.
last_verified: 2026-11-16
