notes: >-
  Classification is demonstration, not synthetic: both subcorpora are human-produced sessions made
  to teach or illustrate counselling (textbook pedagogical material; students role-playing clients
  with a counsellor), with no model-generated dialogue. The paper's own word is "simulated". The
  29/57 split, the 152,000-character total, the turn counts (speech 72.03 turns per dialog, text
  53.68), and the agreement figures are the paper's published figures (Tables 1, 3-8 and section 4),
  not independently re-counted; no data files were accessible to count. Longitudinal design is
  left null: 24 speech sessions form series of 2 to 5 sessions with the same client-counsellor
  pair, so repeated-session structure exists for that subcorpus, but no longitudinal study design
  is claimed. Participants is left null: the text subcorpus counts 18 students plus one
  counsellor, but the speech subcorpus gives no participant count. Related resource, not the same
  corpus: the same lead author published "A Counselling Corpus in Cantonese" (Lee, Cai, Xie and
  Xing, SLTU-CCURL 2020), a post-reply-pair corpus for a virtual counsellor, available on request
  to the first author; it is queued as a separate lead in docs/candidate-queue.md because it is
  mostly chitchat pairs plus test-anxiety items rather than counselling conversations. No
  transcript, audio, or video content is included here and no per-session list is catalogued.
