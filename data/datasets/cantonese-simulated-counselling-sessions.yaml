access:
  level: metadata-only
  requirements: >-
    No locatable release artifact as of 2026-11-09. The paper calls this "the first publicly
    available corpus of counselling sessions in Cantonese" and footnotes
    https://github.com/CantoneseCounsellorChatbot, but that GitHub user/organization returns
    HTTP 404 via the GitHub API (checked 2026-11-09), a GitHub repository search for the name
    returns 0 results, and a web search finds no other code repository, dataset card, or download
    route. The ACL Anthology page for the paper lists no code or data link. The corpus (transcripts,
    annotations) is therefore not distributed through any route this review could locate; revisit
    if the authors publish a repository or dataset card.
