id: cantonese-simulated-counselling-sessions
title: "A Corpus of Simulated Counselling Sessions with Dialog Act Annotation"
canonical_url: https://aclanthology.org/2022.lrec-1.615/
status: partially-verified
dataset_type: demonstration
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  86 simulated counselling sessions in Cantonese (152,000 Chinese characters) by John S. Y. Lee,
  Haley H. M. Fong, L. S. Judy Wong, Chun Chung Mak, Chi Hin Yip and C. W. Larry Ng (City
  University of Hong Kong), LREC 2022, pp. 5723-5730. Two subcorpora. Speech (29 dialogs):
  transcripts of pedagogical counselling materials from textbooks by Professor Yeung-Chan (2002;
  2004; 2006a; 2006b), produced by professional social workers and based on authentic cases
  involving domestic violence and marriage and family relationship issues; the speech is
  pre-planned to some extent and not entirely spontaneous. Five of the 29 sessions are
  independent; the remaining 24 form series of 2 to 5 sessions between the same client and
  counsellor. Text (57 dialogs): 18 undergraduate students chatting on WhatsApp with a freelance
  counsellor (native Cantonese speaker, Master's degree in Counselling), 60 to 90 minutes per
  session, 1 to 8 sessions per student, discussing 2 to 6 symptoms drawn from loneliness,
  academic anxiety and test anxiety. Every utterance carries a dialog act label (client and
  counsellor tagsets), each dialog is segmented into five stages (Introduction, Current Picture,
  Desired Picture, Moving Forward, Closing, following Egan's Skilled Helper Model), and forward
  and backward links relate utterances to each other. Inter-annotator agreement: client dialog
  act 74.98% (Cohen's kappa 0.56, moderate), counsellor dialog act 71.43% (kappa 0.70,
  substantial), backward links 75.76% (kappa 0.887, almost perfect), stages 74.22% (kappa 0.60,
  moderate). Funded by the Health and Medical Research Fund (project 17180961), Food and Health
  Bureau, Government of the Hong Kong Special Administrative Region.
