notes: >-
  Counted from CBT_dialogues.jsonl on 2026-11-02, 9,000 rows, matching
  the card and the paper. Stage split is exactly 3,000 early, 3,000
  middle and 3,000 late, and each of the six topics holds exactly 1,500
  rows, consistent with 3,000 profiles times three stages. Segment split
  counted from the same file is Adults 3,522, General medical 1,542,
  Other 1,650, Elderly 576, Adolescents 549, Perinatal 900 and Children
  261. The paper reports an 80/10/10 train/validation/test split of the
  same 9,000 pairs, but the released file carries no split column, so a
  user cannot recover the paper's held-out test set from the download.
  The paper also fine-tunes LLaMA-3.1-8B on the data as SA-CBT-LLM, but
  neither the paper nor the card names the model that generated the
  dialogues, so the generating model is left unrecorded. One URL
  discrepancy is preserved here rather than smoothed over. The paper
  prints the dataset address without a hyphen before CBT, while the
  live Hugging Face dataset id carries that hyphen, and the hyphenated
  address is the one that resolves. The card still says the paper link
  will be added after publication, even though the workshop paper is now
  public, so the card is stale on that point. Authors are Aijia Yuan,
  Yang Gao, Edlin Garcia, Jianna Hur and Sagar Samtani, Indiana
  University Bloomington, and the paper appeared at the AI for Cognitive
  and Mental Health Support workshop at KDD 2026. Each row is a single
  exchange, so the structure is recorded as single-turn question-answer
  even though the dataset name uses the word dialogues. The three rows
  sharing a profile id are linked by that id and by the state card, not
  by a multi-turn conversation transcript.
