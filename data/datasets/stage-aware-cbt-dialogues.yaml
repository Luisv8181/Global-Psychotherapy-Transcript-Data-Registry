id: stage-aware-cbt-dialogues
title: "Mental Health CBT Dialogues"
canonical_url: https://huggingface.co/datasets/yuana1234567/Mental-health-CBT-dialogues
status: verified
dataset_type: synthetic
dialogue_structure: single_turn_qa
domain: psychotherapy
source_context: >-
  Synthetic stage-aware cognitive behavioral therapy dialogue pairs
  generated for inter-session support research. Each row is one patient
  message plus one therapist response for a synthetic patient profile at
  one CBT stage, with the prior action plan and therapeutic progress
  carried forward to the next stage through a state card. Seed material
  came from therapist-patient dialogues in Beck's CBT Manual, used as
  ground-truth exemplars for prompting, not as released data. Three
  exchanges were generated per profile, one for each of the early, middle
  and late stages of treatment. Two mental health experts reviewed
  randomly selected subsets balanced across stages and their feedback
  refined phrasing, tone and therapeutic framing.
therapy_modalities:
  - cognitive_behavioral_therapy
