id: theraphase
title: "TheraPhase: A Multi-Session Treatment Outcome Evaluation Dataset"
canonical_url: https://huggingface.co/datasets/UTSNLPGroup/TheraPhase
status: partially-verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Paired initial-stage and completion-stage client records derived from CPsyCoun, using 5-shot
  GPT-4 prompting to extract initial-stage information from each client's comprehensive record
  (paper section 2.4). The paper's Limitations state the pairs were derived by splitting single
  multi-turn conversations, which can represent client change but cannot fully capture the
  characteristics of true multi-session data. The result supports comparison of client information
  across treatment stages and should not be treated as raw observed longitudinal therapy transcripts.
geography:
  countries:
    - China
languages:
  - zh
language_context: original
sessions: 800
participants: 400
longitudinal: true
annotations:
  - initial-stage/completion-stage client pairing
  - symptom and treatment-outcome evaluation fields
  - SCL-90 dimension scores per interview in AssessmentResult.csv
  - Delta_PSDI treatment-outcome scores per client in TreatmentResult.csv
transcript:
  available: true
audio:
  available: false
video:
  available: false
modalities:
  - text
generation:
  method: LLM_based_stage_extraction
  source_type: CPsyCounD / CPsyCoun
  synthetic_dialogues: true
access:
  level: open
  requirements: Public Hugging Face dataset page.
redistribution: unknown
license:
  type: unknown
  verified: false
privacy:
  deidentified: true
  contextual_reidentification_assessed: unknown
  notes: >-
    The LREC 2026 paper's Ethics Statement says all datasets used in the study are either fully
    synthetic, thus free of personally identifiable information, or have been rigorously anonymized
    and are employed strictly under their original usage agreements. That is a blanket statement
    covering every dataset in the study, not a TheraPhase-specific de-identification method, so no
    method is recorded here.
ethics:
  consent_documented: unknown
  ethics_review_documented: unknown
  data_use_agreement: unknown
evidence:
  primary_sources:
