historical_significance:
  - explicit treatment-stage pairing built from an existing reconstructed counseling resource
notes: >-
  The dataset card reports 400 clients and 800 sessions, with each client paired across an initial
  and completion stage. The TheraPhase paper states that the dataset was constructed from CPsyCoun
  and that GPT-4 was used in a 5-shot prompt to extract initial-stage information from comprehensive
  client information. This establishes a derived relationship to CPsyCounD, but does not establish
  that the 800 sessions are observed real therapy encounters. The current Hugging Face page reports
  9,216 rows and 1.36 MB total file size. Dataset-specific license and privacy terms were not
  established in this pass.
