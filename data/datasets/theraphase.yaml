    target: cpsycound
    notes: The TheraPhase paper states that the dataset was constructed based on CPsyCoun; GPT-4 was used to extract initial-stage information from the comprehensive client information.
publication_year: 2026
release_year: 2026
historical_significance:
  - explicit treatment-stage pairing built from an existing reconstructed counseling resource
notes: >-
  The dataset card reports 400 clients and 800 sessions, with each client paired across an initial
  and completion stage. Counted from the Hugging Face repository tree on 2026-11-15: 800 case
  files under TheraPhase/ across 400 distinct client ids, 1,315,034 bytes total; AssessmentResult.csv
  holds 800 data rows and TreatmentResult.csv 400 data rows. The TheraPhase paper states that the
  dataset was constructed from CPsyCoun and that GPT-4 was used in a 5-shot prompt to extract
  initial-stage information from comprehensive client information. This establishes a derived
  relationship to CPsyCounD, but does not establish that the 800 sessions are observed real therapy
  encounters. No license is declared on the dataset card (cardData is null) and no LICENSE file is
  in the repository as of 2026-11-15, so license and redistribution stay unknown. No therapy
  modality is named in the paper or on the card.
last_verified: 2026-11-15
