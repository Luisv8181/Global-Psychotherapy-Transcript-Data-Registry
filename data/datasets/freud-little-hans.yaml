notes: >-
  Historical dialogue resource. Rights for a digitized public-domain edition and rights for later
  scholarly translations should be evaluated separately before redistribution. Correction on
  2026-10-03. The record previously linked Project Gutenberg ebook 43256, which is an unrelated
  novel (Witches Cove); Project Gutenberg's list of Freud's works has no edition of this case. The
  link now points to the case's first printing, in the Jahrbuch für psychoanalytische und
  psychopathologische Forschungen, volume 1, first half (Leipzig and Vienna, Deuticke, 1909),
  digitized by the Internet Archive. Its table of contents, read on 2026-10-03, lists Freud's
  Analyse der Phobie eines fünfjährigen Knaben.
