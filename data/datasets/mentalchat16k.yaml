notes: >-
  Re-verified 2026-11-19 against the Hugging Face dataset card, the GitHub README, the KDD 2025
  paper (PMC12520247) and the PISCES trial registration NCT01444027. Of 421 caregivers who completed
  the information survey, the README reports that most are female and 88% identify as White, with
  fewer than 1% Hispanic. The real component is paraphrased question-answer pairs, not full session
  transcripts, so it is not counted as real-session data. Sessions is the paper Table 1 figure of
  378 interview transcripts; the underlying trial gave each caregiver three formal visits plus one
  exit visit, so the design is longitudinal. Geography is the United States: the trial registration
  lists the single site as University of Washington, Seattle, WA, with NINR as collaborator, and
  the paper's authors are at the University of Pennsylvania. Consent is documented in the paper
  ("Upon consent to participate in the study, 514 caregivers were enrolled"); no IRB or
  ethics-review statement was found in the full text, so ethics_review_documented stays unknown.
  Source disagreement recorded: the PMC rendering of the paper Table 1 swaps the two rows (it
  lists Interview Data as 9,775 rows and Synthetic Data as 6,338), while both the Hugging Face
  card and the GitHub README give interview 6,338 pairs and synthetic 9,775; the figures here
  follow the card and README. Row count counted from the released file this run: the single
  train parquet at the data location holds 16,084 rows, 29 fewer than the README total of 16,113
  (6,338 + 9,775). The README's dataset citation is dated 2024; the paper appeared in KDD 2025
  (ACM) and on PMC.
