id: mentalchat16k
title: "MentalChat16K: A Benchmark Dataset for Conversational Mental Health Assistance"
canonical_url: https://huggingface.co/datasets/ShenLab/MentalChat16K
status: verified
dataset_type: hybrid
dialogue_structure: single_turn_qa
domain: mental_health_counseling
source_context: >-
  Two components. 6,338 question-answer pairs paraphrased (with Mistral-Instruct) from 378
  anonymized real interview transcripts of the PISCES clinical trial, between behavioral health
  coaches and caregivers of patients in palliative or hospice care. 9,775 synthetic question-answer
  pairs generated with GPT-3.5 Turbo across 33 mental health topics.
