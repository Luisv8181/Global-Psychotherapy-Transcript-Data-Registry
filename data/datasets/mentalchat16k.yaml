notes: >-
  Of 421 caregivers who completed the information survey, the README reports that most are female
  and 88% identify as White, with fewer than 1% Hispanic. The real component is paraphrased
  question-answer pairs, not full session transcripts, so it is not counted as real-session data.
  The README's dataset citation is dated 2024; the paper appeared in KDD 2025 (ACM) and on PMC.
  Counts: the paper and README claim 6,338 interview pairs and 9,775 synthetic pairs (16,113 total),
  but the released files counted on 2026-11-14 hold 6,310 rows in Interview_Data_6K.csv and 9,774 rows
  in Synthetic_Data_10K.csv (16,084 total). The paper's Table 1 also appears to swap the two row
  sizes, listing 9,775 for Interview Data and 6,338 for Synthetic Data, while the paper text, the
  README and the released files all agree on the other assignment, and 378 sessions at 16.8 pairs per
  session matches the interview side. Geography reflects the PISCES trial site only; the synthetic
  component has no geography. Longitudinal stays unknown because the source trial ran repeat visits
  per caregiver (three formal visits plus one exit visit) but the released pairs carry no visit or
  session linkage in the files. The paper states participants signed informed consent and that
  consent to release the paraphrased transcripts was obtained after manual removal of identifying
  information; no IRB approval statement was found in the paper sections read, so ethics review
  stays unknown.
