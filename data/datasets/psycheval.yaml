notes: >-
  The arXiv paper describes PsychEval as a generated benchmark built from 369 empirically sourced
  clinical case reports. The construction uses GPT-5 to synthesize and reconstruct multi-session
  dialogues, with 6–10 sessions per client, across five named therapy approaches plus an integrative
  category. The paper reports more than 2,000 client profiles, 677 meta-skills and 4,577 atomic
  skills. It explicitly states that the benchmark simulates the full counseling trajectory rather
  than providing naturally observed session transcripts. The record is classified hybrid because
  human-derived case-report material is transformed into generated dialogue. The root repository
  was inspected on 2026-09-26 and contains the dataset directories and a CC BY-NC 4.0 LICENSE.
  Exact released record counts by therapy and the scope of the root license over all data files
  remain to be audited.
last_verified: 2026-09-26
