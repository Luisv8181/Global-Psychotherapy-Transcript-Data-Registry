notes: >-
  Re-verified against the full CLPsych 2025 paper on 2026-11-14. The paper
  reports 10,464 synthetic therapy dialogues generated with GPT-3 and Falcon
  7b prompts built on the EPITOME empathy framework, plus 579 annotated
  human therapeutic interactions. The 579 break down as 365 dialogue pairs
  from the MOST+ trial, an Australian headspace youth service, and 214 from
  Alexander Street Press transcripts, while the 3,081 Reddit dialogue pairs
  are the Sharma et al. baseline dataset and not part of the 579. No release
  artifact exists, so transcript availability is recorded as not released and
  access as metadata-only, and the release year is removed. No dataset license
  is stated anywhere in the paper or in any release location, so the dataset
  license stays unknown. Geography stays unknown because the synthetic
  dialogues carry no stated geography, and the Australian and Alexander Street
  sources of the annotated subset do not establish the geography of the corpus
  as a whole. Three authors annotated the data after nine one-hour training
  sessions with feedback from a clinical psychologist.
