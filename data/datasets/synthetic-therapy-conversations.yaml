notes: >-
  Row counts were counted from the data files on 2026-11-12: train 6,719 rows,
  validation 38 rows, test 50 rows, 6,807 rows in total. Column headers are
  human and ai. The Hugging Face API reports the dataset created 2023-12-12,
  last modified 2023-12-19, with no license and no description. Do not cite this
  record as evidence that the dialogues are model-generated: the word synthetic
  in the dataset name is the uploader's label only, and no generation method is
  documented. Classification as synthetic, demonstration, or any other type
  needs a stated generation method or source. The merged derivative
  RishiKompelli/Therapybotdataset (no license, no card, merges eight upstream
  sources per its main.py) was screened in the same pass and not recorded: it
  adds no independent underlying collection and documents no provenance or
  license of its own.
