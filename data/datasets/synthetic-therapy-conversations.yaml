status: partially-verified
dataset_type: unknown
dialogue_structure: single_turn_qa
domain: psychotherapy
source_context: >-
  A Hugging Face dataset uploaded by user Mr-Bhaskar in December 2023, with no
  README, no description, no paper, and no stated generation method. It ships as
  three CSV files (train, validation, test) with two columns, human and ai. Each
  row is one human turn followed by one AI response, with no conversation
  identifier or turn order, so no multi-turn structure can be reconstructed. The
  uploader's name for the dataset asserts it is synthetic, but no generation
  method, model, prompt, or source is documented anywhere on the dataset page,
  so provenance is recorded as unknown rather than synthetic. The same three
  files are used as one input to the merged derivative
  RishiKompelli/Therapybotdataset, which is a separate resource, not this record.
