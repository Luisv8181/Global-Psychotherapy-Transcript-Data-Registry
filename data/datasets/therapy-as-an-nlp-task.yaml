notes: >-
  Release not yet fulfilled: the v3 paper (revised 2026-09-21, published in
  Proc. ACM Hum.-Comput. Interact., Vol. 10, No. 6, Article CSCW196, October
  2026) says the authors publicly release the three components at the GitHub
  URL, but the repository tree on 2026-10-13 contains only .gitignore, LICENSE
  and README.md. The arXiv "Code, Data and Media" section links no artifacts,
  and a Hugging Face dataset search for "human-llm-cbt-evals" returned no
  results. The human half is peer_support (trained peer counselors with real
  platform users); the LLM half reuses the clients' actual messages with
  LLM-generated counselor turns, so the corpus is a paired comparison, not
  fully synthetic. The paper says the study's IRB determined the work fell under
  program evaluation rather than human subjects research. Platform ethnography
  ran 2023-05-18 to 2024-10-12; per-session collection dates are not broken out.
