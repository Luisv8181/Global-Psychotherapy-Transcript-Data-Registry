id: therapy-as-an-nlp-task
title: "Therapy as an NLP Task: Comparing LLMs and Human Peers Behaviors in CBT Sessions"
canonical_url: https://github.com/brownhci/human-llm-cbt-evals
status: partially-verified
dataset_type: peer_support
dialogue_structure: multi_turn
domain: counseling

source_context: >-
  Comparative corpus from Iftikhar et al. (PACM HCI / CSCW 2026, Article CSCW196),
  built from Cheeseburger Therapy, a real-time online text-based peer support
  platform where users chat with trained peer counselors in single-session CBT.
  27 original human peer-counseling sessions (client messages preserved) are
  paired with 27 LLM-counseled sessions generated by a CBT-prompted GPT-4 that
  takes the clients' own messages from the original sessions as input prompts,
  holding the user side constant. A Psychologists Evaluation Dataset covers all
  54 sessions: CTRS scores (11 items, 7-point 0-6 scale) and session feedback
  surveys from three licensed clinical psychologists, plus a Counselor Comparison
  Survey. The paper's Data Release section promises all three components at the
  GitHub URL, but as of 2026-10-13 the repository holds only a LICENSE
  (CC0-1.0), README.md and .gitignore, and its README still carries the stale
  "will be made publicly available upon acceptance" note, so no data files are
  downloadable yet.
therapy_modalities:
  - cognitive_behavioral_therapy
languages:
  - en
sessions: 54
participants: unknown
longitudinal: false
annotations:
  - CTRS scores (11 items, 0-6 per item) from three licensed clinical psychologists
  - Session Feedback Survey text from all three psychologists
  - Counselor Comparison Survey
  - Message attributes: message text, FromThinker flag, timestamp, offset, MessageID
  - Session attributes: Session ID, Counselor ID, source (human vs LLM)
  - Session Notes attributes: CBT labels per session (Event, Thoughts, Feelings, Behavior, Cognitive Distortion)
