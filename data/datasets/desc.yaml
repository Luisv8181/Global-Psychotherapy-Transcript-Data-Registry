notes: >-
  Counted from the released data files on 2026-10-13: 730 train + 126 valid +
  120 test = 976 dialogues, matching the paper's reported split. Turns per
  dialogue in the released files range 25-79 (test) against the paper's
  reported 24-111 range with mean 42. Each turn carries speaker
  (seeker/supporter), a strategy annotation on supporter turns (including a
  Diagnosis strategy for the PHQ-9 turns), persona sentences, and a
  survey_score block (emotion intensity, empathy, relevance). The paper prints
  the repository URL as github.com/seungyeonseo/DiagESC (no hyphen); that URL
  does not resolve, and the live repository is
  github.com/seungyeon-seo/DiagESC with first commits 2024-05-18. Authors:
  Seungyeon Seo and Gary Geunbae Lee (POSTECH, Republic of Korea); presented
  at SIGDIAL 2024. The paper's limitation section states the diagnostic
  outcomes are intended solely for guidance, not definitive diagnosis.
  Geography left null: author affiliation is Korean but the dialogues are in
  English and the base crowdworker data's geography is not documented.
