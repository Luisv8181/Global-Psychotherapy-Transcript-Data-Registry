id: desc
title: "DESC: Diagnostic Emotional Support Conversation dataset"
canonical_url: https://github.com/seungyeon-seo/DiagESC
status: partially-verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: mental_health_support
source_context: >-
  Dataset for the DiagESC task: PHQ-9-based depression diagnostic questioning
  integrated into emotional support conversations. The emotional-support base
  dialogue comes from the PESConv dataset (persona-augmented ESConv, Cheng et
  al., 2023; crowdworker-collected support conversations with per-utterance
  support-strategy tags); diagnostic turns are LLM-generated -- PHQ-9 symptom
  questions by the supporter and paraphrased/augmented PHQ-9 frequency answers
  by the seeker -- with keyword and model-based filtering, pre-assigned severity
  labels, and expert (psychologist) verification of the validation and test
  sets. A final supporter utterance delivers severity-based advice, escalating
  to recommending a hospital or counselor at high severity.
