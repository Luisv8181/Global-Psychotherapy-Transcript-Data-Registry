id: cbt-bench
title: "CBT-Bench: Evaluating Large Language Models on Assisting Cognitive Behavior Therapy"
canonical_url: https://huggingface.co/datasets/Psychotherapy-LLM/CBT-Bench
status: partially-verified
dataset_type: hybrid
dialogue_structure: single_turn_qa
domain: psychotherapy
source_context: >-
  Three-level benchmark for evaluating LLMs on assisting cognitive behavior
  therapy, from Zhang et al. Level I is CBT-QA, multiple-choice questions on
  CBT knowledge drawn from graduate CBT course exams plus items composed by
  CBT experts. Level II is cognitive model understanding, with classification
  examples built from patient speech in the TherapistQA dataset, which the
  paper says was sourced from mental-health-related posts in online forums.
  Experts extracted situation-plus-thought segments from each post and
  annotated them for cognitive distortions, primary core beliefs, and
  fine-grained core beliefs. Level III is CBT-DP, 156 Deliberate Practice
  exercises in the Boswell and Constantino tradition, each a typical patient
  speech across ten key aspects of CBT sessions at three difficulty levels,
  with a reference therapist response. The release also carries model
  generations for the DP exercises and expert pairwise comparisons of
  references against generations. No component is a real therapy session.
  The hybrid call is a judgment on this mixed composition - forum-derived
  material transformed by expert extraction and annotation, plus
  expert-composed test items and teaching exercises - rather than a claim
  that the whole release has one provenance.
therapy_modalities:
  - cognitive_behavioral_therapy
languages:
  - en
annotations:
  - cognitive_distortion_labels
  - primary_core_belief_labels
  - fine_grained_core_belief_labels
  - cbt_qa_answer_choices
  - deliberate_practice_reference_responses
  - expert_pairwise_comparisons
  - model_generations_for_dp_exercises
transcript:
  available: true
  format:
    - json
audio:
  available: false
video:
  available: false
access:
  level: open
  requirements: >-
    Public Hugging Face dataset under the Psychotherapy-LLM organization,
    downloadable with no registration or gating.
redistribution: conditional
license:
  type: CC-BY-NC-4.0
  verified: true
  source: https://huggingface.co/datasets/Psychotherapy-LLM/CBT-Bench
  notes: >-
    The dataset card metadata where the data lives declares license
    cc-by-nc-4.0, so that is the type recorded here. Two conflicting
    statements are unresolved, which is why the record stays
    partially-verified rather than verified. The paper PDF footer states
    CC BY-NC-SA 4.0, which adds a share-alike clause the card does not
    carry, and the companion code repository mianzhang/CBT-Bench contains
    no LICENSE file. Reusers should check the card and the paper before
    redistributing, and should not assume the share-alike clause away.
privacy:
  deidentified: unknown
  contextual_reidentification_assessed: unknown
  notes: >-
    No real therapy sessions are included, so no client de-identification
    claim applies to Levels I and III. Level II segments derive from public
    forum posts via TherapistQA, but no de-identification or consent
    statement for that derivation was confirmed from the sources read
    this run, so both fields stay unknown.
