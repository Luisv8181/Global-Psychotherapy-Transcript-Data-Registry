id: cbt-bench
title: "CBT-Bench: Evaluating Large Language Models on Assisting Cognitive Behavior Therapy"
canonical_url: https://huggingface.co/datasets/Psychotherapy-LLM/CBT-Bench
status: verified
dataset_type: hybrid
dialogue_structure: mixed
domain: psychotherapy
source_context: >-
  A benchmark for evaluating large language models on assisting cognitive
  behavior therapy (CBT), built with clinical psychologists, social work
  professors and hired CBT experts. Three levels. Level I (CBT-QA) is 220
  multiple-choice questions testing basic CBT knowledge, 92 drawn from
  graduate CBT course exams and 178 composed by CBT experts, plus 47 seed
  examples. Level II tests cognitive model understanding on patient speech
  taken from the TherapistQA dataset, itself sourced from mental-health-related
  posts in online forums, with experts extracting situation and thought
  segments and creating plausible imagined situations and thoughts where the
  originals were insufficiently detailed. CBT-CD has 146 cognitive distortion
  examples, CBT-PC 184 primary core belief examples and CBT-FC 112
  fine-grained core belief examples, plus 20 seed examples each. Level III
  (CBT-DP) has 156 deliberate practice exercises from Boswell and Constantino
  2022, ten categories of typical patient speech in CBT sessions with
  reference therapist responses, used as a proxy for real session efficacy
  because real CBT session data is hard to access. An evaluation benchmark of
  AI behavior and expert-composed therapy scenarios, not a corpus of real
  therapy sessions, recorded as adjacent psychotherapy scope.
languages:
  - en
therapy_modalities:
  - cognitive_behavioral_therapy
sessions: null
longitudinal: false
annotations:
  - cognitive distortion labels (10 categories)
  - primary core belief labels (helpless, unlovable, worthless)
  - fine-grained core belief labels (19 categories)
  - CBT knowledge-type labels for CBT-QA (basic concepts, practical knowledge, case studies, other)
  - pairwise expert preference judgments for CBT-DP (468 comparisons)
