notes: >-
  Counts verified by downloading and counting the data files on 2026-11-14.
  qa_test.json holds 220 rows and qa_seed.json 47 rows, distortions_test.json
  146, core_major_test.json 184 and core_fine_test.json 112, each with a
  20-row seed file, and the ten CBT-DP reference files total 156 exercises.
  The paper reports 270 CBT-QA pairs in total with 50 seed examples, but the
  released qa_seed.json holds 47 rows, so the released seed count and the
  paper disagree by three. The paper reports the same 146, 184 and 112 test
  counts as the released files. Dataset card last modified 2025-09-19 per the
  Hugging Face API. The GitHub code repository was last updated 2026-08-11 and
  holds evaluation code, not the data files. Provenance is mixed across the
  three levels, so dataset_type hybrid is a best fit for the record as a
  whole, with Level III closer to demonstration and Level I expert-composed
  exam and QA material. Level II patient speech derives from TherapistQA forum
  posts, not from real therapy sessions, and no real clients appear in any
  level.
