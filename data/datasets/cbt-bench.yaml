notes: >-
  Authors: Mian Zhang, Xianjun Yang, Xinlu Zhang, Travis Labrum, Jamie C.
  Chiu, Shaun M. Eack, Fei Fang, William Yang Wang, Zhiyu Zoey Chen (UT
  Dallas, UC Santa Barbara, University of Pittsburgh, Princeton, Carnegie
  Mellon). Paper published 2024-10-17, v2 2025-01-26, NAACL 2025 camera
  ready. Counts counted from the data files on 2026-11-10: 662 test items
  (220 QA + 146 distortions + 184 core major + 112 core fine), 107 seed
  items held out for training or in-context learning, and 156 CBT-DP
  exercises, for 925 benchmark items in total. The repository also ships
  Llama-3.1-8B and Llama-3.1-405B generations for the CBT-DP exercises and a
  dp-pairwise-comparison.json file with 468 comparison entries; those are
  model outputs and evaluation artifacts, not additional benchmark items.
  The CBT-QA answers are not disclosed in the data files; the README points
  to a Hugging Face Space tool for scoring. The paper's IRB approval and
  informed consent cover the eight hired expert annotators and evaluators
  (Upwork, graduate degree plus at least 5 hours of CBT training, $60 per
  hour), not the authors of the forum posts behind Level II. Level II seed
  files and the CBT-DP model generations were downloaded and counted, not
  read in full. Do not cite this record for turn-taking or dialogue dynamics
  evidence: every item is a single-turn question, classification, or
  response-generation exercise.
