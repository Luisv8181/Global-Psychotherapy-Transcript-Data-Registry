publication_year: 2025
last_verified: 2026-11-03
notes: >-
  Test-set counts verified by counting the released data files on
  2026-11-03, and they match the paper and the dataset README. CBT-QA test
  220 items, CBT-CD distortions test 146, CBT-PC primary core belief test
  184, CBT-FC fine-grained core belief test 112, and CBT-DP reference
  exercises 156 in total across ten files, 14, 16, 15, 17, 16, 15, 17, 16,
  15 and 15 per file. Seed files counted the same day are qa_seed 47,
  distortions_seed 20, core_major_seed 20 and core_fine_seed 20. The
  qa_seed count disagrees with the paper, which says 50 QA pairs were held
  out for in-context use from 270 total, 220 test plus 50 held out. The
  released qa_seed.json holds 47 rows, so the 50 figure is recorded here
  as the paper claim and 47 as the counted file, not reconciled. The
  dp-pairwise-comparison.json file holds 468 rows. Ten distortion
  categories, three primary core beliefs (helpless, unlovable, worthless)
  and 19 fine-grained core belief categories are named in the paper and
  README. Authors are Mian Zhang, Xianjun Yang, Xinlu Zhang, Travis
  Labrum, Jamie C. Chiu, Shaun M. Eack, Fei Fang, William Yang Wang and
  Zhiyu Zoey Chen, University of Texas at Dallas, University of
  California Santa Barbara, University of Pittsburgh, Princeton University
  and Carnegie Mellon University. Preprint v1 October 2024, v2 and NAACL
  2025 camera-ready January 2025. The same Psychotherapy-LLM organization
  already has a PsyCoPref record in this registry, and CBT-Bench is a
  distinct benchmark, not a duplicate of it. This is a benchmark of
  single-turn items, not multi-turn conversations. Do not cite it for
  turn-taking or dialogue dynamics evidence.
