id: cbt-bench
title: "CBT-Bench: Evaluating Large Language Models on Assisting Cognitive Behavior Therapy"
canonical_url: https://huggingface.co/datasets/Psychotherapy-LLM/CBT-Bench
status: verified
dataset_type: hybrid
dialogue_structure: single_turn_qa
domain: psychotherapy

source_context: >-
  A three-level benchmark for evaluating LLMs on assisting cognitive behavior
  therapy, built by the Psychotherapy-LLM group. Level I (CBT-QA) is 220
  multiple-choice questions on basic CBT knowledge, collected from CBT exam
  questions for Master of Social Work students and compositions from CBT
  experts. Level II is cognitive model understanding: 146 cognitive distortion
  examples, 184 primary core belief examples, and 112 fine-grained core belief
  examples, built from patient speech in the TherapistQA dataset (mental
  health forum posts) and annotated by six CBT experts, who extracted
  situation-plus-thought segments and in some cases created plausible imagined
  situations to supplement them. Level III (CBT-DP) is 156 deliberate-practice
  exercises from Boswell and Constantino (2022), typical patient speeches in
  ten categories of CBT sessions with one reference response each, at beginner,
  intermediate, and advanced difficulty. This is a benchmark, not a transcript
  corpus: there is no naturally occurring session behind any item, and the
  hybrid type is a judgment call recording that the material is human material
  (forum posts, exam questions, published training exercises) transformed by
  expert annotation and curation into evaluation items.
