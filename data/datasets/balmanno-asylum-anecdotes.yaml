notes: >-
  Re-verified 2026-11-20 against the Royal College of Physicians and Surgeons of Glasgow
  catalogue page and the College's own 2020 blog post on the anecdotes (both read in full):
  the volume is RCPSG 1/20/2/2, Cleghorn's 1814 case notes with Balmanno's notes and anecdotes
  at the rear; the anecdotes were written 1821-1840 and record doctor-patient exchanges with
  patient quotations. Geography (Glasgow, United Kingdom), source context and de-identification
  (false: patients are named) are now established from those primary sources. The Terms of Use
  page was also read: it licenses collection images under CC BY-NC-SA but states no license
  for the case-note text, so the dataset license stays unknown. Still not established: the
  number of anecdotes (no session count), whether any case was followed longitudinally, a
  therapy modality (the material predates modern modalities; rotation therapy is described as
  a physical asylum treatment, not a psychotherapy modality), and a publication or release year
  (the anecdotes are unpublished manuscript material). This is asylum clinical material, not a
  verified psychotherapy-session corpus; dataset type remains unknown.
