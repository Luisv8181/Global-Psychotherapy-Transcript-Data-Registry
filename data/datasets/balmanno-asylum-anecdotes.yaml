notes: >-
  The Royal College of Physicians and Surgeons of Glasgow archive identifies case notes from
  the Glasgow Asylum for Lunatics with further notes by John Balmanno and Balmanno's anecdotes
  at the rear of the volume (RCPSG 1/20/2/2). The College's historical article reports that
  the anecdotes were written between 1821 and 1840 and often record interaction between patients
  and the doctor using patient quotations. This is asylum clinical material, not a verified
  psychotherapy-session corpus; dataset type remains unknown.
