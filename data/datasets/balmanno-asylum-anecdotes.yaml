source_context: >-
  Anecdotes by Dr John Balmanno written 1821-1840 while he was physician at the Glasgow Asylum
  for Lunatics (Gartnaval), bound at the rear of Dr Robert Cleghorn's case notes of asylum
  patients dated 1814 (RCPSG 1/20/2/2). The College's catalogue describes the volume as case
  notes of patients from the Glasgow Asylum for Lunatics in Cleghorn's hand with further notes
  by Balmanno and anecdotes by Balmanno at the back. The College's blog describes the anecdotes
  as an unusual record of patient case histories, often giving details of interaction between
  the patient and the doctor, or between patients, using quotations from the patients, and
  recording the doctor's feelings about the cases, in contrast to the clinical notes more
  commonly found in the period. One anecdote describes the threat of the whirling chair
  (rotation therapy) being used to make a taciturn patient speak. This is nineteenth-century
  asylum clinical material, not a verified psychotherapy-session corpus; dataset type remains
  unknown.
