publication_year: 2025
last_verified: 2026-11-04
notes: >-
  Count disagreement, recorded not resolved. The introduction states 61,832 utterances, but
  Table 3 lists 24,762 user utterances and 25,661 bot utterances, which sum to 50,423. The
  5,006-dialogue count is consistent across the abstract, the introduction, and Table 3. Table 3
  also reports an average of 16.51 goals per dialogue (range 6 to 34) and 3.74 distinct activities
  per dialogue. The 4,000 single texts are the construction input, not a session count. Dataset
  type is hybrid, not synthetic, because the dialogues are LLM expansions of human-authored
  single-turn material (PsyQA conversations and published case descriptions), following the AugESC
  precedent in this registry. No real client session stands behind any dialogue. The full data
  files were not inspected because access requires the signed agreement, so the transcript format
  json reflects the public sample file only. Geography is left null because the paper names
  Chinese-language data from Beijing-affiliated institutions but does not state where the source
  cases came from.
