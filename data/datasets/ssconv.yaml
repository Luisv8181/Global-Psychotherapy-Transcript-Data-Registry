id: ssconv
title: "SSConv: Socialized Simulation of Emotional Support Conversation"
canonical_url: https://github.com/Cognition-and-Language-Group/SocialSim
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Synthetic emotional support dialogues generated by the SocialSim framework, which
  simulates seeker-supporter interaction with explicit modeling of social dynamics:
  social disclosure on the seeker side (a constructed persona bank of help-seeking
  scenarios) and social awareness on the supporter side (step-by-step cognitive
  reasoning before each supportive response). The paper reports the corpus quality
  can surpass crowdsourced emotional-support data and demonstrates a chatbot trained
  on SSConv with state-of-the-art automatic and human evaluation results. The
  personas are simulated constructs, not real clients; no real-client source data
  behind each dialogue was described.
therapy_modalities:
  - emotional_support
languages:
  - en
sessions: 3229
longitudinal: false
annotations:
  - seeker personas (demographic and psychological profiles per dialogue)
  - supporter step-by-step reasoning traces
transcript:
  available: true
audio:
  available: false
video:
  available: false
access:
  level: open
  requirements: >-
    Public, ungated GitHub repository; two JSON data files downloadable without
    registration.
redistribution: conditional
license:
  type: cc-by-nc-4.0
  verified: true
  source: https://github.com/Cognition-and-Language-Group/SocialSim/blob/main/LICENSE
  notes: >-
    The CC BY-NC 4.0 license is stated in the repository's README license section and
    in the LICENSE file at the root of the data repository, read on 2026-10-12.
    Redistribution is conditional on the CC BY-NC 4.0 terms (attribution,
