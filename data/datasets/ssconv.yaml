publication_year: 2025
last_verified: 2026-10-12
notes: >-
  Counted 3,229 dialogues (IDs 1-3229, sequential) in
  SocialSim_SSConv_ESC_dataset_full_3229.json on 2026-10-12; each dialogue has 18-40
  turns (mean 24.0) with one seeker message and one supporter message per turn, plus a
  "Supporter Step by Step Reasoning" trace on every supporter turn. A companion file
  carries 3,229 simulated seeker profiles (gender, age, occupation, personality,
  topic, subtopic, situation, event details, emotional experience words, coping
  strategies, goals). Authors: Zhuang Chen et al., Central South University /
  Tsinghua University CoAI Group; AAAI 2025, DOI 10.1609/aaai.v39i2.32116. The
  repository is the authors' official release (organization account plus first-author
  mirror zhchen18/SocialSim).
