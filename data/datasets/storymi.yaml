notes: The ACL 2026 paper reports 6,000 simulated multi-turn MI dialogues grounded in 1,000 questionnaire-story pairs, covering 12 MI codes and 13 symptom domains. The workflow uses therapist, client and interaction-manager agents and includes human expert evaluation. Re-checked on 2026-10-10. The public GitHub repository contains code, DSM-5-TR questionnaires, MI guideline PDFs and evaluation artifacts but not the full 6K corpus. Dialogue transcripts are available only for the human-evaluation subset, where human_anno/data.json holds 20 dialogues for each of 5 evaluated models. This differs from the paper abstract's statement that code and data are provided for reproducibility. The repository has no LICENSE file and dataset-specific redistribution terms are not stated.
