notes: >-
  Paper Table 4 reports 80 conversations with 8,572 utterances in Dutch and English, annotated with
  26 fine-grained MISC codes (16 therapist, 10 client) with multiple codes per utterance. Section 3.1
  reports 80 audio recordings from 18 clients in real Dutch MI counseling sessions; the English side is
  a Google Translate version post-edited by two Dutch Master's students. Consent to record is documented
  in the paper ethics statement. Longitudinal design is not established by the paper, although 80
  recordings from 18 clients implies repeat contact. Release claim versus reality: the paper says the
  dataset is released at the GitHub repository above, but that repository (last pushed 2024-04-01) holds
  only a stub README and an empty 1-byte file, no data files and no license, and no BiMISC dataset was
  found on Hugging Face or by web search on 2026-11-18. Access therefore stays unknown and the status
  is partially-verified, not verified. The paper states adherence to the institute ethical requirements
  but documents no ethics review or approval, so ethics_review_documented stays unknown.
