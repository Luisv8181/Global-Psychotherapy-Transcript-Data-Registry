notes: >-
  Re-verified against the LREC-COLING 2024 paper, Sun et al., and the release repository on 2026-11-14. The paper reports 80 conversations and 8,572 utterances in Dutch and English, annotated with 26 fine-grained MISC codes, 16 for therapists and 10 for clients, averaging 108 utterances per conversation. The source material is 80 audio recordings from 18 clients in real Dutch MI counseling sessions, transcribed by the therapists, anonymized, machine-translated into English with Google Translate, and post-edited by two Dutch Master's students. The English version is therefore a translation of the Dutch originals, not independently collected sessions. The paper states client consent to record and that names, addresses and personal details were removed or replaced with pseudonyms. The paper says the dataset is released at the GitHub repository listed in the primary sources, but that repository holds no data files as of 2026-11-14, only a README saying more content will come soon, and no license file. No Hugging Face dataset for BiMISC was found. Access and license therefore remain unestablished, and the status is partially-verified rather than verified. The CC BY-NC 4.0 notice on the paper covers the paper only, not the dataset. Funded by the EU Horizon H2020 TIMELY project, grant 101017424.
