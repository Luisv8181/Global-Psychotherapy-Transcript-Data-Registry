notes: >-
  The ACL 2026 Findings paper (read as arXiv 2506.06626) describes the dataset as built from real
  client profiles in credible psychological case reports published in academic journals or
  professional books; the reports exclude session transcripts but document each client's state and
  goals per session. GPT-4o with human validation extracted static traits, per-session dynamic
  states and counseling goals; an LLM then generated seed conversations and full sessions, with
  anonymized real counseling fragments from some reports used as prompt examples. The paper reports
  1,400 training and 100 test clients, 6.17 sessions per client on average, 28.55 turns per session
  and 26.99 words per turn. Counted from the repository on 2026-09-26 (commit eaae4df), it holds
  1,499 profiles in userProfiles/profiles.jsonl, 1,199 dialogue files, 1,199 memory files and 1,486
  user-card files; these counts are not reconciled with the paper's 1,500 clients. The dialogues are
  English by a character count of the files. The paper reports IRB approval for its human
  participants (experts and evaluators). The repository owner confirmed the classification as hybrid
  rather than synthetic on 2026-09-26, matching the hybrid definition (reconstruction from reports)
  and the CPsyCounD precedent.
