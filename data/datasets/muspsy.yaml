notes: >-
  The ACL 2026 paper describes MusPsy as counseling dialogues constructed from real client profiles
  in publicly available psychological case reports, rather than observed counseling-session
  transcripts. It reports 1,400 client profiles for training and 100 for testing, with an average of
  6.17 counseling sessions per client, 28.55 turns per session and 26.99 words per turn. The public
  GitHub repository, opened on 2026-09-26, contains dataset directories for dialogues, memories and
  user cards and has an MIT LICENSE file. The MIT file is a repository/software license and is not
  treated as proof that the dataset itself has the same license. This record changes the earlier
  synthetic classification to hybrid because the generated dialogues are constructed from
  human-derived case-report profiles; owner review is required before treating that reclassification
  as settled.
