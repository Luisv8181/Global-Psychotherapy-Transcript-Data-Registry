notes: >-
  Re-verified 2026-11-17 against the full ACL 2026 Findings paper (25 pp.). The paper reports
  1,700 extended Chinese asynchronous psychological counseling conversations, average 5.47 turns,
  split into 1,539 training and 161 test samples, generated by the CFlowPsy multi-agent framework
  from 150 real anonymized counseling cases as seed data, with CBT and REBT adopted as the
  theoretical foundations for counselor strategies (Figure 4). Consent is documented: the 150 seed
  cases were obtained with explicit informed consent and the 100 real-world evaluation volunteers
  gave written informed consent; all procedures received institutional ethics review board approval
  before data collection and volunteer recruitment. Longitudinal is false: the dataset is 1,700
  single extended dialogues, and the paper states longitudinal studies tracking client outcomes
  have not been systematically evaluated. Access, redistribution, dataset license and release
  location remain unknown: the paper's reproducibility checklist says the dataset and model "will
  be released upon decision of the paper", the paper is published (July 2026), but GitHub
  repository search, GitHub code search, Hugging Face datasets API and web search on 2026-11-17
  found no author release artifact (the two GitHub code hits are unrelated files that only mention
  the name). Transcript availability stays unknown because no release route exists. The corpus
  should remain synthetic rather than real or hybrid at the dialogue level.
