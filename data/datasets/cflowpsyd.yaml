  notes: >-
    The paper describes the 150 real counseling cases used as seed data as anonymized, and says
    de-identification followed the Chinese national standard GB/T 39725-2020, with names,
    addresses, contact information and birthdates removed, ages generalized to five-year brackets,
    locations replaced with general regions, timestamps de-specified, and sensitive details
    semantically desensitized, then reviewed by independent privacy experts and professional
    counselors. This claim applies to the seed material described by the authors and is not a
    guarantee about the generated corpus.
