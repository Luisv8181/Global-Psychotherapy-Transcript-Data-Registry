notes: >-
  The ACL 2026 Findings paper reports 1,700 extended Chinese asynchronous psychological counseling
  conversations and says the CFlowPsy framework uses a small amount of real anonymized counseling
  cases as seed data before synthesizing the released conversations through large language models.
  Access, redistribution, dataset license and release location were not established in this pass, so
  those fields remain unknown. The corpus should remain synthetic rather than real or hybrid at the
  dialogue level.
