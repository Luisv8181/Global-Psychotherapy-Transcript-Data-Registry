notes: >-
  359 public tasks of 718 total, per the card's Public/Private Split section
  (public subset keeps all 23 subcategories; split stratified by subcategory,
  age group, turn structure, intent, and progression stage). Card composition
  table counts used here: 220 multi-turn and 139 single-turn public tasks;
  251 O18 and 108 U18 tasks; 3,415 public rubric criteria. Long-horizon annex:
  20 transcripts, 801 user-turn rows; full assistant turns for those live only
  in the separate ScaleAI/DistressBench-LH dataset, described as released for
  safety research rather than as an open corpus. Raw data files were not
  downloaded (access gate requires login); all counts above are the card's
  published figures, not counted rows. The card carries an explicit content
  warning for suicidal ideation, self-harm, abuse, and other crisis content.
  Authors per arXiv 2610.12758 (submitted 2026-10-08): Drew Rein, Patrick
  Oathout, Vishal Kumar, Udari Madhushani Sehwag, Scale AI. The 19-clinician
  figure reported in press coverage could not be confirmed from the sources
  read and is not recorded.
