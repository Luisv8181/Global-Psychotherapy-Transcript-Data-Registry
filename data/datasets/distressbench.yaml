id: distressbench
title: "DistressBench"
canonical_url: https://huggingface.co/datasets/ScaleAI/DistressBench
status: verified
dataset_type: demonstration
dialogue_structure: mixed
domain: mental_health_support
source_context: >-
  Scale AI's open benchmark for evaluating whether a language model can sustain
  safe, useful support across a crisis conversation. User turns are authored by
  licensed clinicians (no real clients), spanning 23 suicide and self-harm
  subcategories. Each task pairs a clinician-authored user trajectory with a
  task-specific rubric of weighted atomic criteria across seven dimensions of
  crisis support and a clinician reference response; a model reply is scored
  criterion by criterion as the weighted share of required care delivered. The
  public release carries 359 of 718 tasks (50 percent), a 75-task calibration
  set with per-criterion labels from three clinicians, per-judge labels for 25
  evaluated models, the frozen judge panel and grader, and 20 long-horizon
  red-team transcripts with conversation-level violation labels. The remaining
  359 tasks are withheld as a private holdout for contamination checks. An
  evaluation benchmark of AI behavior, not a corpus of real therapy sessions;
  recorded as adjacent mental-health scope.
languages:
  - en
sessions: 359
longitudinal: false
annotations:
  - 3,415 public rubric criteria (6-20 per task, weighted 1-20, across 7 dimensions)
  - task metadata (turn structure, age band U18 or O18, prompt intent, explicit type, progression stage, subcategory)
  - calibration labels from 3 clinicians on 75 tasks plus 455 candidate judge-panel rankings
  - per-criterion judge verdicts for 25 evaluated models (3 attempts each)
  - conversation-level violation labels for 20 long-horizon transcripts
