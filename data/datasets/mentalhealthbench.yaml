id: mentalhealthbench
title: "MentalHealthBench"
canonical_url: https://openai.com/index/introducing-mentalhealthbench/
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: mental_health_support
source_context: >-
  OpenAI's open benchmark for measuring how AI systems respond in realistic
  mental-health conversations. 1,215 synthetic multi-turn conversations, each
  ending with a user message; a model's reply to that final message is scored
  against expert-written rubric criteria. Co-created with a global cohort of
  more than 80 licensed mental-health experts (psychologists and psychiatrists)
  from 22 countries. 5,262 rubric criteria in total across 10 behavior axes:
  context seeking and assessment, actionable guidance and coping strategies,
  clinical reasoning and health accuracy, interpretation and cognitive
  reframing, empathy and emotional attunement, reality-testing calibration,
  urgency calibration, harm avoidance, collaboration and user agency, and
  communication and writing. Conversations span four user profiles (adult,
  teen aged 13-17, caregiver, clinician) and the full acuity spectrum
  (non_acute, high_acuity, emergent) in 11 languages. An evaluation benchmark
  of AI behavior, not a corpus of real therapy sessions; recorded as adjacent
  mental-health scope.
languages:
  - en
  - es
  - hi
  - ar
  - pt
  - de
  - id
  - it
  - fa
  - tr
  - zh
sessions: 1215
