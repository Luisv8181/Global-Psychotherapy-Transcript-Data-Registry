id: fadodr-mental-health-therapy
title: "Mental Health Therapy (fadodr merged instruction dataset)"
canonical_url: https://huggingface.co/datasets/fadodr/mental_health_therapy
status: partially-verified
dataset_type: hybrid
dialogue_structure: single_turn_qa
domain: psychotherapy
source_context: >-
  A third-party merged instruction-tuning dataset published on Hugging Face by
  fadodr. Its README states it combines a real-therapy conversation set from a
  Counsel Chat forum with synthetic discussion generated with ChatGPT, obtained
  from three named sources and cleaned to anonymize it and remove conversations
  deemed not relevant. The three named sources are nbertagnolli/counsel-chat,
  Amod/mental_health_counseling_conversations and ShenLab/MentalChat16K, and all
  three dataset pages resolve on Hugging Face. The files use an
  instruction/input/output schema, so each row is a single-turn prompt/response
  triple rather than a multi-turn session. The README gives no breakdown of how
  many rows come from each source and no detail on the cleaning or anonymization
  method, so the real-versus-synthetic mix and the quality of the anonymization
  claim cannot be checked from the card alone. Counsel Chat and MentalChat16K are
  already registry records in their own right, so this record covers only the
  merged derivative, not its sources.
languages:
  - en
sessions: null
transcript:
  available: true
audio:
  available: false
video:
  available: false
access:
  level: open
  requirements: >-
