id: mhdialog
title: "MHDialog: Mental Health AI Dialogue Dataset"
canonical_url: https://huggingface.co/datasets/IkeZhang/MHDialog
status: verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: mental_health_support
source_context: >-
  Ten-round dialogues between a user and a peer supporter, generated by large language models
  from seed posts drawn from public Reddit mental health communities. The dialogues simulate
  supportive conversations; they are not real counseling sessions.
languages:
  - en
sessions: 1000
longitudinal: false
annotations:
  - dialogue_intent
  - concern_type
  - risk_level
transcript:
  available: true
  format:
    - text
audio:
  available: false
video:
  available: false
modalities:
  - text
access:
  level: open
redistribution: conditional
license:
  type: CC-BY-NC-SA-4.0
  verified: true
  source: https://huggingface.co/datasets/IkeZhang/MHDialog
  notes: >-
    The dataset card declares CC BY-NC-SA 4.0 in both its metadata tags and its Licensing
    Information section; redistribution is therefore allowed only under the license's
    non-commercial and share-alike conditions.
privacy:
  deidentified: unknown
  contextual_reidentification_assessed: unknown
  notes: >-
    The dialogue text is model-generated, not real conversation. The card says the seed posts
    came from public Reddit mental health communities but states nothing about whether the
    seeds were de-identified or screened for identifying detail, so de-identification is
    left unknown rather than assumed.
ethics:
  consent_documented: unknown
  ethics_review_documented: unknown
  data_use_agreement: unknown
evidence:
  primary_sources:
    - https://huggingface.co/datasets/IkeZhang/MHDialog
    - https://arxiv.org/abs/2602.00353
publication_year: 2026
release_year: 2026
notes: >-
  Read 2026-11-09. The Hugging Face card (README) is the primary source: 1,000 dialogues in
  10-round user/supporter format, splits train 700 / validation 150 / test 150, annotated for
  dialog intent (8 categories), concern type (7) and risk level (6) by trained annotators with
  a mental-health-support background. Counted from the data files on 2026-11-09: train.csv 700
  rows, val.csv 150, test.csv 150; the first train dialogue parses as 10 rounds with user and
  supporter turns, and all 8 intent labels appear in the train split. The MHDash paper
  (arXiv 2602.00353, Zhang et al., submitted 2026-01-30, University of Louisiana at
  Lafayette) describes the platform's data collection, structured annotation, multi-turn
  dialogue generation and baseline evaluation; only the abstract was read, so paper-level
  design claims beyond the abstract are not recorded here. Classified hybrid, not synthetic:
  the dialogue text is model-generated, but it is an LLM expansion of human material (public
  Reddit posts), matching the hybrid definition and the MusPsy precedent; the card itself
  calls the dialogues synthetic and not real conversations. The homepage named on the card,
  https://mhdash.socialshields.org/, was not opened. No ethics review, consent, or
  de-identification statement was found on the card, so those fields stay unknown.
last_verified: 2026-11-09
