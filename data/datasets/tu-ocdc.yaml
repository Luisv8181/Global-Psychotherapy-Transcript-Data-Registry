release_year: 2025
notes: >-
  Collected under the NEDO "young researcher discovery support" project
  "Development of multimodal emotion estimation technology for highly accurate
  early detection of stress in remote workers," led by Tokushima University: 50
  workers recruited via crowdsourcing held ~30-minute sessions each with one
  counselor (certified psychologist, 公認心理師) over Zoom; video and audio were
  recorded. A viewer is published on the provider's GitHub site. The NII page
  cites an Industrial Health journal paper for the collection details and an IPSJ
  national-convention presentation paper for the annotation details; neither was
  opened this session. The page says video and audio were recorded during
  collection but describes the distributed package as video data and annotation
  data only, so audio availability is recorded as unknown. An NII launch
  announcement (secondary source, search snippet only) credits Associate
  Professor Kazuyuki Matsumoto with the collection and mentions bundled
  pre-computed image features and facial-expression analysis results; both are
  unconfirmed until read as primary sources.
last_verified: 2026-10-14
