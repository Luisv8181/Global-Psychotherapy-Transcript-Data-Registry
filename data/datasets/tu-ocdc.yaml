annotations:
  - stress evaluations by the counselor and two occupational health experts
  - emotion labels on Russell's circumplex model (valence-arousal coordinates) by five laypeople via mouse operation
  - pre-session questionnaire (industry/occupation, employment status, sleep hours, etc.)
  - face-image features and facial-expression analysis results from pre-processing (announced, not read as primary)
