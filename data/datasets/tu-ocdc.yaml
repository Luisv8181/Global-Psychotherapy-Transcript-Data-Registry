access:
  level: research-agreement
  requirements: >-
    Apply to the NII Informatics Research Data Repository. Applications are per
    laboratory, submitted by a representative full-time staff member. Sign
    Tokushima University's TU-OCDC terms of use and NII's IDR dataset service
    terms; data is provided free of charge by download from a web server. Research
    use only (including basic technology development); primarily university and
    public research-institution researchers, with private-sector researchers admitted
    depending on the research content. An annual usage report is requested, and NII
    must be contacted before media or publicity use.
redistribution: unknown
license:
  type: unknown
  verified: false
  notes: >-
    No open dataset license is stated. Access is governed by Tokushima
    University's TU-OCDC terms of use and NII's IDR dataset service terms; the
    terms documents were downloadable but not opened this session, so their
    details are unknown.
privacy:
  deidentified: documented
  contextual_reidentification_assessed: unknown
  notes: >-
    The NII record page documents face de-identification: the provided video and
    annotation data cover the worker side only, and face images have their face
    parts replaced with an average face using SimSwap. This is a documented
    processing claim, not a guarantee of anonymity or resistance to
    re-identification.
