notes: >-
  Pipeline: 26,483 client speeches collected (100-1,000 characters,
  de-duplicated, average 366 characters), 3,291 held out for test and 23,192
  for training. Twenty popular LLMs are sampled and prompted to roleplay as
  psychotherapists; GPT-4o scores each response on a 5-Likert scale across
  seven professional principles (empathy, relevance, clarity, safety,
  self-exploration, autonomy, stage of change), the principle scores are
  averaged, and pairs with an overall score gap of at least 1 become preference
  pairs. Each row carries the client speech (question), the chosen and rejected
  responses, which model produced each, and the per-principle ratings for both.
  The authors validated the GPT-4o-generated preferences with two professional
  psychotherapists hired through Upwork, who annotated 200 randomly sampled
  pairs. Authors: Mian Zhang and Zhiyu Zoey Chen (University of Texas at
  Dallas, Department of Computer Science) and Shaun M. Eack (University of
  Pittsburgh, School of Social Work). This is a preference/ranking dataset,
  not multi-turn conversations: do not cite it for turn-taking or dialogue
  dynamics evidence.
