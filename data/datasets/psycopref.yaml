id: psycopref
title: "PsychoCounsel-Preference (PsyCoPref): preference dataset for psycho-counseling LLMs"
canonical_url: https://huggingface.co/datasets/Psychotherapy-LLM/PsyCoPref
status: verified
dataset_type: hybrid
dialogue_structure: single_turn_qa
domain: psychotherapy

source_context: >-
  Single-turn preference dataset for training and evaluating psycho-counseling
  LLMs. Client speeches are aggregated from existing counseling corpora
  (counsel-chat, MentalAgora, TherapistQA, Psycho8k, and the Hugging Face
  datasets amod-counsel, MentalChat16K and phi2Mental); the counselor-side
  responses and the preference labels are model-generated, so there is no
  human session behind the response side. The classifier call here is a
  judgment call: the client turns are human-authored material and the
  responses are LLM-generated, matching the hybrid definition (human material
  transformed by LLM generation) more closely than fully synthetic.
