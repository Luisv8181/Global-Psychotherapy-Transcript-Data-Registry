id: stratcbt
title: "Steering the Compass: Aligning Dynamic Psychological Counseling Conversations with Cognitive Behavioral Therapy Strategies"
canonical_url: https://github.com/zimuwangnlp/StratCBT
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Synthetic cognitive behavioral therapy counseling dialogues. The paper reports 9,688 sessions
  and around 256K utterances, averaging 26.4 utterances per session, in English. Each counselor
  utterance is aligned with one of eight CBT strategies (Listening, Guidance, Modeling,
  Story-telling, Cognitive Reframing, New Thoughts, Wrap Up, Others). Construction starts from the
  PatternReframe dataset (9,688 negative statements, each paired with a persona, a cognitive
  distortion, and reframed thoughts). GPT-4o selects the reframed thought that fits the persona and
  models the client events, feelings, and behaviors, then Gemini 2.0-Flash generates the dialogue
  in a self-chat framework, using in-context examples drawn from 23 collected realistic CBT
  sessions from CheeseBurger Therapy (https://cheeseburgertherapy.org/), where peer counselors with
  15-20 hours of training guide clients. The paper states it will release only the STRATCBT
  dataset and will not distribute any of the collected sessions. The paper positions STRATCBT as
  the only compared dataset that aligns counseling with utterance-level CBT strategies, and reports
  its scope as limited to CBT and English.
therapy_modalities:
  - cognitive_behavioral_therapy
languages:
  - en
sessions: 9688
longitudinal: false
annotations:
  - CBT strategy label per counselor utterance (eight strategies)
transcript:
  available: false
audio:
  available: false
video:
  available: false
access:
  level: metadata-only
  requirements: >-
    The paper names https://github.com/zimuwangnlp/StratCBT as where the dataset can be
    obtained, but as of 2026-11-06 that repository holds no data files (only a LICENSE file, a
    .gitignore, and a one-line README). No Hugging Face dataset was found for STRATCBT. No public
    access route to the data is confirmed.
redistribution: unknown
