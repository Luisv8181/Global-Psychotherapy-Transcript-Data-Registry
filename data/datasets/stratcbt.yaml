notes: >-
  Counts are the paper figures (abstract and Table 1): 9,688 sessions, around 256K utterances,
  average 26.4 utterances per session. The 9,688 sessions correspond one-to-one with the 9,688
  PatternReframe negative statements. Authors: Zimu Wang, Yiwen Jiang, Xiangyu Zhao, Yaling Shen,
  Jiahe Liu, Stephanie Fong, Maxmartwell H Cheng, Guilherme C Oliveira, Anh Nguyen, Robert
  Desimone, Barnaby Nelson, Dominic Dwyer, Zongyuan Ge (Monash University, University of Liverpool,
  MIT, University of Melbourne, Orygen). EMNLP 2026, pages 51994-52014. The repository was checked
  via the GitHub API on 2026-11-06: single main branch, three files only (.gitignore, LICENSE,
  README.md with the single line "# StratCBT"). Hugging Face datasets API searches for "stratcbt"
  and "StratCBT" returned 0 datasets. Release status matches the earlier "Therapy as an NLP Task"
  pattern: a named release route that currently holds no data. Re-check on a later run whether data
  files appear in the repository.
