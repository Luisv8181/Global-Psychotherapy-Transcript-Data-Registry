notes: >-
  Six Japanese role-play counselling dialogues collected via the LINE messaging app
  by two expert counselors (Inaba, Ukiyo, Takamizo; University of Electro-Communications,
  iDEAR Human Support Service, Japanese Organization of Mental Health and Educational
  Agencies). One counselor played the client and the other the counselor, across six
  themes: competition nervousness, a restrictive partner, a friend conflict, study
  motivation, gender identity, and the meaning of life. Published counts from the
  paper's Table 2: 1,194 client utterances (15,962 words) and 1,140 counselor utterances
  (31,689 words). Counselor utterances are annotated with response key points and
  response intent; themes 1-3 were annotated by the participating counselor, themes 4-6
  by non-participating counselors. Seven professional counselors evaluated human and
  GPT-4-generated utterances on a 3-point scale (Krippendorff's alpha 0.24; mean human
  0.99 vs GPT-4 0.94; Mann-Whitney U-test showed no significant difference). Recorded
  as demonstration because the sessions are expert-counselor role-play made to evaluate
  an LLM counselling system, not naturally occurring sessions. Classified as unreleased:
  the paper names no repository, dataset card, download, or data-use route, so access
  is metadata-only. This is the earlier pilot from the same research group that later
  built KokoroChat (6,589 dialogues, 2025); it is a distinct, separate collection.
