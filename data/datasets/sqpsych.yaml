notes: >-
  The release table on the project page (read 2026-10-10) lists 28 AIMH/SQPsychConv_* datasets: the
  seven questionnaire-conditioned variants each hold about 2,090 conversations (the HF API shows
  train 1,837 + test 253 = 2,090 rows for SQPsychConv_qwq); the seven no-questionnaire variants are
  the same size; the finetuning-format variants range from 27.8k to 47.7k conversations. Reported
  per-dataset statistics: average 15.5 to 24.6 turns per conversation, 26 to 52 tokens per utterance.
  Conditions recorded in the data include MDD and control clients; the generated dialogues address
  major depressive disorder and anxiety presentations. The paper (v2, revised 2026-08-28) also
  releases fine-tuned SQPsychLLM 8B models and reports expert psychotherapist preference for the
  generated sessions over other mental-health LLMs. Code release URL is named on the project page
  and was not separately verified. The underlying Kircher et al. (2019) structured client data is
  not part of this record.
