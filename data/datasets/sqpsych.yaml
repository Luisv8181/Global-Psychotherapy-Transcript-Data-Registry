id: sqpsych
title: "SQPsych: Structured Questionnaire-based Psychotherapy synthetic conversations"
canonical_url: https://ai-mh.github.io/SQPsych
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
source_context: >-
  Synthetic therapist-client conversations generated by the SQPsych pipeline: two separate LLMs
  roleplay therapist and client, conditioned on structured client data converted to natural language.
  The conditioning data are general demographics (age, gender, education, employment, genetic risk,
  parental education, number of children) and standardized questionnaire results (Hamilton Depression
  Rating Scale, Hamilton Anxiety Rating Scale, Beck Depression Inventory) from 2,090 anonymized
  clients collected by Kircher et al. (2019). That underlying structured data is available upon
  request and is not released with the corpus; no real dialogues were used. The therapist agent
  follows CBT guidance (paraphrasing, validation); conversations require a minimum of 15 turns.
  An ablation corpus is conditioned on client metadata only, without questionnaires. Released as 28
  Hugging Face datasets under the AIMH organization: seven generating LLMs, each with a
  questionnaire-conditioned variant (about 2,090 conversations), a no-questionnaire variant, and two
  larger finetuning-format variants.
