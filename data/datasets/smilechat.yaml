publication_year: 2024
historical_significance:
  - early LLM-based expansion of real single-turn help-seeking posts into multi-turn counseling-style dialogue
  - training data for the MeChat Chinese mental health support model
notes: >-
  Re-verified 2026-11-19 against the repository README, the repository file tree, and the
  EMNLP 2024 Findings paper (arXiv 2305.00450v3; ACL Anthology 2024.findings-emnlp.34,
  pp. 615-636, DOI 10.18653/v1/2024.findings-emnlp.34). The paper reports 55,165 dialogues
  and the repository data directory holds exactly 55,165 numbered JSON files (0.json to
  56031.json); each file is one multi-turn dialogue with role, content, and per-sentence
  annotation fields. Converting the dialogues yields the 310,087 training samples the README
  reports. The expansion model is gpt-3.5-turbo-0613. The paper's Ethics Statement records
  Westlake University Institutional Ethics Committee approval 20211013LZZ001. The paper also
  describes a separate 50-dialogue real-life test set, PsyTest, released only through a gated
  request process (ID, proof of work, IRB approval, NDA); no PsyTest files are present in this
  repository, so PsyTest is not part of this record. The authors note that generated dialogues
  are shorter than real counseling and differ in strategy distribution, and that reproducing
  the dialogues from PsyQA requires an agreement with the original data owner.
last_verified: 2026-11-19
