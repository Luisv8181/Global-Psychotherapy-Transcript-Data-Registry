generation:
  method: llm_multi_turn_expansion
  models:
    - GPT-3.5 Turbo
  source_type: real_single_turn_mutual_help_qa
  synthetic_dialogues: true
access:
  level: open
  requirements: >-
    None. The README states that the repository's data directory contains all dialogues built
    with SMILE; 55,165 dialogue files counted in the repository data directory on 2026-11-19,
    matching the paper's published figure exactly.
redistribution: conditional
license:
