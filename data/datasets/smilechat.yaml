id: smilechat
title: "SmileChat: Chinese Multi-turn Mental Health Support Dialogues (SMILE)"
canonical_url: https://github.com/qiuhuachuan/smile
status: verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: mental_health_support
source_context: >-
  Real single-turn mental-health mutual-help question-answer posts from PsyQA (Sun et al. 2021),
  crawled from the Chinese platform xinli001.com, expanded by ChatGPT into multi-turn
  help-seeker and supporter dialogues with the SMILE (Single-turn to Multi-turn Inclusive
  Language Expansion) method. SMILECHAT consists of 55,165 dialogues averaging 5.7 turns.
geography:
  countries: [China]
  regions: [east_asia]
  scope: single_country
  evidence_level: reported_in_publication
languages: [zh]
language_context: original
therapy_modalities:
  - mental_health_support
sessions: 55165
longitudinal: false
transcript:
  available: true
modalities:
