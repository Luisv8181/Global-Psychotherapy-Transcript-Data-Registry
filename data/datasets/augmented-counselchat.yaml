id: augmented-counselchat
title: "LLM-Augmented Multi-turn CounselChat Dialogues"
canonical_url: https://arxiv.org/abs/2406.08718
status: partially-verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Single-turn CounselChat question-answer pairs (record counsel-chat) expanded into
  multi-turn counseling dialogues by a two-step LLM pipeline. Step 1 extracts client
  information, therapist counseling characteristics, and a description of the client's
  mental disorder from each source pair. Step 2 generates the multi-turn dialogue with
  the instruction-tuned Llama3-70B. The first turn of each augmented dialogue reproduces
  the original client utterance and the response of the most-recommended therapist for
  that question; subsequent turns are model-generated. The source pairs were selected
  for four disorder categories, and one expert per client utterance was used. Authors
  are affiliated with KT (South Korea). Presented at the IJCAI 2024 AI4Research workshop.
