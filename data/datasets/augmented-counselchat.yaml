notes: >-
  Count distribution from Table 1 of the paper: Depression 69, Anxiety 45, Anger
  Management 16, Trauma 13, summing to 143 augmented cases. A random subset of 70
  dialogues (Depression 34, Anxiety 22, Anger Management 8, Trauma 6) was used as the
  paper's test set for zero-shot and few-shot generation experiments; the paper reports
  automatic evaluation only, no human evaluation of the augmented dialogues. Turn counts
  per dialogue are not stated in the paper. The record is partially-verified because the
  dataset's existence, provenance, and composition are confirmed from the full paper
  text, but the dialogues themselves are not publicly retrievable: the linked
  repository holds only a README, so the paper's "publicly available" claim does not
  currently hold for the data. This is a distinct record from counsel-chat, which covers
  the original single-turn source data. Follow-up lead from the 2026-11-04 STAMPsy run:
  the Ellis Alicante mental-health crisis benchmark remains unexamined.
