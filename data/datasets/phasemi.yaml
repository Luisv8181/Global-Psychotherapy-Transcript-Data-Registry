notes: >-
  The ACL 2026 paper introduces PhaseMI as a phase-structured MI dataset and describes a
  generation framework using therapist, client and supervisor LLMs to control phase transitions.
  Size confirmed two ways: the paper states N = 13,897 dialogue instances, and the released
  phase_mi.jsonl counted on 2026-11-14 holds 13,897 rows with 13,897 distinct ids. Dialogue lists
  in the file run 24-60 turns (mean 29.8), which includes supervisor turns; the paper's 20-44
  therapist-client turns (mean 23.92) excludes them, so the two ranges are consistent. Language is
  English: the paper's appendix states all counseling dialogues will be provided in English. Each
  instance is a single MI session, so longitudinal is false; the four-dialogue evaluation sets in
  the paper are parallel therapist-model variants of one seed concern, not follow-up sessions.
  Geography reflects the simulated client persona (U.S. university student per the paper's
  generation prompt), not observed participants. It is not counted as direct observed
  psychotherapy-session evidence.
last_verified: 2026-11-14
