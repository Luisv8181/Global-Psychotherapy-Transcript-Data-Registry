id: phasemi
title: "PhaseMI: A Motivational Interviewing Dataset for Enhancing Phase Progression in LLM-based Counseling"
canonical_url: https://github.com/regina-kim/phase_mi
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: counseling
source_context: >-
  Simulated motivational-interviewing counseling dialogues generated with therapist, client and
  supervisor LLMs (GPT-4o) to control progression across MI phases. Seed concerns were collected
  from Reddit (r/College and r/gradSchool, 2022-2024) and filtered by concern taxonomy (academic,
  interpersonal, emotional, career-related); the client prompt frames each simulated client as a
  U.S. university student who posted the concern on Reddit.
