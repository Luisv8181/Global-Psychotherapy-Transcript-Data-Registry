notes: >-
  HCoT-Corpus contains 22,341 dialogues and 211,473 strategy annotations. Both roles are simulated by LLMs. The paper uses the 211,473 figure for both the total annotated strategies and the total turns, which is consistent because each supporter turn carries one strategy tag. The corpus holds about 430,000 utterances at an average of 9.47 turns per dialogue, where a turn is one Seeker-Supporter exchange. Strategy labels were checked on a 200-dialogue sample by three trained raters at 90.0 percent accuracy with Fleiss Kappa 0.85. The source CD-CN data combines PsyQA with more than 20,000 newer YiXinLi question-and-answer samples. The paper positions the corpus as a methodological proof of concept, not clinically validated, and prohibits direct clinical deployment. It warns the data shows an idealized hyper-cooperative interaction and lacks the resistance, non-compliance, and linguistic ambiguity of real clinical transcripts. No release route was found in the full paper text as of 2026-11-15. The article carries no Data Availability statement and names no repository, dataset card, or download link, and searches of Hugging Face and GitHub found no author artifact. The article itself is CC BY, which is the article license and does not cover the dataset. It is therefore kept separate from observed counseling-session evidence.
