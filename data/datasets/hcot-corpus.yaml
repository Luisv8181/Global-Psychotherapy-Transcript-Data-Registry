historical_significance:
  - large-scale multi-turn synthetic psychological support corpus
  - explicit analysis of simulation-reality gap
notes: HCoT-Corpus contains 22,341 dialogues and 211,473 strategy annotations. The source explicitly notes that both roles are simulated by LLMs and that the corpus lacks many forms of resistance and ambiguity found in real clinical transcripts. It is therefore kept separate from observed counseling-session evidence.
