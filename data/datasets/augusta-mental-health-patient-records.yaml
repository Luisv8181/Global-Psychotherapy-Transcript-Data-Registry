notes: >-
  Digital Maine identifies Patient Medical Records covering 1840-1910 within the Augusta Mental
  Health Institute collections. The institution began in 1840 as the Maine Insane Hospital, was
  renamed Augusta State Hospital in 1913 and Augusta Mental Health Institute in 1973, and closed
  in 2004 (replaced by Riverview Psychiatric Center on the same campus). The collection page
  lists 40 leather-bound volumes (01-40); 17 volumes (1-17) were published online as of
  2026-11-20 and the page states the collection is still being imaged. Volumes 1-23 hold mixed
  genders; volumes 24-40 are single-gender. Volume 1 is cited as published 2021 and Volume 17
  as 2022 on their Digital Maine item pages; publication_year records 2021, the first volume's
  year. Longitudinal is true because each case history holds multiple dated entries by the
  attending physician describing the patient's condition over the stay. The registry records this
  as a historical clinical-record resource, not as a verified psychotherapy dialogue corpus;
  individual volumes require screening for dialogue or patient quotations. Left unknown,
  honestly: therapy modalities (the pages name no modality), session and participant counts (40
  volumes is not a session count), consent and ethics review (not stated on the pages), and
  redistribution beyond conditional.
