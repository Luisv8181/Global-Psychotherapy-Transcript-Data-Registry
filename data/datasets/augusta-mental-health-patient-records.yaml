notes: >-
  Digital Maine identifies Patient Medical Records covering 1840-1910 within the Augusta Mental
  Health Institute collections. The institution began in 1840 as the Maine Insane Hospital and
  later changed names. The registry records this as a historical clinical-record resource, not as
  a verified psychotherapy dialogue corpus; individual volumes require screening for dialogue or
  patient quotations.
