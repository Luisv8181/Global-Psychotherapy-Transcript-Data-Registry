source_context: >-
  Historical patient medical case histories from the Maine Insane Hospital (later Augusta State
  Hospital, then Augusta Mental Health Institute), held by the Maine State Archives and published
  on Digital Maine. The collection page describes 40 leather-bound volumes (01-40) spanning
  1840-1910, each volume holding numbered, paginated patient case histories with multiple dated
  entries by the attending physician. This is a clinical-record collection, not a transcript corpus
  of therapy sessions; whether individual volumes contain dialogue or patient quotations has not
  been screened.
