source_context: >-
  Motivational-interviewing counseling videos from YouTube, Vimeo and other public websites,
  consisting of MI demonstrations by professional counselors and MI role-plays by psychology
  students, each labelled as high- or low-quality counseling. Transcribed with YouTube automatic
  captioning, or Mechanical Turk where captions were unavailable.
