notes: >-
  The corpus contains 145 therapist-patient interactions from ARC, ESPSB, ESB21, iCHAMP and HMCBI.
  The published description says the interactions lasted 20 minutes to one hour, involved real
  patients seeking treatment for substance addiction, and were recorded on tape and manually
  transcribed. Therapist empathy was rated at the session level using the MITI framework.
  The reviewed sources do not establish a public download route or dataset-specific license.
