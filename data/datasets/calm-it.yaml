id: calm-it
title: "CALM-IT: Generating Realistic Long-Form Motivational Interviewing Dialogues with Dual-Actor Conversational Dynamics Tracking"
canonical_url: https://arxiv.org/abs/2601.10085
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Synthetic motivational interviewing dialogues generated by the CALM-IT framework, a dual-agent
  system in which therapist and client agents maintain continuously updated latent states (rapport,
  inferred mental state, short-term goals) that gate strategy selection and utterance generation.
  Client contexts are built from public Reddit mental health disclosures: 5,794,243 posts from
  2015-2022 across 55 subreddits, clustered with BERTopic into 158 topics, five representative
  posts per topic, reduced to 686 posts after keyword filtering and de-identification. Each post
  becomes a third-person vignette with a simulated DASS-42 profile matched to an adult respondent
  from the OpenPsychometrics DASS dataset. For each of the 686 client contexts, four frameworks
  (CALM-IT, CALM-IT without dynamics modeling, KMI, CAMI+STAR) generate dialogues at three target
  lengths (30, 50, and 100 turns) with DeepSeek-V3.2 as the backbone, yielding 686 x 3 x 4 = 8,232
  transcripts. Evaluation uses LLM-as-a-judge MITI 4.2 global ratings (DeepEval with GPT-5.1) plus
  process-level metrics; 96 transcripts (1.2%, 8 per framework-length condition) were independently
  reviewed by four licensed psychologists to validate the automated protocol. An OLMo-3.1-32B
  replication is reported in the appendix.
