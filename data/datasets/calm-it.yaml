notes: >-
  The 8,232 figure is the full evaluated set: 686 client contexts x 3 lengths x 4 frameworks.
  The CALM-IT-generated arm is 686 x 3 = 2,058 dialogues. The paper's "large-scale synthetic
  corpus" release claim most plausibly refers to the CALM-IT-generated arm, but this is
  unconfirmed, and no release location was found (GitHub, Hugging Face, arXiv, and web searches on 2026-10-10, re-checked 2026-10-11; a January 2026 secondary write-up said code and vignettes were "slated for
  release"). The author list changed between versions: v1 (2026-01-15) listed Srijan Kumar;
  v2 (2026-05-27) lists Michael L. Birnbaum (Columbia) instead. Affiliations: Georgia
  Institute of Technology, Northwell Health, Columbia University. Client profiles are simulated
  personas, not real clients; the paper's own ethics statement frames CALM-IT as a research
  framework not intended for clinical use, and notes the Reddit-derived profiles
  disproportionately reflect WEIRD populations.
