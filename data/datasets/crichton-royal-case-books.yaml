notes: >-
  The Wellcome collection contains Crichton Royal Institution Case Books, Southern Counties Asylum
  Case Books, Male Case Books, Female Case Books, Chronic Case Books and Other Case Books covering
  1839-1937, with the series ranges confirmed on the catalogue page as Crichton Royal Institution
  1839-1885, Southern Counties Asylum 1839-1885, Male 1840-1937, Female 1845-1937, Chronic 1845-1904
  and Other 1899-1906. The records contain admission and history information followed by case-note
  entries describing attitude, treatment and response. Individual volumes are available online,
  including the 1839-1840 first Crichton Royal Institution case book, which holds cases 1 to 82 in
  392 digitised pages. Patients often appear in multiple volumes through readmission, transfer
  between departments or length of stay, and case-note entries for 27 patients in volume 1 are
  continued in volume 8, which is why longitudinal is recorded as true. This is a psychiatric
  case-note archive, not a verified psychotherapy transcript corpus. Therapy modalities are not
  recorded because the material predates modern modalities; moral treatment under Dr Browne is
  described in the source context. Session counts do not apply to case books, and no publication
  year is recorded because the volumes are unpublished manuscripts.
