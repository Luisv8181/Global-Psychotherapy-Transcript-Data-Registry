notes: >-
  The Wellcome collection contains Crichton Royal Institution Case Books, Southern Counties Asylum
  Case Books, Male Case Books, Female Case Books, Chronic Case Books and Other Case Books covering
  1839-1937. The records contain admission and history information followed by case-note entries
  describing attitude, treatment and response. Individual volumes are available online, including
  the 1839-1840 first Crichton Royal Institution case book. This is a psychiatric case-note archive,
  not a verified psychotherapy transcript corpus.
