source_context: >-
  Case books of Crichton Royal Institution, Scotland's seventh and last royal asylum, founded on an
  endowment left by Dr James Crichton and driven by Elizabeth Crichton, built on land south of Dumfries
  and opened 3 June 1839, gaining its royal title in 1840. Under Physician Superintendent Dr W. A. F.
  Browne moral treatment was extolled, with recreation and occupation as part of treatment. Southern
  Counties Asylum opened in 1849 for pauper patients and merged with the Institution in 1884 to form
  the First and Second Houses. The hospital joined the National Health Service in 1948 and closed in
  November 2011. Six case-book series cover 1839 to 1937. The books are printed forms recording
  admission and clinical and family history followed by dated case-note entries on attitude, treatment
  and response, with additional clinical material attached in many volumes. The papers are held by
  Dumfries and Galloway Archives and were digitised by the University of Glasgow as part of a Wellcome
  Trust funded project, with digitised material accessed freely online through the Wellcome Library
  catalogue.
