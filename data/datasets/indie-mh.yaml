notes: >-
  The India geography reflects the Hinglish translation; where the original conversations took place
  is not established. The LREC 2026 paper describes IndieMH as counseling conversations from publicly available sources,
  manually translated into Hinglish and annotated with 13 emotional states in 3 categories. It was
  previously recorded as real, originally code-mixed therapy sessions. Which source corpus was
  translated is not established here; the same group released HOPE, built from public counseling
  videos, but that link is unconfirmed. Status is partially verified until the source is confirmed.
