id: eeyore
title: "Eeyore: Depression Client-Simulation Training Data"
canonical_url: https://huggingface.co/datasets/liusiyang/eeyore_depression_sft
status: verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: mental_health_support
source_context: >-
  Depression-related conversations selected from four human corpora (RED Reddit threads from
  r/depression and r/depressed, HOPE counseling-video transcripts, ESConv crowdsourced emotional
  support, and AnnoMI-Full motivational-interviewing demonstrations), filtered and rebalanced with
  GPT-4o, and reformatted to train a model that role-plays a depressed client. Each conversation
  carries a GPT-4o-extracted psychological profile in its system prompt, and some long conversations
  were split into sessions with LLM-written summaries of the earlier ones.
languages: [en]
language_context: original
therapy_modalities:
  - counseling
  - emotional_support
  - motivational_interviewing
clinical_topics:
  - depression
sessions: 3042
longitudinal: true
transcript:
  available: true
  format:
    - parquet
modalities:
  - text
annotations:
  - psychological_profiles
  - depression_symptom_severity
  - cognitive_distortions
  - source_dataset_ids
  - preference_pairs
access:
  level: registration
  requirements: >-
    Hugging Face login and acceptance of the dataset's access gate. The gate is
    auto-approval (HF API reports gated auto, confirmed 2026-11-16); the gate's
    conditions were not read because they are shown only after login.
redistribution: conditional
license:
  type: none-selected
  verified: true
  source: https://huggingface.co/api/datasets/liusiyang/eeyore_depression_sft
  notes: >-
    No license is declared in the HF card metadata of any of the four Eeyore datasets
    (read via the HF API 2026-11-16), in any of the four card READMEs (auto-generated
    dataset_info YAML only, no license prose), or in the official GitHub repository
    MichiganNLP/Eeyore, which has no LICENSE file. The authors have not granted an open
    license, so reuse rests on no stated terms and redistribution is conditional at most.
    The paper names four source corpora, each with its own terms (see the HOPE, ESConv and
    AnnoMI records); how those terms apply to this release is not stated on the pages read.
privacy:
  deidentified: unknown
  contextual_reidentification_assessed: unknown
ethics:
  consent_documented: unknown
  ethics_review_documented: true
  data_use_agreement: unknown
evidence:
  primary_sources:
    - https://huggingface.co/api/datasets/liusiyang/eeyore_depression_sft
    - https://huggingface.co/api/datasets/liusiyang/eeyore_profile
    - https://huggingface.co/api/datasets/liusiyang/eeyore_depression_generated_preference
    - https://huggingface.co/api/datasets/liusiyang/eeyore_depression_expert_preference
    - https://github.com/MichiganNLP/Eeyore
    - https://aclanthology.org/2025.findings-acl.707/
    - https://arxiv.org/html/2503.00018v1
  supporting_publications:
