id: eeyore
title: "Eeyore: Depression Client-Simulation Training Data"
canonical_url: https://huggingface.co/datasets/liusiyang/eeyore_depression_sft
status: partially-verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: mental_health_support
source_context: >-
  Depression-related conversations selected from four human corpora (RED Reddit threads from
  r/depression and r/depressed, HOPE counseling-video transcripts, ESConv crowdsourced emotional
  support, and AnnoMI-Full motivational-interviewing demonstrations), filtered and rebalanced with
  GPT-4o, and reformatted to train a model that role-plays a depressed client. Each conversation
  carries a GPT-4o-extracted psychological profile in its system prompt, and some long conversations
  were split into sessions with LLM-written summaries of the earlier ones.
languages: [en]
