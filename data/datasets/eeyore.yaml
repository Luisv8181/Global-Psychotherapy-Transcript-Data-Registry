notes: >-
  The Findings of ACL 2025 paper (read as arXiv HTML v1) reports 5,618 candidate conversations,
  of which 3,042 were kept after GPT-4o labelling and rebalancing, and 453 of those given a
  counseling history by segmenting long conversations. The Hugging Face metadata lists 3,209 rows
  in eeyore_depression_sft (fields messages, source, id_source) and 3,209 in eeyore_profile (the
  same plus profile), 1,605 model-generated preference pairs in eeyore_depression_generated_preference
  and 317 expert preference pairs in eeyore_depression_expert_preference. The 3,042 and 3,209 figures
  have not been reconciled; the extra rows may come from the segmentation, which is unconfirmed.
  The paper says the instruction-tuning data places the profile in the system prompt and uses the
  client's turns as the assistant messages, so the files likely contain source-corpus text,
  including HOPE's; this was not checked because the files are gated. English is taken from the
  four source corpora named in the paper; the files were not opened. The paper reports IRB approval
  for its user studies with experts; it says nothing on review of the source data.
