publication_year: 2025
historical_significance:
  - expert-in-the-loop training data for simulated depressed clients in counselor training
notes: >-
  Re-verified 2026-11-16 against the published ACL Findings 2025 paper (read in full as
  arXiv HTML v1 and the ACL PDF), the official release repository MichiganNLP/Eeyore, and
  the Hugging Face API plus card text for all four datasets. The paper reports 5,618 candidate
  conversations processed and 3,042 kept after GPT-4o labelling and rebalancing, with 453 of
  those given a counseling history by segmenting long conversations and summarizing the earlier
  sessions. The released SFT and profile files list 3,209 rows each in HF metadata, 167 more
  than the paper's 3,042, and the gap is unreconciled; segmentation is a candidate explanation
  but the paper does not say it adds rows, so it is not claimed. The preference files list 1,605
  model-generated pairs and 317 expert pairs; the paper says 1,933 model pairs met the selection
  criteria and 317 expert annotations were collected with 250 retained after filtering, so the
  released expert file matches the collected count rather than the retained count, while the
  released model file is 328 short of the paper's used count. No license is declared anywhere
  read. HF card metadata for all four datasets lists no license, each card README is only
  auto-generated dataset_info YAML with no license prose, and the official GitHub repository
  has no LICENSE file, so the license is recorded as none-selected and redistribution as
  conditional at most. The Hugging Face gate auto-approves, but its conditions were not read
  because they show only after login. The paper's ethics section states IRB approval for all
  user studies and says nothing on review of the source data. No de-identification step is
  described in the paper, and the four source corpora carry their own terms, so de-identification
  stays unknown. Geography stays unknown: the paper names no geography for its sources, which
  span Reddit threads, YouTube counseling videos, crowdsourced support chats and MI
  demonstrations; the HOPE record in this registry reports majority United States, but that
  covers one of four sources. The instruction-tuning format puts the profile in the system
  prompt with the client's turns as the assistant messages. English is taken from the four
  source corpora named in the paper; the gated files were not opened.
last_verified: 2026-11-16
