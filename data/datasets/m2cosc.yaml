notes: >-
  Counted from the released files on 2026-11-06. train.jsonl holds 349 rows
  and test.jsonl holds 100 rows, 449 dialogues in total, each with exactly 8
  conversation turns and 368 unique image paths across both files. The paper
  Table 1 reports 429 dialogues with 329 in train and 100 in test, so the
  released train split holds 20 more rows than the paper reports. The paper
  figure and the counted figure are both recorded here rather than reconciled.
  Total utterances counted are 3,592 against 3,432 implied by the paper
  figure. The Hugging Face dataset was last modified 2025-11-18, after the
  February 2025 paper, so the train split may have grown after publication.
  The code repository was updated 2026-10-27 but holds no data files beyond
  prompts and assets. The Sharma et al. (2023) source dataset for thoughts and
  thinking traps was collected with informed consent per the paper.
last_verified: 2026-11-06
