id: m2cosc
title: "M2CoSC: Multi Modal-Cognitive Support Conversation"
canonical_url: https://huggingface.co/datasets/multimodal-reframing/M2CoSC
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Synthetic multimodal cognitive reframing dialogues from Kim et al. (POSTECH,
  NAACL 2025). Each dialogue pairs a GPT-4-generated four-turn conversation
  with one AffectNet facial-expression image of a virtual client. The client
  role is played by GPT-4 and the therapist role by GPT-4 Vision, following a
  four-stage framework of Introduction, Exploration, Brainstorming and
  Suggestion. The client thought and thinking-trap labels come from the
  cognitive reframing dataset of Sharma et al. (2023), and the image and
  facial-expression label come from AffectNet. Matching between image and
  thought was random with uniform distribution, and the happy expression was
  excluded. Three native English speakers cleansed the data on four criteria
  and three professional psychotherapists evaluated the test set. No real
  client data was used. The paper reports 429 dialogues, while the released
  files counted on 2026-11-06 hold 449 rows, see notes.
