publication_year: 2026
release_year: 2026
last_verified: 2026-11-04
notes: >-
  116 counted from therapyjudgebench.jsonl on 2026-11-04 (single test
  split, one JSON object per line); every dialogue has 10 messages and
  num_turns 5. 993 non-missing CTRS aspect ratings counted from the same
  file (of 1,276 possible across 11 dimensions x 116 dialogues), matching
  the v2 paper abstract and the card's v2.0.0 summary; missing ratings
  are JSON null, concentrated in Guided Discovery and Technique
  Application per the datasheet. Revised safety labels are present for
  111 dialogues; Conversations 28, 33, 52, 53, and 60 have null for all
  four safety fields (giving medical advice, failure to address crisis,
  failure to address abuse, failure to address functional impairment).
  18 fictional patient profiles; therapist-model counts counted from the
  file are PHI_3_5 18, CLAUDE_3_7 18, GEMINI_2_0 18, DEEPSEEK 18, O3_MINI
  18, QWEN3_4B_LOCAL 10, LLAMA_4_SCOUT 8, O1 8. Expert annotation by two
  licensed CBT-trained practitioners (coauthors), blinded to model
  identity, calibrated on CTRS rubrics; 20 percent double-annotated for
  inter-rater reliability, the rest singly annotated; the public file
  carries one consolidated expert_rating per dialogue and no
  annotator-level records, so annotator disagreement is not exposed.
  DISAGREEMENT RECORDED, NOT RESOLVED: the v1 abstract reported 1,270
  expert ratings, while the v2 abstract, the v2.0.0 card, and this run's
  count all give 993 non-missing CTRS aspect ratings; the 1,270 figure
  is not used. The paper also reports 133 clinician-led counseling
  sessions used for external judge validation; those sessions are not
  in this dataset and no access route for them is stated. No ethics
  review is documented for the synthetic release; the paper states no
  external human subjects were involved and no additional IRB approval
  was sought.
