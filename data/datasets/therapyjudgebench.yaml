id: therapyjudgebench
title: "TherapyJudgeBench: Expert-Annotated Dialogue Bank for Validating LLM Judges of CBT-Style Therapy Conversations"
canonical_url: https://huggingface.co/datasets/therapygym/therapyjudgebench
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Fully synthetic CBT-style therapy dialogues released with TherapyGym
  (Huang et al., Stanford University, University of California Berkeley,
  and University of Hong Kong; NeurIPS 2026 Evaluations and Datasets
  Track, version 2.0.0 released 2026-11-03). Each dialogue is one complete
  simulated session of 10 messages (5 patient turns, 5 therapist turns)
  between a GPT-o3-mini patient simulator conditioned on Patient-psi-CM
  cognitive profiles and one of 8 therapist LLMs, all under a single
  professional-CBT-therapist prompt style. The benchmark's purpose is
  judge validation and calibration, not therapist benchmarking or
  real-patient deployment: the card states it is not a clinical dataset,
  a diagnostic tool, or a substitute for clinician review, and should not
  be used to train, validate, or evaluate systems intended for real-patient
  deployment. The companion 133 clinician-led counseling sessions used in
  the paper to further validate the judge are a separate validation
  exercise and are not part of this released dataset.
therapy_modalities:
  - cognitive_behavioral_therapy
languages:
  - en
sessions: 116
longitudinal: false
annotations:
  - CTRS skill ratings per dialogue (11 dimensions, 0-6 scale, dialogue-level)
  - overall CTRS score per dialogue
  - safety flags per dialogue (4 binary session-level categories)
  - therapist model, patient model, patient profile, and session id per record
