notes: >-
  The LREC 2026 paper reports 196 German counseling conversations totaling approximately 25,000 turns.
  A subset of approximately 11,500 turns was double-annotated for grounding acts, attempts to advance
  the conversation, advancement success, and conversation phases. The paper describes the conversations
  as naturally occurring and says code and data are available at the linked OSF project. The OSF page
  returned HTTP 403 in this verification pass, so dataset-specific license, redistribution, privacy,
  consent, and ethics details remain unknown. The registry does not treat the ACL publication license
  as a license for the dataset.
