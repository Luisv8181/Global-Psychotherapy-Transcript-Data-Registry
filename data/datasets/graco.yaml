id: graco
title: "German Counseling Grounding-Act Corpus (GRACO)"
canonical_url: https://osf.io/6k275/overview
status: partially-verified
dataset_type: real
dialogue_structure: multi_turn
domain: counseling
source_context: >-
  Naturally occurring German institutional counseling conversations between advice seekers and
  counselors, transcribed from existing spoken-German corpora. The OSF data statement lists nine
  domains (immigration office, financial, sales, legal, medical, health insurance, social and
  private counseling, and study advising), so most conversations are advice-giving encounters rather
  than psychotherapy or mental-health counseling.
languages:
  - de
language_context: original
sessions: 196
longitudinal: unknown
annotations:
  - grounding_acts
  - acknowledgments
  - repairs
  - conversation_advancement_attempts
  - conversation_advancement_success
  - conversation_phases
transcript:
  available: true
audio:
  available: unknown
video:
  available: unknown
modalities:
  - text
access:
  level: open
  requirements: >-
    Public OSF project. Per its data statement, only transcripts from the non-DGD subset are
    distributed; transcripts from the Datenbank für Gesprochenes Deutsch stay under that source's
    own access terms.
redistribution: conditional
license:
  type: mixed
  verified: true
  source: https://osf.io/download/k6cma/
  notes: >-
    LICENSE.txt on the OSF project, read on 2026-09-29, applies CC BY 4.0 only to the annotation
    layers, metadata and documentation. It states that the underlying source transcripts remain under
    their original corpora's licenses and access conditions (for example DGD) and are not relicensed.
privacy:
  deidentified: documented
  contextual_reidentification_assessed: unknown
  notes: >-
    The OSF data statement says the original source corpora were anonymized by their curators, that
    age, gender and first language were anonymized and not systematically collected, and that audio and
    video are not shared for privacy and legal reasons.
ethics:
  consent_documented: unknown
  ethics_review_documented: unknown
  data_use_agreement: unknown
evidence:
  primary_sources:
    - https://aclanthology.org/2026.lrec-1.495/
    - https://osf.io/6k275/overview
  supporting_publications: []
publication_year: 2026
release_year: 2026
historical_significance:
  - German naturally occurring counseling dialogue with grounding-act and conversation-phase annotation
notes: >-
  The LREC 2026 paper reports 196 German counseling conversations totaling approximately 25,000
  turns. A subset of approximately 11,500 turns was double-annotated for grounding acts, attempts to
  advance the conversation, advancement success, and conversation phases. The paper describes the
  conversations as naturally occurring and says code and data are available at the linked OSF
  project. On 2026-09-29 the OSF project was read through the OSF API (README.md, LICENSE.txt and
  DATA_STATEMENT_GRACO.md). The data statement confirms the counts, says the conversations are
  mainly face-to-face with some telephone, radio and video counseling, and says each involves at
  least one counselor and one client. Consent and ethics review are not stated in the files read.
  The registry does not treat the ACL publication license as a license for the dataset.
last_verified: 2026-09-29
