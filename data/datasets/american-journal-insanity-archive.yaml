notes: >-
  Historical clinical archive, not a verified psychotherapy transcript corpus.
  Collection years corrected this run from 1904-1921 to 1844-1921 against the
  HathiTrust catalog record, which gives the run as 1844-1921 in 77 volumes.
  Sessions and therapy modalities are not applicable here, since the record
  describes a serial journal rather than a session corpus, and are left
  unknown rather than inferred. Longitudinal is false, since no repeated
  observation of the same participant or case is documented as a design. Full
  text of the whole run is openly viewable through HathiTrust and the Internet
  Archive. Individual issues and articles should be screened for dialogue
  before use in transcript-oriented research.
