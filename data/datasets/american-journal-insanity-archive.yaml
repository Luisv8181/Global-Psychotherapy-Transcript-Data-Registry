source_context: >-
  The American Journal of Insanity, published 1844-1921 in 77 volumes and
  continued under the new title American Journal of Psychiatry. The HathiTrust
  catalog record states it was issued July 1844 to April 1894 by the New York
  State Lunatic Asylum at Utica and July 1894 to 1921 by the American
  Medico-Psychological Association, and published in Baltimore by the Utica
  State Hospital Press. Its subject headings are psychiatry, psychoses,
  pathological psychology, and insanity law, all as periodicals. The January
  1846 issue (volume 2), read in full text this session, carries clinical
  articles on brain physiology and the pathology of insanity, asylum case
  reports, and medico-legal proceedings, including a court report on a murder
  trial. The journal is a historical clinical periodical, not a corpus of
  therapy transcripts.
