id: ai-psychotherapy-eval
title: "Assessing Risks of Large Language Models in Mental Health Support"
canonical_url: https://huggingface.co/datasets/IanSteenstra/AI-Psychotherapy-Eval
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy

source_context: >-
  Fully model-generated longitudinal Motivational Interviewing sessions for
  Alcohol Use Disorder, built to red-team AI psychotherapists. Six therapist
  conditions (ChatGPT Basic on gpt-5-chat-latest, ChatGPT MI, Gemini MI on
  gemini-2.5-flash, the Character.AI "Psychologist" persona, a Harmful AI
  negative control on gemini-2.5-pro given an adversarial prompt, and a
  passive control using the NIAAA "Rethinking Drinking" booklet) were paired
  with 15 simulated patient personas representing five AUD phenotypes across
  three stages of change, in a full factorial design of 180 dyads, each
  scheduled for four weekly sessions of up to 48 therapist turns. No real
  clients are involved; every dialogue turn is model-generated, including the
  between-session simulation of adverse outcomes such as dropout, relapse and
  suicide. The paper is a condensed version of the first author's PhD
  dissertation (Steenstra, 2025, Northeastern University).

