publication_year: 2026
release_year: 2026

notes: >-
  Counted from the released data file on 2026-11-06: conversations.csv in
  AI_Psychotherapy_Eval_Dataset.zip holds 27,218 rows (13,609 patient turns
  and 13,609 therapist turns) across 369 unique pairing-and-session
  combinations, matching the paper's N of 369 sessions; patient_personas.csv
  holds 15 rows and pairings.csv 180 rows, matching the paper's 15 personas
  and 180 dyads. Sessions run 6 to 96 turns; the paper caps sessions at 48
  therapist turns, and pairings end early when a simulated adverse event
  (dropout or suicide) occurs between sessions, which explains the 369
  realized sessions against 720 scheduled. The six therapist conditions and
  the stratification of the 15 personas by AUD phenotype prevalence are from
  the full text of arXiv 2602.19948v2, read 2026-11-06. The paper text names
  no dataset release location; the Hugging Face dataset is linked from the
  paper's arXiv record only through the card's citation, and the card is the
  release route. The zip also carries turn-level crisis and MI-fidelity
  evaluations, patient-reported outcome surveys, between-session journals and
  adverse-outcome records, and per-session summary metrics.

last_verified: 2026-11-06
