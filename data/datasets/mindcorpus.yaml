  notes: >-
    Dialogues are fully model-generated roleplays; no real participant identifiers
    are involved. Seed situation texts came from publicly accessible counseling
    platforms and were rewritten by GLM-4-Plus. No re-identification assessment was
    reported; membership-inference attacks were evaluated on the trained MindChat
    model, not on the dataset.
