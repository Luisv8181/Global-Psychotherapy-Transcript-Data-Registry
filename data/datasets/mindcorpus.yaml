id: mindcorpus
title: "MindCorpus: synthetic multi-turn Chinese counseling dialogue dataset"
canonical_url: https://arxiv.org/abs/2601.01993
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Synthetic Chinese counseling dialogues generated by a six-agent multi-agent
  framework (Extractor, Seeker, Supporter, Evaluator, Corrector, Manager) with a
  dual closed-loop feedback mechanism: turn-level critique-and-revision of the
  supporter's utterances against predefined quality dimensions, and session-level
  strategy refinement so the supporter's counseling strategies improve across
  sessions. Seeker agents are initialized from seed situation texts (approximately
  11,000) collected from the publicly accessible Chinese online counseling
  platforms Yixinli and Jiandanxinli, cleaned and enriched with GLM-4-Plus into
  Character-Plight-Demand representations. Themes span emotional and relationship
  management, self-awareness and individual growth, stress and anxiety relief,
  mental health maintenance, and workplace adjustment. The paper reports 5.7k
  dialogue sessions across diverse themes (the federated-training setup uses one
  client per thematic category, ten in total), averaging 12.0 utterances per
  session. Quality was assessed on five dimensions (professionalism, helpfulness,
  guidance, emotion, trust) by GPT-4o automatic scoring and four postgraduate
  psychology students. The dialogues train MindChat, a privacy-preserving
  mental-health LLM built with federated learning, LoRA, and client-level
  differential privacy. The paper names no public release route for the dataset
  itself.
