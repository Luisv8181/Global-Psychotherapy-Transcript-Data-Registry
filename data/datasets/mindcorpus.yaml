notes: >-
  Statistics are the paper's reported figures (Table II): Chinese, 5.7k sessions,
  12.0 utterances per session, 84.0 average length; the 5700 figure is approximate.
  Preprint only: submitted 2026-01-05, revised 2026-01-24, "submitted to the IEEE
  for possible publication". Authors: Dong Xue, Jicheng Tu, Ming Wang, Xin Yan,
  Fangzhou Liu, Jie Hu. Dataset scope is counseling and mental-health support, not
  diagnosis; the paper positions it for emotional-support dialogue research.
  Re-checked 2026-10-13. Still no locatable release artifact. GitHub API repo
  search returned 0 hits for MindCorpus and for mind-corpus counseling, the
  Hugging Face datasets API returned no match for MindCorpus or the arXiv id,
  the arXiv abs page shows no code or data links, and the v2 full text contains
  no repository, dataset or download URL. A related but distinct artifact
  surfaced: dongSHE/MindChat-R0-FT-Data on Hugging Face is a 4.5K-dialogue
  Chinese mental-health consultation dataset collected from YiXinLi for
  MindChat-R0, published 2025-10-15, recorded separately as
  mindchat-r0-ft-data. Same-author-team relation is unconfirmed. Record stays
  partially-verified until a locatable release artifact (repository,
  dataset card, or access route) surfaces.
