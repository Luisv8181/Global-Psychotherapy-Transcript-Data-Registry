notes: >-
  Classification deliberately stays unknown rather than real or demonstration. The paper confirms
  real-client sessions exist in the corpus but reports no aggregate real/simulated split, and the
  per-session designation follows each source video's own description, which was not re-read here.
  Do not treat the whole corpus as demonstration without per-session source checks. Sensitivity
  flags for the owner: the paper documents no consent procedure or ethics review for the recorded
  clients (de-identification is the only stated protection), so a real-client subset carries the
  same consent gap that blocked the HOPE video catalog. No per-video list is catalogued here and
  no transcript, audio, or video content is included. The corpus is unreleased, so this is a
  metadata-only placeholder; revisit if the authors publish a dataset card, code repository, or
  access route. Counts are the paper's published figures (Table 1 and Table 2 of v1), not
  independently re-counted.
