access:
  level: metadata-only
  requirements: >-
    The corpus itself has no public release as of 2026-10-12. The paper (v1, submitted 2026-09-15)
    names no dataset card, code repository, or access route; the arXiv "Code, Data and Media"
    section lists no links; the Hugging Face papers page for 2609.17180 returns 404; GitHub code
    search for MOCC-R1 and the Hugging Face datasets API search for MOCC return no official
    artifact. The source videos remain on YouTube and the Alexander Street subscription platform,
    but the corpus (transcripts, segmentations, annotations) is not distributed.
