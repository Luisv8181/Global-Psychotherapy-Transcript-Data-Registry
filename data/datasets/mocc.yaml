id: mocc
title: "MOCC: Multimodal Counseling Conversation Corpus"
canonical_url: https://arxiv.org/abs/2609.17180
status: partially-verified
dataset_type: unknown
dialogue_structure: multi_turn
source_context: >-
  Human-recorded counseling sessions mined from public YouTube videos and the subscription
  Alexander Street video platform by Wenjie Zheng, Qiming Xie, Jianfei Yu and Rui Xia (Nanjing
  University of Science and Technology and Nanjing University). All sessions are conducted by
  154 credential-verified counselors. The 482 sessions span real-client and simulated-client
  interactions; simulated clients are portrayed by counselors, counseling graduate students, or
  conference participants. The real-vs-simulated designation follows each source video's own
  description, and the aggregate real/simulated split is not reported. Raw videos (277.36 hours)
  are filtered to 202.58 hours and segmented into 3,709 problem-centered multi-turn dialogue units
  (183,350 utterances; 80,678 counselor, 102,672 client; average 22 turns per unit). Pipeline:
  manual video segment filtering, FFmpeg audio extraction, WhisperX speech transcription with
  timestamp alignment, manual speaker-role verification, automatic PII detection with typed
  placeholders or semantic generalization plus manual verification, and presenting-problem labels
  from a taxonomy adapted from the GoodTherapy platform, adjudicated by a clinical annotation
  team of one clinical psychologist and two graduate students.
