notes: >-
  The corpus comes from the UCLA/UW Couple Therapy Research Project. The 2017 PLOS One paper
  (PMC5608311, read in full on 2026-11-08) describes 134 chronically distressed married couples,
  three recording sessions per couple over two years with some follow-up sessions missing, manual
  transcripts, audio and video, and behavioral codes from the Couples Interaction and Social Support
  Interaction Rating Systems. It states that the couples interacted in the absence of any therapist
  or research staff, that the study was approved by the UCLA and University of Washington IRBs, and
  that all participants gave written consent. The figure of 574 sessions was confirmed from the
  Interspeech 2019 paper (PMC9940777, read in full on 2026-11-08), which states there is a total of
  574 such sessions recorded at three points over two years. The 2017 PLOS One paper analyzed a
  screened subset of 229 recordings with two 10-minute interactions each, 458 interactions in total,
  after excluding sessions without outcome measures or with poor audio. dataset_type stays real
  because these are real participants from a clinical population; domain is couple_interaction
  because the recordings are not therapist-client dialogue.
