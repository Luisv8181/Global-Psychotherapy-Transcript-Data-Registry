id: couples-therapy-corpus
title: "UCLA/UW Couples Therapy Corpus"
canonical_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9940777/
status: partially-verified
dataset_type: real
dialogue_structure: multi_turn
domain: couple_interaction
source_context: >-
  Recorded problem-solving discussions between spouses taking part in a randomized clinical trial of
  couple therapy (Integrative versus Traditional Behavioral Couple Therapy). They are not therapy
  sessions. Each spouse chose an issue in the relationship and the couple discussed it without any
  therapist or research staff present, before therapy, after 26 weeks and two years later.
