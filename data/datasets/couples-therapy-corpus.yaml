notes: >-
  The corpus originated in the UCLA/UW Couple Therapy Research Project. A later methodological
  description reports 134 seriously and chronically distressed heterosexual couples and 574 recorded
  sessions at three points over two years. The sessions contain spouse-to-spouse problem discussions,
  with manual transcripts and audio-visual recordings, plus behavioral coding and treatment-outcome
  measures. The recorded interaction is part of a therapy study but is not a therapist-client
  dialogue in the narrow sense.
