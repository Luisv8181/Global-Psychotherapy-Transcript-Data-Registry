notes: >-
  The corpus comes from the UCLA/UW Couple Therapy Research Project. The 2017 PLOS One paper
  (PMC5608311, read through the Europe PMC API on 2026-09-27) describes 134 chronically distressed
  married couples, three recording sessions per couple over two years with some follow-up sessions
  missing, manual transcripts, audio and video, and behavioral codes from the Couples Interaction and
  Social Support Interaction Rating Systems. It states that the couples interacted in the absence of
  any therapist or research staff, that the study was approved by the UCLA and University of
  Washington IRBs, and that all participants gave written consent. The figure of 574 sessions is now
  confirmed from the Interspeech 2019 paper (PMC9940777), read in full on 2026-11-13: 134 couples,
  574 sessions at three time points over two years, with manual transcripts carrying speaker labels.
  That paper also confirms the 32-code split (19 SSIRS, 13 CIRS), each code rated by 3-4 trained
  annotators on a 1-9 scale, and therapy outcomes rated on a 4-point scale at 26 weeks and/or 2
  years. Geography is the United States: the study was conducted by UCLA and the University of
  Washington. License, redistribution and de-identification remain unknown: neither paper states a
  dataset license or de-identification procedure, and the data are not publicly released.
  dataset_type stays real because these are real participants from a clinical population; domain is couple_interaction because the recordings
  are not therapist-client dialogue.
