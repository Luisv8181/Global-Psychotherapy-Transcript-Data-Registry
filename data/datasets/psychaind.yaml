notes: >-
  The ACL 2026 Findings paper reports PsyChainD as a Chinese dataset of 10,456 counseling dialogues.
  The generation framework includes a Client Profiler and five specialized agents: Process Monitor,
  Client Speaker, Safety Monitor, Counselor Supervisor and Counselor Speaker. The source explicitly
  describes synthesis rather than naturally occurring counseling sessions. Longitudinal structure,
  dataset access, license and redistribution conditions were not established in this pass, so those
