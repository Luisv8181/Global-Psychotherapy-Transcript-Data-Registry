  notes: >-
    The GitHub repository has no license file and its README states no license. The Data
    Availability Statement of the 2023 Future Internet paper was read directly on 2026-11-07 and
    states the full version of AnnoMI is available under the Public Domain License at the
    repository URL, accessed on 10 Mar 2023. That statement is in the paper, not a license file
    where the data lives, so the public-domain claim rests on the paper alone. The CC BY 4.0
    license belongs to that journal article, not to the dataset. The paper also reports that
    video owners consented to dataset creation and public release for research.
