access:
  level: open
redistribution: conditional
license:
  type: public-domain-reported
  verified: false
  source: https://www.mdpi.com/1999-5903/15/3/110
  notes: >-
    The GitHub repository has no license file and its README states no license. The data
    availability statement of the 2023 Future Internet paper is reported to release the dataset
    under a "Public Domain License"; this has not been read directly here. The CC BY 4.0 license
    previously recorded belongs to that journal article, not to the dataset. The paper also reports
    that video owners consented to dataset creation and public release for research.
privacy:
  deidentified: documented
  contextual_reidentification_assessed: unknown
evidence:
  primary_sources:
    - https://github.com/uccollab/AnnoMI
    - https://www.mdpi.com/1999-5903/15/3/110
notes: The repository describes the dialogues as demonstrations, so AnnoMI is excluded from the real-session population. dataset_type stays unknown because the registry's dataset-type vocabulary has no category for demonstration or role-play recordings; source_context carries the distinction. Whether demonstrations used real clients or actors is not established per video.
