notes: >-
  The repository describes the dialogues as demonstrations, so AnnoMI is excluded from the
  real-session population. Its 119 source videos are listed in the video catalog (data/videos/).
  On 2026-09-26, 117 were still online, the video behind transcript 89 was gone, and the one
  behind transcript 118 returned an unsettled response. 42 of the 119 are also source videos of
  HighQuality (Pérez-Rosas et al., 2019), so the two corpora share material. Anno-AugMI and
  Anno-FairMI (record anno-augmi) are augmented releases of AnnoMI's therapist utterances.
  Whether demonstrations used real clients or actors is not established per video. Re-verified
  2026-11-07: counted from AnnoMI-full.csv, 13,551 rows hold 9,699 distinct utterances (8,839
  high-quality and 860 low-quality) across 133 transcripts (110 high-quality and 23 low-quality
  dialogues), matching the paper section 3.1 exactly; the extra rows are duplicate annotations
  of the 7 inter-annotator-agreement transcripts. The MDPI page for the 2023 Future Internet
  paper, previously refused to automated fetch, loaded on 2026-11-07 and its Data Availability
  Statement was read directly. The paper states explicit permission was obtained from video
  owners and from individuals appearing in the videos, and that the study was approved by the
  Ethics Committee of the University of Aberdeen on 1 April 2021. Funding was the EC H2020
  Marie Sklodowska-Curie PhilHumans project, contract 812882, with partial funding from the
  ASTRID project. Geography remains unknown: the videos come from YouTube and Vimeo and no
  country is stated. The 2026-09-26 video-availability check was not repeated this run.
last_verified: 2026-11-07
