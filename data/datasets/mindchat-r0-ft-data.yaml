domain: mental_health_counseling
source_context: >-
  Approximately 4.5K Chinese mental-health consultation dialogues collected from
  the YiXinLi platform, released on Hugging Face for building and evaluating
  MindChat-R0, an empathetic safe-response conversational model. Each sample is
  a short multi-turn exchange. Topics cover stress, relationships, anxiety,
  study and workplace pressure, family conflict and self-growth. Released in
  synchronized JSONL and Parquet files (train, validation and test splits),
  one dialogue per row.
