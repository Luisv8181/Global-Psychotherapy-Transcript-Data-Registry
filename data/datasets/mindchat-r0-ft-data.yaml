notes: >-
  The 4.5K figure is the dataset's own approximate count, not independently
  counted. The dataset and the companion model dongSHE/MindChat-R0 (Qwen3-8B
  base) were both published on 2025-10-15. This is a different corpus from
  MindCorpus (Xue et al., arXiv 2601.01993, 5.7k synthetic sessions with no
  release artifact). Different size, and collected platform dialogues rather
  than synthetic roleplays. The "R0" name, the MindChat name, the YiXinLi
  platform (one of MindCorpus's reported seed sources) and the "dongSHE"
  handle all suggest a link to the same author team, but account ownership is
  unconfirmed and the dataset card links no paper or repository, so the
  relation stays a lead. Secondary corroboration only. The CPsyCoun paper
  cites "MindChat (Yan and Xue, 2023)" as available online. Provenance type is
  unknown because the README says dialogues "reflect real user concerns and
  counselor-like responses" without stating the responders were real
  counselors, so per the agent protocol they are not classified as real.
