notes: >-
  PsyDial is explicitly described by the authors as a semi-real Chinese-language dataset created by reconstructing real-world, long-term counseling dialogues. It should not be counted as a direct real-session transcript corpus because the released dialogue is reconstructed rather than the original observed interaction. The registry therefore keeps it in a derived/hybrid population and links it to the real-world source context. Re-verified 2026-11-14. The paper states 2,382 reconstructed long-term dialogues, and the D1, D2, D3 and D4 files on Hugging Face were each counted at 2,382 dialogues. D1-D4 are the same dialogues at four RMRR stages. D101 is the 101-dialogue test set from professional counseling books, but its file holds 1,278 rows of single-turn evaluation items (messages plus golden response), not 101 rows. D0_m, the masked real-world dialogues, returned HTTP 401 on anonymous download, so it is gated behind Hugging Face authorization while D1-D4 and D101 download anonymously. License is unresolved. The GitHub repository LICENSE is CC0-1.0 while every Hugging Face dataset card declares apache-2.0, and the paper states no license. No license is recorded as verified until the conflict is clarified, so the record moves from verified to partially-verified.
last_verified: 2026-11-14
