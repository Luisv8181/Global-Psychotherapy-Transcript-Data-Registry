notes: >-
  PsyDial is explicitly described by the authors as a semi-real Chinese-language dataset created by reconstructing real-world, long-term counseling dialogues. It should not be counted as a direct real-session transcript corpus because the released dialogue is reconstructed rather than the original observed interaction. The registry therefore keeps it in a derived/hybrid population and links it to the real-world source context. Re-verified on 2026-11-06. The released PsyDial set is D4 with 2,382 dialogues per the Hugging Face dataset card, and D101 holds 101 dialogues collected from professional counseling books.
last_verified: 2026-11-06
