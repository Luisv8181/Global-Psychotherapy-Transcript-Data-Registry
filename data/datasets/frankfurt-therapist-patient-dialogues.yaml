last_verified: 2026-11-06
notes: >-
  Methods paper read in full on 2026-11-06. Authors are Tobias Mayer, Neha
  Warikoo, Oliver Grimm, Andreas Reif and Iryna Gurevych. The paper was
  presented at NeurIPS 2022. It reports no session count and does not state the
  language of the dialogues, so both stay unknown; the sessions were recorded at
  a Frankfurt clinic, which is not treated as evidence of language. A web search
  on 2026-11-06 found no follow-up paper and no public release of the data, only
  the NeurIPS 2022 listing of the same paper. The collection is therefore
  recorded as unreleased and metadata-only. The dataset_type real rests on the
  paper's statement that the dialogues are part of the clinical routine at the
  psychiatry clinic, with real patients giving informed consent. Transcripts are
  part of the planned pipeline but the paper does not confirm completed
  transcripts, so transcript availability stays unknown.
