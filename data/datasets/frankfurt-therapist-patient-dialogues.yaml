id: frankfurt-therapist-patient-dialogues
title: "GDPR Compliant Collection of Therapist-Patient-Dialogues"
canonical_url: https://arxiv.org/abs/2211.12360
status: partially-verified
dataset_type: real
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Real therapist-patient dialogues recorded as part of routine treatment in the
  Department of Psychiatry, Psychosomatic Medicine and Psychotherapy at
  University Hospital Frankfurt, collected for NLP research under a cooperation
  contract with the Ubiquitous Knowledge Processing Lab at TU Darmstadt. Sessions
  were recorded with two microphones, one channel per speaker, and the paper's
  research goal is ex-post analysis of linguistic behaviour against clinical
  parameters, including suicidality risk. Clinical parameters recorded per patient
  are the Clinical Global Impression Scale, the Global Assessment of Functioning,
  the Depressive Symptom Index, the severity of psychopathological findings, and
  psychopharmacological medication. The paper is a methods account of starting
  the collection under the GDPR, not a data release. It reports no session count,
  no language, and no public access route.
