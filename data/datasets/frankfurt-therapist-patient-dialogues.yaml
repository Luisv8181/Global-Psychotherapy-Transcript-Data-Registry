access:
  level: metadata-only
  requirements: >-
    No public access route. The paper states the data are shared only between
    the two partner universities under a cooperation contract, that access is
    restricted to project members who sign non-disclosure agreements, and that
    the data must be deleted on the computer-science side once experiments are
    complete. The hospital retains the data for 10 years for legal reasons.
redistribution: prohibited
license:
  type: unknown
  verified: false
  notes: >-
    No dataset license is stated in the paper. The arXiv preprint itself is
    distributed under a Creative Commons license; that license covers the paper,
    not the data.
privacy:
  deidentified: true
  contextual_reidentification_assessed: unknown
  notes: >-
    The paper describes a two-stage process. Audio recordings are pseudonymised
    with a human in the loop, then identifying events are removed manually to
    reach anonymised data, with a human rater confirming completeness. Voice is
    treated as identifying under the GDPR, so raw speech is not transferred
    between institutes and only technical audio features are shared. No formal
    re-identification assessment is reported; the paper notes that unique
    identifying events occur more often in forensic psychiatry.
