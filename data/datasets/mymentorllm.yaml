notes: >-
  The dataset card reports 2,100 simulated CBT sessions, 65,100 dialogue turns and 27,900 FLAC
  audio clips, with 263.4 hours of synthetic speech audio. The accompanying paper describes a
  multimodal voice/text simulation environment linking a DSM-5-TR-grounded simulated patient,
  therapist-in-training and expert supervisor. Seven model/modality conditions are described in the
  dataset card. The accessible dataset page used for verification is a test/viewer page, so the
  definitive release location should be rechecked. No real patient sessions are claimed.
