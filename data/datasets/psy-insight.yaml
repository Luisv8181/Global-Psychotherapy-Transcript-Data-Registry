notes: >-
  The official repository reports 520 English counseling sessions and 521
  Chinese counseling sessions in its data documentation, while the project
  README describes 6,208 English dialogue rounds and 5,776 Chinese rounds.
  Because the source materials expose conflicting counts across repository
  pages and do not establish a single consistent session total in the reviewed
  primary sources, sessions is left unknown. Provenance is also left unknown:
  the repository describes counseling dialogues and examples, but the reviewed
  sources do not establish whether the conversations are naturally occurring,
  demonstrations, role-play, synthetic, or a mixture. Third-party processed
  derivatives describe the data as following upstream source licenses, which
  reinforces that dataset-specific redistribution terms need separate verification.
