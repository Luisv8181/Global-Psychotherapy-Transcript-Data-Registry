status: partially-verified
dataset_type: unknown
dialogue_structure: multi_turn
domain: mental_health_counseling
source_context: >-
  Bilingual multi-turn mental health counseling dataset with session- and
  turn-level annotations for psychotherapy type, topic, stage, strategy,
  emotion, observation, reasoning, and summaries. Dialogues were collected
  from psychotherapy books, blogs, and crawled corpora. The repository
  copyright document names Book3 (psychotherapy books filtered from The Pile),
  MNBVC, PsyArXiv, the Emotional First Aid Raw Dataset crawled from Yixinli
  and Douban, and CBook. The paper organizes the material hierarchically as
  Case, Session, Turn, with 189 cases and 951 sessions. Annotations were
  produced by mapping explanatory text from the source books onto dialogues
  with a sliding-window algorithm plus embedding and LLM relevance checks,
  then human review. The dataset is anonymous per the project page, which
  also exposes the underlying dialogue content, so the registry records
  metadata and official links only.
