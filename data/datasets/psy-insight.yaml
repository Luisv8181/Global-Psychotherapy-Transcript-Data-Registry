domain: mental_health_counseling
source_context: >-
  Bilingual multi-turn mental health counseling dataset with session- and
  turn-level annotations for psychotherapy type, topic, stage, strategy,
  emotion, observation, reasoning, and summaries. The project's public data
  documentation describes English and Chinese counseling sessions and states
  that the dataset is anonymous. The project page also exposes the underlying
  dialogue content, so the registry records metadata and official links only.
