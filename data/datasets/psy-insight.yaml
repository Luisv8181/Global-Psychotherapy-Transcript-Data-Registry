notes: >-
  Sessions counted from the released data files on 2026-11-17. The file
  en_data_version7.json holds 520 sessions with 6,208 dialogue turns and
  cn_data_version7.json holds 431 sessions with 5,776 turns, 951 sessions in
  total. Those counts match the paper Tables 2 and 3 and its Figure 1 exactly,
  and they supersede the conflicting figures in data README.md, which says
  460 English sessions in one place and 430 in another and 521 Chinese
  sessions. The paper Table 1 psychotherapy distribution is internally
  inconsistent, its session counts sum to 824 against a stated overall of 786
  and its Unknown row pairs 10 sessions with 13.15 percent, so the modality
  counts reported here are the counted file values, not the paper table.
  Counted psychotherapy labels in the English file are Solution-Focused Brief
  Therapy 350, Psychoanalytic Therapy 44, Cognitive Behaviour Therapy 40,
  Client-Centered Therapy 22, Adlerian Therapy 16, Family Therapy 10,
  Acceptance Commitment Therapy 8, Marriage and Family Systems Therapy 8,
  Rational Emotive Behavior Therapy 8, Gestalt Therapy 5, Reality Therapy 4,
  Postmodern Therapy 3, Existential Therapy 2. Counted labels in the Chinese
  file are Cognitive Behavioral Therapy 191, Unknown 75, Solution-Focused
  Brief Therapy 48, Psychodynamic Therapy with Infants and Parents 23,
  Family Therapy 18, Multicultural Integration Therapy 14, Postmodern Therapy
  13, Existential Therapy 7, Gestalt Therapy 7, Marriage and Family Systems
  Therapy 7, Reality Therapy 6, Client-Centered Therapy 6, Rational Emotive
  Behavior Therapy 5, Adlerian Therapy 4, Feminist Therapy 4, Psychoanalytic
  Therapy 2, and one blank label. Longitudinal is true because the paper
  section 4 records 189 cases, 114 English and 75 Chinese, with each case
  holding several sessions in a counseling cycle, and the Chinese file carries
  stage labels from 1st Session to 34th Session. The English file carries no
  stage values. Provenance stays unresolved for classification. The paper
  describes the dialogues as face-to-face counseling drawn from blogs and
  books and calls them real counseling data, but the underlying material is
  published case material from books and crawled corpora, and no source states
  whether the clients were real, so dataset_type stays unknown pending an
  owner call. Geography stays unknown because no source states where the
  dialogues come from, and author affiliation is not dataset geography.
  Redistribution stays unknown because the inherited licenses differ by source
  and no combined redistribution statement exists. A processed derivative on
  Hugging Face states that rights and licensing follow the upstream sources,
  which reinforces that dataset-specific redistribution terms need separate
  verification. No videos or dialogue content are recorded here; the record
  holds metadata and official links only.
