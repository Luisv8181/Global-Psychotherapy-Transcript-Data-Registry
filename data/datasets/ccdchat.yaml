notes: >-
  Statistics are the paper's reported figures: 4,500 sessions, 16.2 average
  turns, 7,500 seed CCDs, 98% retention after filtering, 1,500 dialogues per
  attitudinal stance used for training. Preprint only: arXiv 2604.06551v1,
  submitted 2026-04-08. Authors: Chang Liu, Changsheng Ma, Yongfeng Tao, Bin
  Hu, Minqiang Yang (Lanzhou University). The paper's ethics section says the
  framework is designed as a supportive instrument under professional
  supervision, not a standalone counseling entity, with clinical scope
  restricted to mild depression and anxiety. Limitations stated in the paper:
  therapy is simulated as a single extended dialogue rather than multiple
  sessions; text-only, so nonverbal cues are absent; Chinese language and
  cultural contexts may limit generalizability. Lineage: CCDs built from
  C2D2; related DiaCBT corpus is recorded separately as diacbt. Record stays
  partially-verified until a locatable release artifact (repository, dataset
  card, or access route) surfaces.
