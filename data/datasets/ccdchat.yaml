id: ccdchat
title: "CCDChat: synthetic multi-turn CBT dialogue dataset"
canonical_url: https://arxiv.org/abs/2604.06551
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Synthetic Chinese CBT dialogues generated by the CCD-CBT multi-agent
  framework (Client Agent, Therapist Agent, Control Agent) from Lanzhou
  University. The framework dynamically reconstructs the client's Cognitive
  Conceptualization Diagram (CCD) during the session instead of fixing it in
  advance, and the Therapist Agent works from the Control Agent's inferred CCD
  rather than the client's ground-truth state, enforcing the information
  asymmetry of real therapy. Sessions follow the four standard CBT phases
  (Identification, Assessment, Intervention, Summary). The 7,500 seed CCDs
  were constructed from the Chinese CBT resource C2D2 (Wang et al., 2023).
  Each CCD is paired with a Client Agent under three attitudinal stances
  (positive, neutral, negative), producing three candidate dialogues; a
  two-stage quality filter (format/termination/turn-count checks, then a
  Cognitive Therapy Rating Scale proxy scored 0-6 per dialogue, threshold 4)
  retained 98% of candidates, yielding the final 4,500 sessions. The paper
  reports an average of 16.2 turns per dialogue and seven situational life
  domains, with Family (25%) and Work (20%) the most frequent. Two licensed
  CBT practitioners evaluated sampled dialogues on Helpfulness, Logical
  Coherence, Empathy, and Guidance, rating CCDChat above CACTUS and
  PsyDTCorpus on all four criteria. The dialogues are entirely synthetic;
  the paper states no personally identifiable information is present. The
  paper's Table 1 marks CCDChat "Available", but no repository, dataset card,
  or download URL appears anywhere in the paper, so no access route is
  recorded here.
