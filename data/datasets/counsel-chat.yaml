id: counsel-chat
title: "Counsel Chat: Therapist Answers to Help-Seekers' Questions"
canonical_url: https://github.com/nbertagnolli/counsel-chat
status: partially-verified
dataset_type: real
dialogue_structure: single_turn_qa
domain: psychotherapy
source_context: >-
  Scraped from counselchat.com, where individuals posted questions and licensed therapists posted
  answers. Each row is one therapist's answer to one question.
geography:
  countries:
    - United States
  regions:
    - north_america
  scope: single_country
  evidence_level: reported_by_dataset_provider
languages: [en]
language_context: original
therapy_modalities:
  - counseling
clinical_topics:
  - depression
  - anxiety
  - counseling_fundamentals
  - intimacy
  - relationships
  - parenting
  - family_conflict
  - self_esteem
sessions: null
longitudinal: false
transcript:
  available: true
  format:
    - csv
modalities:
  - text
annotations:
  - topic
  - upvotes
  - views
access:
  level: open
  requirements: None. Data is in the GitHub repository and on Hugging Face (nbertagnolli/counsel-chat).
redistribution: conditional
license:
  type: MIT
  verified: true
  source: https://github.com/nbertagnolli/counsel-chat/blob/master/LICENSE
  notes: >-
    The repository is MIT-licensed, but the answers were scraped from counselchat.com and written by
    the therapists who posted them. The MIT license is the repository author's and may not extend
    to that third-party text, so redistribution is recorded as conditional.
privacy:
  deidentified: false
  contextual_reidentification_assessed: unknown
  notes: >-
    The Hugging Face dataset card states the data is not anonymized and that
    individuals' names can be found in the dataset; therapist names were kept
    as part of the original dataset. Rows include each answering therapist's
    information and profile URL. Questions are posts by members of the public.
evidence:
  primary_sources:
    - https://github.com/nbertagnolli/counsel-chat
    - https://huggingface.co/datasets/nbertagnolli/counsel-chat
publication_year: 2020
release_year: 2020
historical_significance:
  - early open English corpus of licensed therapists' written responses, widely used for counseling LLM fine-tuning
notes: >-
  Counted from data/20200325_counsel_chat.csv on 2026-09-25, 2,129 answers to 815 distinct
  questions; re-counted from the same file on 2026-11-10 with the same result
  (2,129 rows, 815 distinct questionIDs). The most common topics are depression (330 answers), anxiety (249) and counseling
  fundamentals (240). The Hugging Face dataset ships a newer scrape dated 20220401,
  counted on 2026-11-10 at 2,775 answers to 940 distinct questions; the dataset
  card says the scrape is from counselchat.com on 20220401. The README asks users to cite a 2020 Towards Data Science article rather
  than a peer-reviewed paper. The source site counselchat.com returned HTTP 503 on 2026-11-10,
  so the site itself is currently unreachable; the data remains available from the GitHub
  repository and Hugging Face. The Hugging Face dataset card also states the license is MIT.
last_verified: 2026-11-10
