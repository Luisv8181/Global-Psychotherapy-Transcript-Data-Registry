notes: >-
  The current Hugging Face dataset card reports 760 rows and describes each record as a synthetic
  counseling session containing a Client Psychological Graph, a synthetically generated client profile,
  counselor strategies and a generated dialogue. The card states that CPGs and counselor strategies
  come from anonymised real counseling sessions, while profiles and dialogues are synthetic. The
  dataset is therefore classified as hybrid under the registry taxonomy rather than real-session evidence.
  The same primary dataset card currently labels the dataset CC BY-SA 4.0 and makes it loadable without
  a gate. This supersedes the earlier registry entry's stale 2026-09-24 verification.
