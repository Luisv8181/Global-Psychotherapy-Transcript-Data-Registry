notes: >-
  As read on 2026-09-24, the paper reports processing more than 325 hours of publicly available
  psychotherapy demonstration videos, describes them as authentic counseling sessions featuring real
  therapists, and reports automated subtitle extraction, LLM-assisted transcript processing, expert
  review and multi-round manual verification. Real therapists do not establish real clients, and
  demonstration videos are usually made to teach, so on 2026-09-26 the repository owner changed
  dataset_type from real to unknown. The review could not re-read the paper that day, because
  ScienceDirect refused automated access (HTTP 403), and no preprint, dataset card or code
  repository was found; the change rests on the description recorded on 2026-09-24. The review
  stays open until someone reads the paper's data section and any data release.
