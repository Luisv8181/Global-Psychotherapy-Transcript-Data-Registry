notes: The paper reports processing more than 325 hours of publicly available psychotherapy demonstration videos and describes them as authentic counseling sessions featuring real therapists. Because the source is described as demonstration videos, the registry keeps this record partially verified until the underlying videos and the dataset's provenance are reviewed closely enough to distinguish naturally occurring clinical encounters from educational demonstrations or role-play. The paper reports automated subtitle extraction, LLM-assisted transcript processing, expert review, and multi-round manual verification.
