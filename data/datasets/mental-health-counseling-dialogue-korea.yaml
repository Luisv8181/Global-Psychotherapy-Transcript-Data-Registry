notes: >-
  Re-verified 2026-11-18. The Diagnostics 2026 paper (Jeong et al.,
  Diagnostics 16, 1817) was read in full and reports 1,661 de-identified
  Korean counseling-session transcripts from actual clients and counselors at
  accredited domestic centers, collected 2021-2023 and averaging about 30
  minutes or 5,000 Korean characters per session. Labels were assigned by two
  licensed clinical psychologists (Cohen's kappa 0.82) and are expert judgment,
  not a formal clinical diagnosis. Label distribution in Table 2 is depression
  484 (29.13 percent), anxiety 487 (29.31 percent), substance use disorder 448
  (26.97 percent) and no positive label 242 (14.56 percent), with 159 comorbid
  pairs and 27 triple-comorbid sessions. Ethics approval is Catholic Kwandong
  University Ethics Committee approval CKU-25-02-0902, dated 14 October 2025,
  with ethical review waived because the study used a publicly available
  de-identified dataset. The record's old MDPI link used ISSN 2075-0383 and
  returns 404. The correct article URL uses ISSN 2075-4418, and the DOI was
  added. The AI Hub dataset page (dataSetSn 71806, titled "심리상담 데이터")
  was read 2026-11-18 and shows build year 2024, version 1.2 final open
  2025-06-30, 73.19 MB, 465,474 labeling items and the same 484/487/448/242
  breakdown. Two unresolved tensions are recorded, not resolved. First, the AI
  Hub page describes 1,661 hours of audio, which does not reconcile with the
  paper's 1,661 sessions averaging 30 minutes (about 830 hours). Second, the
  page tags the dataset generation method as LLM and notes some synthetic data
  is excluded from the public release, while the paper treats the corpus as
  real client-counselor sessions. Access was corrected from open to
  registration, since AI Hub requires an account and download approval
  restricted to Korean nationals. License remains unknown, as no license
  statement appears on the dataset page.
last_verified: 2026-11-18
