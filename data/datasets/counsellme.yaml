modalities:
  - text
generation:
  method: llm_to_llm_simulation
  models:
    - GPT-3.5 Turbo
    - Claude-3 Haiku
    - LLaMAntino
  human_prompt_development: professional_psychotherapy_input
  real_session_influence: no direct human session generation reported
access:
