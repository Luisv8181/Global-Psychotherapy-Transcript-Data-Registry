notes: >-
  Read on 2026-09-26. The data philosophy page says the service has supported "over 8 million
  conversations" and that research based on the de-identified exchanges has produced "over 26
  peer-reviewed articles"; the research page says "over 10 million conversations with texters in
  the United States". The two figures are recorded as stated; which is current is not established.
  Counselors are trained volunteers, hence peer_support. The language of the conversations is not
  stated on the pages read. IRB approval is a stated condition of research access, recorded as a
  documented ethics review; consent terms for texters were not read (the Privacy Policy is linked
  but was not opened).
