notes: >-
  Re-read 2026-11-19. The provider's pages disagree on the conversation total, so sessions stays
  unknown. The data-philosophy page still says over 8 million conversations, the research-impact page
  says over 10 million conversations with texters in the United States, and the homepage says 16
  million conversations since 2013 globally and over 11 million in the US. Collection starts 2013,
  the year the service launched, per the homepage. The service operates in English and Spanish, so
  languages are en and es; no language split for the research database is published. Access conditions
  were re-confirmed verbatim on the data-philosophy page, namely 30-hour Crisis Counselor training,
  IRB approval, a principal investigator who is a full-time employee of the institution, and written
  approval from the institution's Office of Research or equivalent. The Privacy Policy, last updated
  2026-04-17, says starting a conversation means agreeing to the policy and Terms, that anonymized
  data is shared with researchers through a formal process with contracts in place, that PII is kept
  no longer than seven years and then anonymized or deleted, and that de-identified data is kept
  indefinitely; texters can delete their data by texting DELETE. Consent is therefore recorded as
  documented, but it is agreement to the policy and Terms on use, not a separate research opt-in.
  The research page lists peer-reviewed collaborator papers from 2015 to 2023, and the
  data-philosophy page says those papers have been cited over 600 times. The organisation has
  expanded beyond the US through its 2025 acquisition of Aquí Estoy, but the research database
  described on the research-impact page covers texters in the United States. Counselors are trained
  volunteers, hence peer_support. The FAQ says conversations usually last 15 to 45 minutes and that
  the service received International Council for Helplines accreditation in 2024.
last_verified: 2026-11-19
