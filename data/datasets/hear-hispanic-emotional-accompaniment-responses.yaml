id: hear-hispanic-emotional-accompaniment-responses
title: "HEAR: Hispanic Emotional Accompaniment Responses"
canonical_url: https://huggingface.co/datasets/BrunoGR/HEAR-Hispanic_Emotional_Accompaniment_Responses
status: verified
dataset_type: hybrid
dialogue_structure: single_turn_qa
domain: emotional_support
source_context: >-
  Spanish single-turn emotional-accompaniment pairs built to train the
  Solo Escuchame chatbot (a fine-tuned LLaMA-2-7b-Chat). Each sample is one
  user text plus one GPT-3.5-Turbo generated empathetic response, labelled
  with one of 11 Plutchik-based emotion classes. Input texts were translated
  from English sources (TweetEval, DailyDialog, HappyDB) plus responses from
  72 surveys the authors conducted, then re-annotated to the 11 classes. The
  paper presents the chatbot as a supplementary tool for psychologists, not a
  replacement for professional care. These are single-turn accompaniment
  pairs, not therapy sessions and not multi-turn dialogues.
languages:
  - es
publication_year: 2024
release_year: 2024
annotations:
  - 11 Plutchik-based emotion classes (affection, joy, admiration, anger, sadness, optimism, hate, surprise, fear, calm, disgust)
