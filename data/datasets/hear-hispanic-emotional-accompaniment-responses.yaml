notes: >-
  Row counts counted from the released Parquet files on 2026-11-08 with
  pyarrow: train 41,910, validation 2,220, test 1,320 (45,450 total). The
  paper section 3.1 reports different figures (train 41,481, validation
  2,200, test 1,320) and the card README reports validation 2,200 (200 per
  class); the disagreement is recorded rather than resolved. The Hugging Face
  repository was created 2023-10-20 and last modified 2024-08-07; release
  year 2024 follows the paper. Authors: Bruno Gil Ramirez, Jessica Lopez
  Espejel, Maria del Carmen Santiago Diaz, Gustavo Trinidad Rubin Linares
  (Benemerita Universidad Autonoma de Puebla; Novelis Research and
  Innovation Lab). The upstream HRECPW emotion-classification dataset is a
  related resource, not a separate record here.
