notes: >-
  The WSDM 2022 paper (read on arXiv, 2111.06647) reports about 12.9K utterances (6.38K patient,
  6.47K therapist) across 212 sessions, about 59 utterances per session, split 70-20-10, covering
  CBT, child therapy, family therapy and other approaches, with the majority of therapists and
  patients based in the United States. It calls the sources publicly available pre-recorded
  counselling videos and never says whether the clients were real or actors. The README says
  HOPE_data/ contains the complete dataset, but on 2026-09-26 it held eight session files (columns
  ID, Type, Utterance, Dialog_Act) and HOPE_data/HOPE_data_source/URL_sources.txt, a list of 348
  distinct YouTube links. That is more links than sessions, and nothing maps links to sessions. On
  2026-09-26 YouTube's oEmbed endpoint returned titles for 314 of the 348 videos (34 were removed,
  private or not embeddable). Of those 314, 110 titles contain role play, demonstration, mock or
  simulated (89 say role play), 2 contain real, actual or live, and the rest indicate neither. Only
  these aggregate counts were recorded; no titles or links were copied. Because a substantial share
  of the listed videos are titled as role-plays and the paper does not establish that any client was
  real, the repository owner changed dataset_type from real to unknown on 2026-09-26. Titles are the
  uploaders' descriptions and weaker evidence than a statement by the dataset authors.
last_verified: 2026-09-26
