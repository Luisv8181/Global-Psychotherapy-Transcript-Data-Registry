id: hope-counseling-conversations
title: "HOPE: Counselling Conversations Dataset"
canonical_url: https://github.com/LCS2-IIITD/SPARTA_WSDM2022
status: partially-verified
dataset_type: unknown
dialogue_structure: multi_turn
domain: counseling
source_context: >-
  Transcripts of 212 dyadic therapist-patient sessions from publicly available, pre-recorded
  counseling videos on YouTube, transcribed with Otter and manually corrected, and annotated with 12
  dialogue-act labels. The paper does not say whether the clients were real or actors; many of the
  listed source videos are titled as role-plays or demonstrations (see notes).
