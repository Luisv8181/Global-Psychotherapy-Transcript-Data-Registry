id: csconv
title: "CSConv: Chinese Cognitive Stimulation Conversation Dataset"
canonical_url: https://ar5iv.labs.arxiv.org/abs/2305.08200
status: partially-verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Chinese cognitive-stimulation conversations for elders with cognitive
  impairment, built from cognitive stimulation therapy videos and the HKU
  BrainLive handbook at roughly a 2 to 1 video-to-handbook ratio. The video
  portion is Cantonese material translated into Mandarin. The handbook portion
  is Mandarin conversations artificially created from the handbook's eighteen
  CS principles. Each utterance carries a CS-principle label, an emotion label,
  and an emotional support strategy label. Roles are SPEAKER (the elder) and
  LISTENER (the paper calls this role a smart speaker or a health care worker).
  The introducing paper frames cognitive stimulation as a psychological therapy;
  this is an adjacent clinical-intervention corpus rather than classic talk
  therapy, and that scope placement is flagged for owner review. The paper says
  all data were professionally produced and reviewed twice, but it does not
  establish whether the source videos show real therapy clients or
  demonstration material.
