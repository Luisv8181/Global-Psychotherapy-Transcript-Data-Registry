notes: >-
  Primary evidence is the introducing paper (Jiang et al., ACL 2023, pages
  10628 to 10640) read in full on 2026-10-14. It reports 2,643 conversations
  and 16,845 utterances (8,363 SPEAKER plus 8,480 LISTENER), averaging 6.37
  utterances per conversation (Table 2). The KPT paper (Jiang et al., arXiv
  2406.16567), which uses CSConv as an experimental dataset, independently
  confirms the 2.6K CS-based conversation description and the Chinese
  cognitive-stimulation identity. Source videos are Cantonese, translated to
  Mandarin. Handbook-derived conversations were artificially created in
  Mandarin. The handbook is the HKU social work BrainLive program, cited in
  the paper as brainlive.socialwork.hku.hk. No release year is stated in the
  paper. The official release repository github.com/jiangjyjy/CSD is
  unreachable as of 2026-10-14, so the record stays partially-verified until
  a locatable data artifact exists.
