notes: >-
  The study reports 5,097 recordings, of which 4,268 sessions were successfully processed, with a
  mean duration of 49.77 minutes, more than 2.8 million utterances and 28 million words, and at
  least 59 therapists and 1,040 clients. A later analysis of the same counseling-center dataset
  reports 610 clients, 48 therapists and 2,974 sessions after excluding intake-only clients and
  recording/processing errors. The differing counts reflect analysis subsets, not necessarily
  separate datasets. The 2021 PLOS One paper, read on 2026-09-27, confirms 4,268 automatically
  transcribed sessions from a university counseling center, University of Utah IRB approval (protocol
  83132) and participants' written consent to recording for research. The 2022 Behavior Research
  Methods paper (PMC8810915) could not be opened on 2026-09-27, because both PMC and the publisher
  returned a browser check, so the figures above attributed to it were not re-checked.
