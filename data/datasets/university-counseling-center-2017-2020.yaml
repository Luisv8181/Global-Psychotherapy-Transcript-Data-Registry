id: university-counseling-center-2017-2020
title: "University Counseling Center Psychotherapy Corpus, 2017-2020"
canonical_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8810915/
status: partially-verified
dataset_type: real
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Real-world psychotherapy sessions recorded at a large western U.S. university counseling center
  from September 2017 through March 2020. Treatment was provided by licensed staff and clinical
  trainees. The corpus was collected for automated psychotherapy-skill assessment and is not publicly
  shareable under the study's data-use restrictions.
