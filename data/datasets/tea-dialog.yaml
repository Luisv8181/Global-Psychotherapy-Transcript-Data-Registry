id: tea-dialog
title: "TEA-Dialog: Tool-enhanced Emotional Support Conversation Dialogues"
canonical_url: https://huggingface.co/datasets/XingYuSSS/TEA-Dialog
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: emotional_support
source_context: >-
  Synthetic emotional support dialogues released with TEA-Bench (Sui et al.,
  Harbin Institute of Technology), an interactive benchmark for evaluating
  tool-augmented emotional support agents. Each dialogue pairs a simulated
  user with an LLM supporter that has access to an MCP-style tool environment
  (time, maps, places, Reddit-sourced relatable experiences, etc.) for
  grounded instrumental support. The 81 scenarios are fine-grained emotional
  support situations adapted from ExTES (Zheng et al., 2024); simulated
  temporal and location contexts are treated as latent scenario attributes,
  not real collection sites. Per the paper, the 365 released dialogues were
  selected from interactions of nine evaluated LLMs on the basis of high
  TEA-Scores (above 80) and absence of detected hallucinations, with
  additional human filtering. Each row carries per-dialogue TEA-Scores and
  hallucination metrics. A companion TEA-Scenario.json config releases the 81
  scenarios. Fully simulated: no real users or clients are involved.
therapy_modalities:
  - emotional_support
languages:
  - en
sessions: 365
longitudinal: false
annotations:
  - TEA-Scores per dialogue (Information, Humanoid, Fluency, Diversity, Effectiveness)
  - hallucination metrics per dialogue (content, all_hallucination, content_hallucination)
  - user type (Action-oriented or Emotion-oriented)
  - end reason
