notes: >-
  365 counted from TEA-Dialog.json on 2026-10-12; the paper reports the same
  figure ("a dataset of 365 high-quality dialogues"). content_messages per
  dialogue: min 4, max 30, mean 8.3. Per the paper's Table 9, 320 dialogues are
  Action-oriented and 45 Emotion-oriented user type. Contributing models (from
  the source_file field): gemini-2.5-flash, gpt-4.1-nano-ca, gpt-4o-mini,
  qwen-plus, qwen3-14b, qwen3-235b-a22b-instruct-2507, qwen3-32b, qwen3-8b,
  qwen3-next-80b-a3b-instruct. The supporter system prompt observed in the
  data file instructs the agent not to mention or imply it is an AI
  assistant, so supporters impersonate human supporters; researchers reusing
  the dialogues should be aware of this framing. The paper's SFT finding
  (fine-tuning on TEA-Dialog improves in-distribution support but generalizes
  poorly) is a result about the dataset, not a property of it. Authors'
  affiliation: Harbin Institute of Technology. Venue/publication details
  beyond the arXiv preprint (e.g. conference version) are unconfirmed.
