  requirements: null
redistribution: unknown
license:
  type: unknown
  verified: false
  notes: >-
    No dataset license statement was found. The paper says the dataset is available
    for research purposes but names no access route, repository, or contact, so
    access and licensing could not be established. The arXiv and ACM licenses apply
    to the paper, not to the data.
privacy:
  deidentified: documented
  contextual_reidentification_assessed: false
  notes: >-
    The paper documents three measures: manual removal of personal information,
    cropping out mentions of specific people or places, and replacing raw frames
    with OpenPose feature points in the released visual modality. It also states the
    clips are re-enactments of teaching cases, so no real patient appears in the
    visual content. No contextual re-identification assessment was documented.
ethics:
