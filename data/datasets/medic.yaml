id: medic
title: "MEDIC: A Multimodal Empathy Dataset in Counseling"
canonical_url: https://arxiv.org/abs/2305.02842
status: partially-verified
dataset_type: demonstration
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Multimodal empathy-annotation dataset built from re-enacted face-to-face counseling
  cases. The paper states the source material is UM Psychology's counseling case
  videos in which both the client and the counselor are UM Psychology counselors who
  acted out cases that used to be real, each case played out by two different
  counselors. The final released visual modality is OpenPose face, torso and arm
  feature points rather than raw video frames, and the paper states the original
  patient is absent from the visual content. The dataset is designed for predicting
  empathic communication at the talk-turn level, not for modeling naturally
  occurring sessions.
languages:
  - zh
language_context: >-
  Dialogues are originally in Chinese. The paper's example table marks its English
  text as the translation of the original, the annotation team was five
  Chinese-speaking students, and the named video source is the Chinese platform
  xiaoeknow.com.
clinical_topics:
  - marital relationships
  - professional dilemmas
  - family education
  - meaning of life
