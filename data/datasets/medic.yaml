  supporting_publications:
    - https://ustc-ac.github.io/publication/manual-mm23-zhu/
publication_year: 2023
notes: >-
  Provenance and classification are resolved from the paper's data-collection
  section: 10 cases were divided into 38 videos averaging 17 minutes 50 seconds,
  totalling 678 minutes (about 11 hours), segmented into 771 talk turns with an
  average length of 52.76 seconds, 4.29 speaking turns and 129.45 words each.
  Sessions is left null because the paper reports cases, videos and talk turns but
  no session count, and participants is left null because the number of distinct
  counselors across the 10 cases is not stated. The access route and license could
  not be established: the paper names no dataset URL, code repository, or request
  contact, and a search for a release site or code repository found none, so status
  is partially-verified rather than verified. No videos or dialogue content are
  recorded here; the record holds metadata and official links only.
last_verified: 2026-10-10
