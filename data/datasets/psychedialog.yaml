id: psychedialog
title: "PsychēDialog"
canonical_url: https://huggingface.co/datasets/Johnnyfans/PsycheDialog
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Multi-turn counseling dialogues synthesized through interactive LLM role-playing:
  a Dialogue-Guided Seeker agent (role cards built by summarizing 5,000 PsyDT
  dialogues, filtered to 1,003 evenly distributed cards) interacts with an
  Emotion-Focused Therapy counselor pipeline that tracks the seeker's emotion
  shifts and runs a safety risk analysis before each response. Fully synthetic;
  no human sessions behind the dialogues.
