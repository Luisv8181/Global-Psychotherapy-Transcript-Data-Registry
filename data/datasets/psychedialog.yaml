evidence:
  primary_sources:
    - https://huggingface.co/datasets/Johnnyfans/PsycheDialog
    - https://github.com/XNeil12138/PsycheChat
  supporting_publications:
    - https://arxiv.org/html/2601.12392
publication_year: 2026
notes: >-
  Paper: PsychēChat, arXiv 2601.12392 (submitted 18 Jan 2026; authors at East
  China University of Science and Technology and Shanghai Changning Mental
  Health Center). Table 1 reports 1k dialogues at 13.1 average turns and 43.1
  average utterance length; the Hugging Face API reports the train split as
  exactly 1,003 examples in one parquet file. Seeds are 5,000 PsyDT dialogues
  (Xie et al., 2025). The repository README claims acceptance to EMNLP 2026
  Main; that claim is from the project authors and is not confirmed from
  proceedings. Training splits for the two inference paradigms
  (PsycheDialog-Counselor-Agent-Mode, PsycheDialog-Counselor-LLM-Mode) and the
  seeker model (PsycheDialog-Seeker) are released alongside on Hugging Face.
last_verified: 2026-10-15
