notes: >-
  Counts are the paper's reported figures. The 14,797 figure counts labeled
  listener utterances only, across 734 conversations. The number of member
  utterances and the total message count per conversation are not stated, and
  the number of distinct listeners and members is not stated, so participants
  is left null. The paper's section 2 says the corpus was annotated using a
  multi-label approach. The average conversation rating across the dataset was
  4.14, and the paper groups ratings 4 to 5 as satisfactory and 1 to 3 as
  unsatisfactory. The four new codes are Support, Inappropriate, Chit-Chat
  and Other, defined in section 4.1. Longitudinal is set true because the
  paper's second research question tracks the same listeners' technique use as
  they gain experience. Lineage flag: this corpus is the plausible upstream
  source for the reflections-in-peer-counseling record (O'Neil et al. 2023),
  whose pairs were filtered from a larger annotated counseling-skills
  dataset on an unnamed peer-to-peer platform, but no primary source read
  here confirms the link, so it stays unconfirmed. The introducing paper is
  Shah et al., Proc. ACM Hum.-Comput. Interact. 6, CSCW2, Article 527,
  November 2022, read in full from the author-hosted PDF. The arXiv copy is
  arXiv 2211.05182, submitted 2022-11-09.
