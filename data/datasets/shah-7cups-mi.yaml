id: shah-7cups-mi
title: "Modeling Motivational Interviewing Strategies On An Online Peer-to-Peer Counseling Platform (7 Cups corpus)"
canonical_url: https://doi.org/10.1145/3555640
status: partially-verified
dataset_type: peer_support
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Listener utterances from one-to-one text chats between support seekers and
  volunteer peer counselors on 7 Cups of Tea, sampled January to August 2020
  and annotated with motivational interviewing technique codes. The listeners
  are volunteers who receive 30 to 60 minutes of training and must pass an
  exam, and are not licensed professionals. After each conversation, members
  may rate the conversation on a 5-point Likert scale from 1 (worst) to 5
  (excellent). The annotation scheme has 17 codes, 13 drawn from MITI manuals
  plus four created for the online setting, namely Support, Inappropriate,
  Chit-Chat and Other. Annotation combined manual labeling with a
  semi-supervised pass in which a fine-tuned BERT model suggested labels at
  0.7 confidence or above and annotators manually verified each suggestion
  before assigning it. The annotated set grew from 1,539 utterances in 147
  conversations to 14,797 utterances in 734 conversations.
