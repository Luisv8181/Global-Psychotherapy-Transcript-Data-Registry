access:
  level: metadata-only
  requirements: >-
    No public access route is confirmed. The paper states the authors will
    release the dataset and the Mental Health BERT models subject to
    appropriate privacy and ethical considerations, but names no repository,
    dataset page or download location, and no release artifact was found on
    2026-11-12 in GitHub repository search, the Hugging Face datasets and
    models APIs, or web search. Data were obtained by the authors through a
    research collaboration with 7 Cups of Tea.
redistribution: unknown
license:
