  verified: false
  notes: >-
    No dataset license is stated in the paper and no dataset page exists to
    carry one. The paper itself is published under a CC BY 4.0 license per the
    NSF PAR copy, but that license covers the paper, not the data.
privacy:
  deidentified: true
  contextual_reidentification_assessed: false
  notes: >-
    The paper states messages were anonymized by not including the usernames
    of members or listeners, and that all examples shown in the paper were
    paraphrased from 7 Cups chats using round-trip translation instead of
    being quoted directly. No re-identification assessment was reported, and
    the dataset itself was not described as de-identified beyond the username
    removal, so this is recorded as the paper's anonymization claim, not as a
    guarantee of anonymity.
