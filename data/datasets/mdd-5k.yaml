publication_year: 2025
release_year: 2024
notes: >-
  The AAAI 2025 paper (arXiv 2408.12142v2, read in full 2026-11-09) describes MDD-5k as built from
  1,000 anonymized real patient cases from Shanghai Mental Health Center, covering over 25
  diseases, and comprising 5,000 conversations with diagnosis results and treatment opinions as
  labels; the diagnosis tree covers depression (F32), anxiety (F41), sleep disorders (F51),
  childhood emotional disorder (F98) and unspecified mood disorder (F39) for over 85 percent of
  conversations. The repository README instead says 926 unique patient files yielding 4,630
  conversations. Counted from the repository on 2026-11-09 (GitHub git-trees API, not truncated),
  MDD_5k/ holds 925 JSON files and Label/ holds 925 label files; patient numbers run to 1034 with
  gaps (patient_1033 returns 404). Three sampled files (patient_1, patient_926, patient_1034) each
  hold 5 conversations of 18-29 turns, so the repository holds 4,625 conversations. The three
  counts (paper 5,000, README 4,630, counted 4,625) disagree and are recorded here rather than
  reconciled. Label files hold an ICD-10 code and a diagnosis result (verified on
  patient_1002_label.json: ICD_Code F32.901, Diagnosis_Result in Chinese). One example raw patient
  case is shown in raw_data/pa20.json and one example synthesized set in DataSyn/patient1.json.
  The paper's ethical statement says all patients were informed their information would be
  collected and used exclusively for research purposes, and that the dataset was undergoing ethics
  review with release planned only after the review finished; the repository is public now, but no
  source states the review's outcome, so ethics_review_documented stays unknown. The paper calls
  MDD-5k the first labeled Chinese mental disorders diagnosis dataset. The dialogues are Chinese;
  only a Chinese version is released, with an English translation planned per the paper.
  Classification is hybrid, following the MusPsy precedent: dialogues are LLM-generated from real
  case material rather than transcripts of real sessions.
last_verified: 2026-11-09
