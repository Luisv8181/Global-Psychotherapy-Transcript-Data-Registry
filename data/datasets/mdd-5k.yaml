id: mdd-5k
title: "MDD-5k: A New Diagnostic Conversation Dataset for Mental Disorders Synthesized via Neuro-Symbolic LLM Agents"
canonical_url: https://github.com/lemonsis/MDD-5k
status: verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: clinical_interview
source_context: >-
  Synthetic diagnostic conversations between a doctor agent and a patient agent, generated by LLMs
  under symbolic control of a dynamic diagnosis tree based on the Structured Clinical Interview for
  DSM-5, from anonymized real patient cases. These are simulated diagnostic interviews, not
  recordings of real sessions; each patient case yields five alternative conversations, with
  fictitious patient experiences added for diversity.
