redistribution: conditional
license:
  type: MIT
  verified: true
  source: https://github.com/lemonsis/MDD-5k/blob/main/LICENSE
  notes: >-
    The repository root LICENSE file is MIT (Copyright 2024 Congchi Yin) and was read at the data
    location. It does not state explicitly whether it covers the dataset files as well as the code,
    and the paper says the dataset was to be released for research purposes only; treat dataset
    reuse terms as the repository license plus that stated research-only intent. The underlying
    patient cases belong to Shanghai Mental Health Center, so reuse of that source material may be
    constrained regardless of the repository license.
privacy:
  deidentified: documented
  contextual_reidentification_assessed: unknown
  notes: >-
    The paper's Patient Cases Preprocessing section says all cases were masked following the
    Chinese health-data security guide GB/T 39725-2020: names, dates of birth and examination
    dates removed, ages rounded to the nearest ten, concrete locations replaced with vague or fake
    ones. No re-identification assessment is reported.
