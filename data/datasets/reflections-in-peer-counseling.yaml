access:
  level: metadata-only
  requirements: >-
    The data are not publicly shared. The paper (section 3.1) states the
    client-counselor data cannot be publicly shared due to its sensitive
    nature and privacy concerns, and the Hugging Face page states the same and
    holds the dataset card only, with no data files (the page reports the
    dataset is currently empty).
redistribution: unknown
license:
  type: unknown
  verified: false
  notes: >-
    No dataset license is stated on the dataset card or in the paper, and the
    Hugging Face page carries no license tag. The paper is published under the
    ACL open-access license; that license covers the paper, not the data.
privacy:
  deidentified: unknown
  contextual_reidentification_assessed: false
  notes: >-
    Whether the underlying data were de-identified is not stated. What the
    paper does document is presentation-level alteration: the conversational
    contexts and counselor responses shown in Table 1 were put through a full
    round of Google Translate and additionally modified by an author so the
    presented messages differ from the originals, and chat identifiers were
    used only to keep training and test conversations disjoint. That is not a
    de-identification claim about the dataset itself.
ethics:
