id: reflections-in-peer-counseling
title: "Reflections in Peer Counseling"
canonical_url: https://huggingface.co/datasets/emoneil/reflections-in-peer-counseling
status: partially-verified
dataset_type: peer_support
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Context-reflection pairs drawn from conversations between clients and
  counselors on a large peer-to-peer online counseling service. The pairs were
  filtered from a larger corpus of utterances annotated for several clinical
  counseling skills, keeping only counselor messages annotated as reflections;
  the counselors are minimally trained peer volunteers (the paper contrasts
  their 45-minute to 1-hour online training with the reference-reflection
  author's 100+ hours of crisis-hotline and textline training). Each instance
  is a conversational context (the utterances up to and including the most
  recent prior client message) plus the counselor reflection that followed.
  Reflections were annotated at utterance level with the Motivational
  Interviewing Treatment Integrity 4.2 (MITI) and Motivational Interviewing
  Skill Code 2.5 (MISC) manuals. For 500 of the prompts (350 training, 150
  test) the first author also wrote a reference reflection, simulating a
  counselor reply in roughly the time a counselor would take.
therapy_modalities:
  - motivational_interviewing
languages:
  - en
sessions: null
longitudinal: false
transcript:
  available: false
audio:
