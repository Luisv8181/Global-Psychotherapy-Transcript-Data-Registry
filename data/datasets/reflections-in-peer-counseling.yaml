  supporting_publications: []
publication_year: 2023
last_verified: 2026-11-12
notes: >-
  Counts are the paper's and card's reported figures: 1,111 context-reflection
  observations in total (911 training, 150 test, 50 held out for few-shot
  prompt design and hyperparameter tuning). 350 of the 911 training examples
  form a reduced training set. The 1,111 figure counts observations, not
  sessions or distinct chats; the number of distinct source chats is not
  stated, so sessions is left null. Test-set chat identifiers differ from
  training-set ones to avoid conversation overlap. The Hugging Face dataset
  card was created 2022-09-30; the introducing paper is O'Neil et al.,
  "Automatic Reflection Generation for Peer-to-Peer Counseling", Proceedings of
  GEM 2023, pages 62-75, Singapore, December 2023 (read in the proceedings
  PDF, paper section 3.1 and appendix C-D). The hypotheses were preregistered
  (O'Neil and Ungar, 2022, cited in the paper). The paper's human-evaluation
  annotators had worked with the source counseling-service dataset under IRB
  approval; that is the basis for ethics_review_documented. Lineage flag: the
  paper and card name no platform and no upstream corpus, saying only that the
  pairs come from a larger annotated dataset of counseling skills. A plausible
  match is Shah et al. 2022, "Modeling Motivational Interviewing Strategies on
  an Online Peer-to-Peer Counseling Platform" (7 Cups, 734 chats, 14,797
  MI-annotated utterances), but that link is NOT confirmed by any primary
  source read here, so it is recorded only as an unconfirmed lead: the Shah
  corpus itself is not yet a registry record and would need its own
  primary-source review.
