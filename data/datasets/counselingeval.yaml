notes: >-
  Counted from CounselingEval.json on 2026-11-11: 450 rows, 150 per attitude
  (positive, neutral, negative). 147 distinct client names; a few names repeat
  across profiles. Ground-truth CBT techniques span 12 labels, most frequent
  Alternative Perspective (186), Evidence-Based Questioning (159) and
  Problem-Solving Skills Training (111); each row lists 1-5 techniques.
  Dialogue openings run 2-3 turns (mean 2.0). Dataset created on Hugging Face
  2024-06-18; paper published July 2024. The AI client model named in the paper
  appendix is gpt-3.5-turbo-0125.
