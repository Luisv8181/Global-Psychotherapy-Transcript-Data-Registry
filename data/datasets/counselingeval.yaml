id: counselingeval
title: "CounselingEval: A Psychological Counseling Evaluation Framework"
canonical_url: https://huggingface.co/datasets/LangAGI-Lab/CounselingEval
status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Evaluation test set from the CACTUS paper (Lee et al., Findings of EMNLP 2024).
  150 distinct synthetic client profiles, each presented with three counseling
  attitudes (positive, neutral, negative), for 450 evaluation instances. Each row
  carries an AI client attitude and instruction, counselor-side client information
  with a 2-3 turn dialogue opening, and ground-truth CBT techniques. During
  evaluation an AI client (gpt-3.5-turbo-0125 in the paper) continues the session
  from the opening and the resulting conversation is scored with CTRS and PANAS.
  A separate artifact from the CACTUS training corpus of 31,577 dialogues; it is
  not a corpus of complete sessions.
