license:
  type: Apache-2.0
  verified: true
  source: https://modelscope.cn/datasets/YIRONGCHEN/SoulChatCorpus
  notes: >-
    The ModelScope dataset record lists Apache License 2.0, but the same page's README states that
    the project uses ChatGLM-6B weights and may be used only for non-commercial research. The two
    statements conflict, so redistribution is recorded as conditional and commercial use should not
    be assumed.
