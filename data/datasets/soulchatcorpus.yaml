publication_year: 2023
release_year: 2024
historical_significance:
  - among the largest open Chinese multi-turn counseling corpora
  - predecessor of PsyDTCorpus (SoulChat 2.0)
notes: >-
  The ModelScope README reports that the open version released on 2024-06-06 keeps 258,354
  multi-turn dialogues and 1,517,344 turns, after about 90,000 were filtered out. The GitHub README
  describes the multi-turn data as generated with ChatGPT and GPT-4 from single-turn long-text
  counseling Q&A. The EMNLP 2023 Findings paper describes a dataset of more than 2 million samples,
  counting training samples rather than dialogues. Where the single-turn questions came from is not
  stated in the sources read. Status is partially verified because the license statements on the
  dataset's own page conflict.
