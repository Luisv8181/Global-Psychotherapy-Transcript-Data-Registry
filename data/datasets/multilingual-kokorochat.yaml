notes: >-
  Re-verified 2026-11-15 against the live repository and the LREC 2026 paper (Suzuki, Qi and Inaba, pages 8838-8849). The dataset translates KokoroChat, a manually authored Japanese counseling corpus created through role-play by trained counselors, into English and Chinese with a Multi-LLM Ensemble method, so no real clients are involved and de-identification does not apply. Sessions 6589 is the Japanese source count. The released translations number 6582 English and 6565 Chinese JSON files, counted from the repository tree on 2026-11-15, matching the paper table; the README statistics table swaps the two numbers, listing English 6565 and Chinese 6582. The shortfall from 6589 is attributed in the README to LLM safety-filter exclusions. Each file holds one dialogue with role, timestamp, Japanese origin and translated content, plus topic labels and a client review with feedback scores and ethical-concern flags. The LICENSE file holds the full CC BY-NC-ND 4.0 text. Translation models and the human-preference validation are documented in the paper. Consent and ethics-review evidence for the source role-play collection remain unknown.
last_verified: 2026-11-15
