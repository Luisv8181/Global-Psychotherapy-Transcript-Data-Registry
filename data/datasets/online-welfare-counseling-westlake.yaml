notes: >-
  The authors report a large-scale, high-quality text-based counseling dataset collected over
  two years from the Xinling online welfare counseling platform. The cited paper studies
  counselor strategies, client reaction behaviors, and counseling outcomes. Re-verified against
  the full text of the ACL 2023 paper on 2026-11-18: 2,382 conversation sessions, 479 of which
  received the clients' self-reported outcome scales; the paper's Table 1 confirms the 2,382
  figure. Before annotation the authors anonymized all clients' personal information (name,
  organization, and similar), and the Ethics Statement says they "spared no efforts to manually
  de-identify and anonymize the data". Ethics approval was granted by the Institutional Ethics
  Committee (20211013LZZ001); all clients and counselors signed a consent form stating the
  conversations would be used for scientific research and might be used by third parties. The
  repository holds code only (data/ contains just a .gitkeep and a get_data.py that expects a
  local JSON file); no data files are released there. Longitudinal stays unknown: a two-year
  collection span is documented, but the paper does not document repeated observations of the
  same clients. Status stays verified, matching registry practice for records whose license is
  unknown but whose identity, provenance, and access terms are confirmed from primary sources.
