last_verified: 2026-11-12
notes: >-
  Counts from the paper Table 1 and section 4.1, read in full on 2026-11-12.
  2,382 conversation sessions, 479 with client self-reported outcome scales,
  186,972 utterances, 78.49 utterances per dialogue on average, 848 speakers
  including 40 counselors, and 520 sessions annotated with the framework. The
  paper calls it the largest real-world counseling conversation corpus in
  Mandarin. Ethics approval from the Westlake University Institutional Ethics
  Committee 20211013LZZ001. Clients and counselors signed consent forms
  stating conversations would be used for scientific research and might be
  used by third parties. Status is partially-verified, not verified, because
  no dataset license is stated anywhere. Count disagreement recorded here
  rather than resolved. The PsyCLIENT paper (arXiv 2601.07312) describes this
  dataset as 550 dialogues, while Li et al. report 2,382 sessions. The
  PsyCLIENT paper also says its 324 trajectories keep dialogues with more
  than 30 turns. The repository holds code only (data/ contains .gitkeep and
  get_data.py, no data files). The framework and classifier code are public
  but the conversations are gated as described under access. Authors are
  Anqi Li, Lizhi Ma, Yaling Mei, Hongliang He, Shuai Zhang, Huachuan Qiu and
  Zhenzhong Lan (Zhejiang University and Westlake University). ACL 2023,
  pages 10358-10376.
