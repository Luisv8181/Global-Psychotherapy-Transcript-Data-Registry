access:
  level: research-agreement
  requirements: >-
    The dataset is not publicly available. The paper states it "will be made available for
    researchers who agree to follow ethical guidelines"; the repository README says to contact
    the author (lianqi@westlake.edu.cn) for access. The paper's Ethics Statement requires
    requesters to provide a valid ID, proof of work, and the reason for the request; be
    affiliated with a non-profit academic or research institution; hold Institutional Review
    Board approval with a full-time principal investigator and written approval from the
    institution's office of Research; and sign a Data Non-disclosure Agreement promising not
    to share the data.
