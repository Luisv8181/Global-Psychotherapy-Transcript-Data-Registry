access:
  level: research-agreement
  requirements: >-
    Raw conversation data is not publicly downloadable. The repository README
    says the dataset is currently unable to be made publicly available and to
    contact Anqi Li (lianqi@westlake.edu.cn). The paper requires third-party
    requesters to provide valid ID, proof of work, and the reason for the
    request, be affiliated with a non-profit academic or research institution,
    hold IRB approval with a full-time principal investigator and written
    approval from their institution's research office, and sign a Data
    Nondisclosure Agreement promising not to share the data.
