notes: >-
  Read on 2026-09-26. The home and about pages describe "master clinicians working with real
  clients" and "renowned clinicians in session with real clients"; the FAQ describes "real client
  sessions, demonstrations, and guided reflection". Which titles are real-client sessions and which
  are demonstrations is not stated, so the repository owner set dataset_type to unknown. The
  universities page gives "350+ titles" in its plan table and "450+ streaming videos" elsewhere; both
  are recorded. The FAQ says "many" products offer a training manual with a complete transcript.
  Languages and modalities per title are not established.
