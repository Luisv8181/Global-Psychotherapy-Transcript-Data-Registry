source_context: >-
  A commercial library of psychotherapy and counseling training videos, founded in 1995, streamed to
  individuals and to universities, clinics and training institutes. The publisher describes both
  sessions between expert clinicians and real clients and demonstrations. Many titles include a
  training manual with a complete transcript. Recorded here at collection level only; individual
  titles are not catalogued.
