dataset_type: hybrid
dialogue_structure: single_turn_qa
domain: mental_health_counseling
source_context: >-
  Bilingual patient-therapist exchange pairs in English and Persian. Per the
  dataset card, English exchanges were collected from public sources and then
  translated into Persian with Meta's SeamlessM4T model and refined in three
  GPT-4o passes (tone, fluency, consistency). The released file pairs each
  English patient turn and therapist turn with its Persian translation, so
  the Persian side is model-transformed text, not originally Persian
  conversation. The card names three upstream sources (Amod's
  mental_health_counseling_conversations on Hugging Face and two Kaggle
  mental-health conversation sets) plus additional manually curated sources,
  but does not state whether the original English exchanges were real
  sessions, role-plays, or otherwise produced, so the upstream provenance
  stays unknown.
