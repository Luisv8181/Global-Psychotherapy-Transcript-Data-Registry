notes: >-
  7,179 data rows counted from SAT_dataset.csv on 2026-11-02, matching the
  card's reported 7,179 samples. File columns are an index plus Patient,
  Therapist, Translated Patient, and Translated Therapist: each row is one
  patient turn with one therapist turn, so the released unit is a single
  exchange, not a multi-turn dialogue, despite the dataset name. Card
  last modified 2026-06-12 per the Hugging Face API; publication_year 2025
  reflects that posting, and no paper is published yet (the card's citation
  block reads "To be updated once the paper is published" and its arXiv and
  GitHub badges carry no links). The card's Filtering step description is
  truncated mid-sentence in the published card, so the filtering criteria are
  unknown. No paper, code repository, or author-published evaluation
  accompanies the release. First Persian-language record in the registry;
  the Persian text is machine translation plus LLM refinement and must not
  be cited as native Persian counseling conversation.
