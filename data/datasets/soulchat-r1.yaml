notes: >-
  The official project repository describes SoulChat-R1 as a synthesized dataset
  and states that the released data were constructed with CATCH. The CATCH
  workflow uses authentic client self-reports as source material but generates
  new counseling dialogues through stage-controlled LLM synthesis. The README
  says the dataset contains structured multi-turn counseling dialogue plus
  explicit MDP CoT annotations, and points to ModelScope for download. The
  repository is Apache-2.0; separate dataset redistribution conditions should
  be treated independently from the code license. The registry therefore
  classifies the dialogue corpus as synthetic while preserving the human-source
  lineage in notes.
