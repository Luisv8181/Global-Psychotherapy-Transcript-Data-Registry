status: verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: mental_health_counseling
source_context: >-
  Multi-turn psychological counseling dialogues synthesized with the CATCH
  framework and Progressive Dialogue Synthesis. The method uses authentic client
  self-reports as inputs, extracts stage-specific therapeutic elements, and
  incrementally generates counseling dialogue across Goal Identification,
  Working, and Ending stages. The released corpus also includes
  memory-driven dynamic planning chain-of-thought annotations for counselor
  responses.
