notes: >-
  The Mendeley Data record, published 2026-08-07, reports 4,008 AI-synthesized multi-turn conversations
  and 79,616 dialogue turns. It explicitly says no conversations were collected from real individuals.
  This is an adjacent emotional-support resource rather than evidence of psychotherapy sessions with
  clinicians. Because the Mendeley description and licence section disagree on the Creative Commons
  variant, the registry preserves the conflict and does not treat redistribution as unconditionally allowed.
