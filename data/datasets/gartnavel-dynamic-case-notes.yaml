notes: >-
  The Wellcome archival description states that some Gartnavel case files contain staff meeting
  or case conference notes in which a patient was questioned by psychiatrists and the whole meeting,
  including questions, answers and diagnostic discussion, was transcribed and typed. Hazel Morrison's
  historical study identifies Henderson's 1921-1932 "dynamic" approach and describes staff meetings
  where a stenographer recorded the conversation. This is real clinical interaction, but the archive
  is a broader case-note collection rather than a purpose-built psychotherapy transcript dataset.
