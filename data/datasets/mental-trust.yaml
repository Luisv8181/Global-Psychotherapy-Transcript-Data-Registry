notes: >-
  Authors Aseem Srivastava (IIIT Delhi), Zuhair Hasan Shaik (IIIT Dharwad), Tanmoy Chakraborty
  (IIT Delhi), Md Shad Akhtar (IIIT Delhi); arXiv 2501.03064 v1, 6 January 2025. Annotation was
  iterative, three expert linguists plus domain experts, final Cohen's kappa 0.77 after three
  rounds (0.22, then 0.43, then 0.77). COUNT DISAGREEMENT, recorded not resolved: the abstract
  and section 3 claim 212 dialogues and 12.9K utterances, but section 4 and Table 2 total 167
  sessions (116 train, 17 test, 34 validation) and 10,172 utterances (6,902 plus 949 plus 2,321),
  so the sessions field is left null rather than picking one figure. dataset_type stays unknown
  to match HOPE; the paper's conclusion phrase about real counseling dialogues is not treated
  as provenance evidence, since the HOPE record itself is unknown and many HOPE source videos
  are titled as role-plays. Limitations stated in the paper: English only, text only, and no
  proposed trust-modelling method. A secondary author page reports acceptance for oral
  presentation at WWW 2025; no proceedings record was confirmed this run, so that venue claim
  stays unconfirmed. Discovery route: a Spanish-language web search for counseling dialogue
  corpora surfaced this English HOPE derivative; the same search also returned only
  already-recorded HOPE and MentalChat16K plus out-of-scope items.
