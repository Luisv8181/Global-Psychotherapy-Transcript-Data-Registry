id: mental-trust
title: "MENTAL-TRUST: Trust Modeling in Counseling Conversations"
canonical_url: https://arxiv.org/abs/2501.03064
status: partially-verified
dataset_type: unknown
dialogue_structure: multi_turn
domain: counseling
source_context: >-
  A trust-annotation layer over the HOPE counseling conversations, not newly collected dialogue.
  Every patient utterance in the HOPE subset is labelled with one of seven expert-verified ordinal
  trust levels, four major levels (least trust, low trust, building trust, achieved trust) plus
  intermediate levels (1.5, 2.5, 3.5), with conversations initialized at 2.5, and topic shifts are
  also annotated. The paper benchmarks trust modelling on the annotations as TRUST-BENCH. The
  dialogue text itself is HOPE's, so provenance follows the HOPE record.
