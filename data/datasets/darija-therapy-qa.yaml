notes: >-
  Counted from darija_therapy.jsonl this run - 6,181 rows, every row carrying
  exactly the keys Context and Response, context lengths 16 to 2,414 characters,
  median 130. One row has an empty Response and is counted in the total. The
  card states no row count; its size category 1K to 10K is consistent with the
  counted total. The card citation names six authors and year 2025 but cites
  the sibling dataset URL yibba/moroccan-darija-therapy-conversations, not this
  dataset, so authorship is recorded here only as the card citation, not as an
  independently confirmed fact. Two sibling datasets from the same uploader
  appear to belong to the same project in other forms - yibba/chat-darija-therapy
  and yibba/moroccan-darija-therapy-conversations, both gated auto and therefore
  not opened and not counted this run - and the relationship between this
  single-turn file and those multi-turn files is unconfirmed. No paper,
  generation model, prompt set or validation study was found for this dataset
  in web search, which returned only Hugging Face pages. A Moroccan Darija
  counseling resource is rare in the registry; the missing generation method
  and the unconfirmed sibling relationship are the main caveats. Card
  lastModified 2026-07-12, 18 downloads, 3 likes at time of check.
