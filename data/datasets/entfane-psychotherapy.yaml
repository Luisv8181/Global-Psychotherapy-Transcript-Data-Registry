notes: >-
  Counted from data/train-00000-of-00001.parquet on 2026-11-10. 1,260 conversations,
  one per row, each exactly 4 turns (client and therapist alternating) covering the
  four stages introduction, exploratory questions, advice and farewell. 21 conditions
  are represented, from anxiety and depression to self-harm and suicidal ideation.
  The card size_categories tag says n<1K, which contradicts the 1,260 rows counted
  from the data file; the counted figure is recorded here. No paper, code repository
  or evaluation is linked from the card, and no license is declared, so redistribution
  terms are unstated. The card carries a disclaimer that the content is synthetic,
  intended for research, education and development only, and not a substitute for
  professional mental-health guidance.
