id: entfane-psychotherapy
title: "Psychotherapy"
canonical_url: https://huggingface.co/datasets/entfane/psychotherapy
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Fully synthetic psychotherapy conversations generated by Google Gemini 2.0 Flash, as stated on
  the dataset card. Each conversation pairs a client experiencing a mental health issue with a
  therapist response, structured in four stages named Introduction, Exploratory Questions, Advice
  and Farewell. The card lists 21 covered issues, including anxiety, depression,
  obsessive-compulsive disorder, post-traumatic stress disorder, bipolar disorder, schizophrenia,
  borderline and narcissistic personality disorders, eating disorder, attention-deficit
  hyperactivity disorder, autism spectrum disorder, addiction or substance use disorder, sleep
  disorder, social anxiety disorder, phobias, self-harm, suicidal ideation, impulse control
  disorder, grief and loss, relationship issue and attachment issue. No human session stands
  behind any dialogue, and the card states the dataset does not contain real psychotherapy
  session data.
