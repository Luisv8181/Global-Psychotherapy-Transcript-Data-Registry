notes: >-
  Row count 1,260 comes from the Hugging Face API dataset_info train split for this dataset,
  read 2026-11-03, and matches the card size category of 1K to 10K rows. The card was created
  2024-09-03 and last modified the same day, with 75 downloads recorded at read time, so the
  release has not been updated since publication. No paper, code repository or author page is
  linked from the card, and no quality, safety or clinical validation of the generated
  conversations is claimed on the card beyond its own disclaimer that the content is not a
  substitute for professional guidance. The companion dataset entfane/psychotherapy_prompts
  holds prompts only, not dialogues, and was screened out of this record.
