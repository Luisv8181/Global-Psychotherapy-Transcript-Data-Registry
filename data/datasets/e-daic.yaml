notes: >-
  Secondary sources (user papers, unconfirmed from a primary source) report 163/56/56
  train/dev/test splits, time-stamped transcripts with speaker labels, audio recordings,
  OpenFace-derived visual features and COVAREP/FORMANT acoustic features, PHQ-8 depression
  scores and PTSD severity scores, and sessions of about 20 minutes; one secondary source
  says the test set is drawn only from autonomous-AI interviews. The portal says detailed
  documentation for this dataset is still being created, and the interview language was
  not stated in the primary sources read. The prior daic-woz record notes that the
  Extended DAIC is a separate, larger release not recorded there; this record fills that gap.
last_verified: 2026-10-11
