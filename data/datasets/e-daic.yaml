id: e-daic
title: "E-DAIC: Extended Distress Analysis Interview Corpus"
canonical_url: https://www.ihp-lab.org/downloads/Extended-DAIC-BLANK_EULA.pdf
status: partially-verified
dataset_type: real
dialogue_structure: multi_turn
domain: clinical_interview
source_context: >-
  Semi-clinical interviews conducted by Ellie, an animated virtual interviewer, either
  controlled by a human in another room (Wizard-of-Oz) or acting in a fully autonomous way
  with automated perception and behaviour generation modules. Developed by the USC Institute
  for Creative Technologies as the extended version of DAIC-WOZ for depression and PTSD
  assessment, and used as the corpus for the AVEC 2019 Detecting Depression with AI
  sub-challenge. These are screening interviews, not therapy sessions.
