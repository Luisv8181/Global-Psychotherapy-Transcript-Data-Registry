access:
  level: research-agreement
  requirements: >-
    Apply through the DAIC-WOZ / Extended DAIC portal (https://dcapswoz.ict.usc.edu/)
    and return a signed copy of the
    Extended DAIC End User License Agreement before downloading. Research use only;
    commercial use is forbidden.
redistribution: prohibited
license:
  type: research_access_agreement
  verified: true
  source: https://www.ihp-lab.org/downloads/Extended-DAIC-BLANK_EULA.pdf
  notes: >-
    The Extended DAIC EULA (read 2026-10-11) grants research use only, forbids commercial
    use and distribution of the database or parts of it to any third party, allows
    illustrative use in publications with subjects' identities protected, and requires
    citing Gratch et al. (LREC 2014) and Ringeval et al. (AVEC 2019). The ICT Institute
    may change the terms and require a new signature.
