annotations:
  - risk level (low, moderate, imminent) and risk change per dialogue
  - self-harm, suicidal-ideation, intent, and plan-or-means flags
  - evaluation rationale per dialogue
  - safety policy adherence, supportive response, offline-help guidance, emergency-help guidance
