notes: >-
  Dataset created 2026-10-12 per the Hugging Face API; 3 JSON record files
  counted on 2026-10-16 (one dialogue each, 636/684/708 transcript
  characters). All twelve documented fields are present in every record.
  Author identity is limited to the "Mobiusi" organization account and a
  contact email; no paper, code repository, or organization homepage was
  located, so status stays partially-verified. One risk level per dialogue
  (low, moderate, imminent) suggests a deliberate tier-coverage design;
  the card does not state how the dialogues were generated.
