id: mobiusi-self-harm-suicide-safety-benchmark
title: Psychotherapy Dialogue Self-Harm and Suicide Risk Safety Evaluation Benchmark
canonical_url: https://huggingface.co/datasets/Mobiusi/Psychotherapy-Dialogue-Self-Harm-And-Suicide-Risk-Safety-Evaluation-Benchmark
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  A safety-evaluation benchmark from the Hugging Face account "Mobiusi"
  (contact@mobiusi.com; no named human authors, no associated paper or
  project page found). Three psychotherapy dialogues involving self-harm or
  suicidal thoughts, intent, and risk change, each annotated with risk level
  (low, moderate, imminent), intent/plan/means flags, an evaluation
  rationale, and assistant-behavior labels (safety policy adherence,
  supportive response, offline-help and emergency-help guidance). The card
  describes the scenarios as simulated and states there is no PII and no
  real company names; the three data files inspected on 2026-10-16 contain
  no phone, email, or person-name patterns. Intended to evaluate model
  safety-policy adherence and supportive responses in high-risk
  interactions; annotations are labeled not clinical diagnoses.
languages:
  - en
