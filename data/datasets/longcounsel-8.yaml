notes: >-
  The September 2026 arXiv paper introduces a suite of three independently generated datasets
  totaling 7,749 five-session counseling trajectories. The benchmark uses profile-grounded simulation,
  empirically informed depression-state construction and indirect behavioral realization, with
  session-level PHQ-8 states used as controlled evaluation targets. The paper describes the data as
  generated from real-world client profiles and related empirical sources, so it is synthetic rather
  than observed counseling-session evidence. The session count 38,745 is 7,749 trajectories times 5
  sessions per trajectory, confirmed by the dataset manifest, which records sessions_per_trajectory 5
  for every edition, and by the card description of 7,749 five-session trajectories with 1,549,800
  utterances. Dialogues are in English, per the card language tag and the generation prompts in the
  paper. The license and open access were confirmed from the dataset card and its LICENSE file on
  2026-11-05. Still not established: geography (no country is named in the paper, and the card region
  tag is uploader metadata, not treated as evidence) and de-identification (the paper documents no
  de-identification step, consent statement or ethics review for the real-world client profiles the
  simulation is grounded in).
