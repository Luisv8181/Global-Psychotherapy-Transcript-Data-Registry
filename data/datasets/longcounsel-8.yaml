notes: >-
  The arXiv paper v2 (revised 4 Nov 2026) introduces three independently generated editions totaling 7,749 five-session trajectories from 369 client profiles. LC8-Qwen (Qwen3.5-35B-A3B) holds 3,690 trajectories, LC8-Luna (GPT-5.6 Luna) 3,690, and LC8-GPT-5.4-mini 369. Each session is a 20-exchange counselor-client dialogue generated to express a preset PHQ-8 state, with a controlled PHQ-8 label and a simulated self-report per session. Session count 38,745 is 7,749 trajectories times 5 sessions, cross-checked against the released total of 1,549,800 utterances (7,749 times 200 utterances per trajectory) and the manifest.json session counts. The dataset README states English is the only released language. The paper reports self-report bias at higher severity (controlled PHQ-8 totals of at least 15), notes the components of a synthetic trajectory come from different individuals, and omits PHQ-9 item 9, so the benchmark must not be read as assessing self-harm risk. Access discrepancy recorded. The dataset README download section says to request access and await approval, but the Hugging Face API reports gated false and unauthenticated fetches of manifest.json, LICENSE and a data archive redirect succeeded on 2026-11-15, so access is recorded open on the direct-download evidence. Geography is left unknown. The Hugging Face region tag reads US and NHANES is US data, but the PsychEval case-report origin is not stated in the paper and the simulated clients have no single geography.
