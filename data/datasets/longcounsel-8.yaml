notes: >-
  The arXiv paper (v2, revised 2026-11-04, Li, He and Wu) introduces three
  independently generated editions totaling 7,749 five-session trajectories
  and 1,549,800 utterances. Qwen3.5-35B-A3B generated 3,690 trajectories,
  GPT-5.6 Luna 3,690, and GPT-5.4-mini 369. Each trajectory has five sessions
  of 20 counselor-client exchanges, so the suite holds 38,745 sessions; the
  count is derived from the released manifest.json, which states 5 sessions
  per trajectory for every edition, and the GPT-5.4-mini archive was counted
  directly on 2026-11-19 at 369 transcript files with a matching SHA-256.
  The Hugging Face card states English is the only released language. Client
  profiles derive from published counseling case reports in PsychEval,
  depression scores from public research data without personal identifiers,
  and dialogue form from RealCBT; no real counseling conversation is
  released. The paper states the authors ran no automated audit for offensive
  content or personal identifiers. Geography stays unestablished. The Hugging
  Face card carries a region-us tag but neither the paper nor the card states
  a geography for the released data. Access is open in practice. The card
  text says to request access and await approval, but manifest.json, a split
  file and the archive URLs all downloaded without authentication on
  2026-11-19.
last_verified: 2026-11-19
