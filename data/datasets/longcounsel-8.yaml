notes: >-
  The September 2026 arXiv paper (Jiayi Li, Zhaomin Wu, Bingsheng He) introduces a
  suite of three independently generated datasets totaling 7,749 five-session
  counseling trajectories with 1,549,800 utterances. Released editions are
  longcounsel-8-qwen-3.5-35b-a3b (3,690 trajectories, 738,000 utterances,
  train/val/test 2,583/369/738), longcounsel-8-gpt-5.6-luna-low (3,690 trajectories,
  738,000 utterances, same splits) and longcounsel-8-gpt-5.4-mini-low (369
  trajectories, 73,800 utterances, 258/37/74). Each trajectory holds transcript.jsonl
  (200 rows, five sessions by twenty exchanges by two speakers), ground_truth.json
  (session-level latent PHQ-8 vectors and severity bands) and self_report.json
  (simulated post-session questionnaires). The benchmark uses profile-grounded
  simulation, empirically informed depression-state construction and indirect
  behavioral realization, with session-level PHQ-8 states as controlled evaluation
  targets. The paper describes the data as generated from real-world client profiles
  and related empirical sources, so it is synthetic rather than observed
  counseling-session evidence.
