id: mental-health-crisis-benchmark
title: "Mental Health Crisis Benchmark and Response Evaluation Datasets"
canonical_url: https://ellisalicante.org/datasets/mental-health-crisis-llms/
status: partially-verified
dataset_type: unknown
dialogue_structure: utterance_level
domain: crisis_support
source_context: >-
  An evaluation benchmark, not a corpus of therapy sessions, introduced in
  "Between Help and Harm: An Evaluation of Mental Health Crisis Handling by
  LLMs" (Arnaiz-Rodriguez et al., JMIR Mental Health 2026). 2,252 user-side
  inputs curated from about 239,000 inputs merged from 12 publicly available
  mental-health datasets, each labeled with one of six crisis categories or
  no_crisis. A companion dataset holds model-generated responses to the same
  examples with human appropriateness scores and LLM evaluator judgments.
  The benchmark is for crisis-category classification and for auditing LLM
  responses to crisis disclosures. The authors state it is not clinical
  guidance, direct therapeutic advice, or a standalone triage system.
