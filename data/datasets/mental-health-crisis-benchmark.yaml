notes: >-
  Counted from the benchmark examples parquet files on 2026-11-04. Validation
  206 rows and test 2,046 rows, matching the published figures and the card
  row-count section. Turn counts counted from the same files. Validation
  examples carry 1 to 39 turns (median 2, 79 single-turn). Test examples carry
  1 to 40 turns (median 3, 599 single-turn). The turns are sentence-split
  segments of a single user input, per the project loader code, which splits
  user text at sentence boundaries and caps segments at 40. No counselor or
  assistant turns ship in the benchmark, so dialogue_structure is
  utterance_level, not a speaker exchange. Test split source counts are even
  at 168 per source loader except suicidal_finetune at 30. Validation source
  counts are uneven (12 per loader plus a smaller second set of legacy source
  ids), recorded here as counted, not reconciled. dataset_type stays unknown
  because provenance is mixed. Some sources are human-authored public posts
  and counseling texts, while others are synthetic (self-harm-synthetic-eval,
  nart-100k-synthetic, and the partly synthetic MentalChat16K), so no single
  provenance type covers the benchmark. The 12 distinct source datasets, per
  the project loader code, are sajjadhadi Mental-Disorder-Detection-Data,
  marmikpandya mental-health (loaded twice), fadodr mental_health_dataset,
  fadodr mental_health_therapy, psycode1 psyset, Amod
  mental_health_counseling_conversations, cypsiSAS transformed_Suicidal_ideation,
  fanyin3639 test_test_self_harm_all_levels, arianaazarbal
  self-harm-synthetic-eval, richie-ghost suicidal_finetune, ShenLab
  MentalChat16K, and jerryjalapeno nart-100k-synthetic. Test labels come from
  gpt-4o-mini as judge (three runs, majority vote) after it showed the
  highest agreement with four domain experts on the validation set. The
  response dataset covers five audited models on the test examples. No
  dialogue text is reproduced in this record.
