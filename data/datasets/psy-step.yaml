notes: >-
  Counts are the paper's published figures (6,425 dialogues and 231,172 turns after
  filtering, section 3.3 and Table 1; average 18.0 turns per dialogue), not
  independently re-counted. Table 1 also confirms English language and synthetic
  problem source (PatternReframe, described as crowdsourced personas). The 130-dialogue
  expert review was a dataset quality check, reported separately from the Stepper
  agent evaluations. Status stays partially-verified because identity, provenance
  and design are confirmed from the primary paper, but no access route or dataset
  license is established.
