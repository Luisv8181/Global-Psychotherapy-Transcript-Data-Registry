notes: >-
  Paper (arXiv 2604.04448v1, 6 Apr 2026) reports 6,425 dialogues and 231,172 turns, average
  18.0 turns, after CBT-fidelity filtering retained 67.71% of generated dialogues (CTRS items
  scored by GPT-4o; dialogues with any item at 4 or below on a 6-point scale discarded). Three
  mental-health professionals expert-reviewed 130 sampled dialogues. Counts counted from the
  released files on 2026-11-08: profile_data.json holds 6,425 client profiles (train 5,797,
  valid 304, test 324), matching the paper's dialogue count exactly; dialogue_data.json holds
  117,384 turn-level training instances (train 105,894, valid 5,562, test 5,928), one record per
  counselor turn with instruction, dialogue history, reasoning, progress and utterance. The
  released turn-level count does not equal the paper's 231,172 total turns and is not half of it
  either (115,586), so the file's turn records and the paper's turn count are recorded as
  counted and reported rather than reconciled. Splits in the files are named train/valid/test;
  the paper and README describe them as training, validation and test. The paper title in the
  code repository README differs slightly ("From Surface Problems to Underlying Beliefs...");
  the arXiv title is used here. Recorded as synthetic following the CALM-IT precedent:
  dialogues are fully model-generated, grounded on crowdsourced PatternReframe prompts rather
  than on real sessions.
