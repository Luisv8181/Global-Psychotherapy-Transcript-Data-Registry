id: psy-step
title: "Psy-Step: Structured Thought Elicitation with Planning"
canonical_url: https://arxiv.org/abs/2604.04448
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychotherapy
source_context: >-
  Synthetic CBT counseling dialogues generated with GPT-4o-mini from client profiles
  built on the PatternReframe dataset (crowdsourced personas with annotator-assigned
  negative thoughts). Each persona's negative thought is decomposed into a surface-level
  problem and an automatic thought; dialogues run in two stages, diagnostic and
  intervention, each driven by a therapeutic plan with an ordered action sequence.
  Filtered for CBT fidelity using the Cognitive Therapy Rating Scale (dialogues with
  any CTRS item at 4 or below on a 6-point scale were discarded; 67.71% retained).
  130 sampled dialogues were reviewed by three mental health professionals. Authors:
  Jihyun Lee et al., POSTECH. The corpus is also the training data for the paper's
  Stepper counseling agent, built on Llama-3.1-8B-Instruct.
