notes: >-
  The official repository reports 10,000 conversations, 100,000 total responses,
  23 clinically relevant categories, and nine LLMs used for response generation.
  The benchmark is classified hybrid because it combines real dialogue contexts
  with newly generated model responses. Its underlying evidence is not fully
  independent of the source resources: MentalChat16K, EmoCare/Psych8k and
  CounselChat are reused as source material. MentalAlign-70k is a related
  evaluation resource in the same repository and is not treated as a separate
  dialogue corpus here. Dataset-specific license terms remain unknown.
