dataset_type: hybrid
dialogue_structure: single_turn_qa
domain: mental_health_counseling
source_context: >-
  Benchmark built from 10,000 one-turn conversations drawn from three real
  mental-health dialogue resources, with each context paired with one human
  response and nine LLM-generated responses. The official repository identifies
  the source resources as MentalChat16K, EmoCare/Psych8k, and CounselChat.
