id: desc-diagesc
title: "DESC: Diagnostic Emotional Support Conversation dataset"
canonical_url: https://github.com/seungyeon-seo/DiagESC
status: partially-verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: emotional_support
source_context: >-
  DESC was synthesized for the Diagnostic Emotional Support Conversation (DiagESC) task (Seo and Lee,
  POSTECH). Dialogue histories and persona sentences come from PESConv, the persona-augmented form of
  the ESC emotional-support corpus, truncated to the point where at least two persona sentences have been
  gathered; GPT-4 then generates diagnostic turns that ask about the nine PHQ-9 depression symptoms, with
  seeker answers paraphrased and augmented from PHQ-9 response templates, and a closing turn that reports
  the summed severity band. Because existing human-written dialogue history is retained and extended with
  model-generated diagnostic turns, the corpus is hybrid rather than fully synthetic.
