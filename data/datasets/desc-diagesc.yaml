notes: >-
  Counts counted from the release files on 2026-11-03 (train.json 730, valid.json 126, test.json 120,
  total 976), matching paper section 6.1 exactly; average 42 turns per dialogue, range 24 to 111
  (paper). PHQ-9 severity bands: Minimal 0-4, Mild 5-9, Moderate 10-14, Moderately severe 15-19,
  Severe 20-27; the Severe band holds more samples because it covers a wider score range. Validation
  and test seeker utterances were expert-filtered: three psychologists with over four years of
  professional experience re-labeled each symptom, with the mode value kept. Generation used GPT-4 with
  keyword filtering on supporter turns and a RoBERTa classifier filter (threshold 0.7, trained on 256
  manually verified utterances) on seeker turns. Reported diagnostic agreement against expert
  annotation: mean QWK 0.70 across symptoms. Limits: no license, so redistribution is unknown; the
  README is a single line and documents no terms, splits beyond the file names, or intended use; the
  paper's severity labels are assigned by construction (pre-assigned PHQ-9 labels), not observed
  diagnoses, so the corpus supports dialogue and diagnosis-generation research, not clinical claims.
