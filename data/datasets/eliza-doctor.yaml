  notes: >-
    The MIT DSpace item holding the 1965 printout states "Licensed under an
    MIT software license" and ships a LICENSE.txt containing the MIT License
    text (Copyright 1965 MIT), read 2026-11-18. This conflicts with the
    ELIZAGEN release page, where Jeff Shrager states (May 23, 2021) the
    Weizenbaum estate granted permission to open-source the code under a
    Creative Commons CC0 public domain license. The record follows the
    license at the data location per AGENTS.md section 4. The 1966 paper,
    including its example conversation, remains under ACM terms; ACM's April
    2022 backfile announcement states 1951-2000 publications are freely
    available to view and download, which supports reading access but does
    not by itself grant redistribution. ELIZAGEN's page still states the
    paper is "inaccessible, except to members or for purchase", which the
    backfile announcement contradicts for reading access.
