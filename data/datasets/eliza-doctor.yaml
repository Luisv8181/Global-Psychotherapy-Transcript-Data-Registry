notes: ELIZA is included as a historical predecessor to modern computational therapy and synthetic dialogue corpora, not as a modern psychotherapy dataset. Primary evidence documents the 1966 publication, while recovered MIT archive material supports earlier 1965 versions. The registry should preserve version-specific evidence rather than treating ELIZA as a single immutable artifact.
