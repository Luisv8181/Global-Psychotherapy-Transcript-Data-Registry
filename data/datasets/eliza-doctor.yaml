notes: >-
  ELIZA is included as a historical predecessor to modern computational
  therapy and synthetic dialogue corpora, not as a modern psychotherapy
  dataset. Primary evidence documents the 1966 publication, while recovered
  MIT archive material supports earlier 1965 versions. The registry should
  preserve version-specific evidence rather than treating ELIZA as a single
  immutable artifact. Re-verified 2026-11-18: the original 1965 code was
  restored to operation in December 2024 on a reconstructed CTSS running on
  an emulated IBM 7094 (Lane et al., arXiv 2501.06707, published 2025-01-12;
  later cited as IEEE Annals of the History of Computing 47(1), 8-23, 2025).
  The restoration repository (github.com/rupertl/eliza-ctss) carries no
  LICENSE file. The ACM Digital Library article page for the 1966 paper
  could not be opened on 2026-11-18 (Cloudflare verification would not
  clear); the free-reading claim rests on ACM's 2022 backfile announcement,
  re-read this run.
last_verified: 2026-11-18
