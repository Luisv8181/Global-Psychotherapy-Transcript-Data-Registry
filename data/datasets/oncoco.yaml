id: oncoco
title: "OnCoCo 1.0"
canonical_url: https://github.com/th-nuernberg/oncoco_v1_dataset
status: verified
dataset_type: synthetic
dialogue_structure: utterance_level
domain: psychosocial_counseling
source_context: >-
  Synthetic German counseling messages created by professional counselors and students in social work
  and computer science, with an English translation produced by GPT-4o and manually verified by human reviewers.
  The dataset is designed for fine-grained classification of psychosocial counseling messages rather than
  for modeling naturally occurring client sessions.
geography:
  countries:
    - Germany
languages:
  - de
  - en
language_context: German originals; English translations generated with GPT-4o and manually verified
sessions: null
longitudinal: false
transcript:
  available: true
  format:
    - csv
    - jsonl
audio:
  available: false
video:
  available: false
annotations:
  - speaker_role
  - hierarchical_counselor_message_categories
  - hierarchical_client_message_categories
  - impact_factors
  - motivation
  - problem_analysis
  - resource_activation
  - human_review
access:
  level: open
  requirements: Public repository access
redistribution: conditional
license:
  type: CC-BY-SA-4.0
  verified: true
  source: https://github.com/th-nuernberg/oncoco_v1_dataset
  notes: Dataset repository README identifies the data as CC BY-SA 4.0 and requires attribution and ShareAlike for derivative datasets and models.
privacy:
  deidentified: true
  contextual_reidentification_assessed: false
  notes: >-
    The dataset repository states that no real client data were used and that texts are simulated and anonymized by design.
    No independent contextual re-identification assessment was documented in the checked source.
ethics:
  consent_documented: unknown
  ethics_review_documented: true
  data_use_agreement: false
evidence:
  primary_sources:
    - https://github.com/th-nuernberg/oncoco_v1_dataset
    - https://arxiv.org/abs/2512.09804
  supporting_publications: []
publication_year: 2025
release_year: 2025
historical_significance:
  - bilingual German-English synthetic counseling-message resource with fine-grained psychosocial coding
notes: >-
  The repository README reports 2,778 original German messages and 5,556 samples after English translation.
  Each record corresponds to one message rather than a full session record, so dialogue_structure is recorded as
  utterance_level and sessions remains unknown. The README says the synthetic dialogues were generated from
  professional counseling principles and validated for authenticity, with annotation by 6 professional counselors
  and 5 trained students and reported Cohen's kappa of 0.88. The English translations were generated by GPT-4o
  and manually verified by human reviewers. The repository's CC BY-SA 4.0 license is the dataset license.
last_verified: 2026-09-30
