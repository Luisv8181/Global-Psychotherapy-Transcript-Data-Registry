id: dataset-therapist
title: "Kicaulah AI - Dataset Curhat & Therapist (Empathetic Counseling)"
canonical_url: https://huggingface.co/datasets/Kicaulah/dataset-therapist
status: partially-verified
dataset_type: unknown
dialogue_structure: single_turn_qa
domain: mental_health_support

source_context: >-
  English single-turn instruction/response pairs framed as empathetic counseling
  and emotional support, in 10 categories (workplace burnout, quarter-life
  crisis, breakup, family expectations, imposter syndrome, social anxiety and
  loneliness, toxic relationships and boundaries, bereavement and grief,
  academic and dissertation stress, radical self-acceptance and compassion).
  The card describes the responses as natural and human and claims an
  "Anti-AI-Speak Standard", but it names no production method: no authoring
  process, no model, and no source for the prompts. The rows shown in the
  dataset viewer are visibly templated, with repeated prompt frames and
  identical response openers across prompts, which is consistent with template
  or model generation but is not evidence of either, so provenance stays
  unknown. This is emotional-support Q&A, not psychotherapy sessions; the
  card's own use cases call the target "peer counselors and emotional sounding
  boards".

