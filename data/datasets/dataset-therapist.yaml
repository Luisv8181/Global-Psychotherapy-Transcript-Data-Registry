redistribution: conditional

license:
  type: apache-2.0
  verified: true
  source: https://huggingface.co/datasets/Kicaulah/dataset-therapist
  notes: >-
    The dataset card carries the license:apache-2.0 metadata tag, confirmed
    through the Hugging Face API on 2026-11-06. There is no LICENSE file in
    the repository (tree lists only .gitattributes, README.md and data/), and
    the README names no license. The declaration is the uploader's own, and no
    production method for the text is stated, so the basis for licensing the
    content is unclear. Redistribution is therefore recorded as conditional
    despite the permissive declared license.

privacy:
  deidentified: unknown
  contextual_reidentification_assessed: unknown
  notes: >-
    No de-identification, consent, or ethics statement was found on the card or
    in the repository. The prompts present as generic constructed scenarios
    rather than real help-seekers' posts, but that is an observation from the
    viewer sample, not a documented fact, and whether any row derives from a
    real person is not stated.

