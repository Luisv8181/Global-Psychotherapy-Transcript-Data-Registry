  supporting_publications: []

notes: >-
  Counted via the Hugging Face datasets-server info endpoint on 2026-11-06:
  1,100 rows in total (train 880, validation 110, test 110), matching the
  card's own statistics, with instruction, response and category columns. The
  card's citation dates the set to 2025 (Kicaulah AI Team); the dataset was
  last modified 2026-09-30. The card's "Dataset Structure" example row does not
  match the actual data: its example category "therapist" is not one of the 10
  category values, and its example instruction about a child's fever matches no
  observed row. The open question for researchers is provenance: the card
  claims human-sounding language but documents no author, model, or source, so
  dataset_type stays unknown until a production method is established.

