notes: >-
  Counted from kmi.json on 2026-11-15. The file holds 1,000 dialogues and 18,116 utterances,
  18.12 turns per dialogue on average with a range of 15 to 31, matching the paper Table 2
  average of 18.12. Categories counted from the same file are Mental Health 200,
  Interpersonal Relationships 200, Ego·Personality 200, Career·Employment 200,
  Academic·Examination 100, Addiction·Obsession 50 and Family 50. Every therapist utterance
  carries one of eight MI labels, and experts judged the labels 96.0 percent accurate on a
  210-utterance sample. Complex Reflection is the most frequent therapist label at 36 percent,
  and the reflection-to-question ratio is 1.8 to 1. Context data came from public Mindcafe
  posts by anonymous users; the authors report no interaction with those users and say GPT-4
  filtered extreme or violent context content. Four professional counselors certified by the
  Korean Psychological Association evaluated the dataset. The paper cautions that chatbots
  trained on KMI need human supervision.
