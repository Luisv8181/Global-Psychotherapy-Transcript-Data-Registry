notes: >-
  Added as a historical dialogue resource rather than a modern dataset. The attached historical
  research identifies Dora as a 1905 published case containing patient-therapist dialogue. The
  registry should not treat the surviving published case as equivalent to a contemporaneous verbatim
  session recording. Correction on 2026-10-03. The record previously linked Project Gutenberg ebook
  37065, which is Totem und Tabu, a different work; Project Gutenberg's list of Freud's works has no
  edition of this case. The link now points to volume 5 of Freud's Gesammelte Werke (1942, works of
  1904-1905), digitized by the Internet Archive, whose text includes Bruchstück einer
  Hysterie-Analyse. The 1905 first printing in the Monatsschrift für Psychiatrie und Neurologie was
  not found in a reachable digital copy.
