notes: >-
  Corrected from hybrid to demonstration after re-reading the official repository and ACL 2025
  publication. The project describes KokoroChat as a Japanese counseling dialogue dataset collected
  through role-play, with trained counselors simulating counselor-client interactions. The paper
  likewise describes the interactions as role-playing rather than naturally occurring clinical
  sessions. The 6,589 dialogue count is the project-reported collection size. The repository license
  is CC BY-NC-ND 4.0, and redistribution remains conditional. Privacy contextual re-identification,
  consent and ethics-review evidence remain unknown.
