notes: >-
  Split counts from the author-endorsed HF dataset README, confirmed against
  the HF datasets API on 2026-10-14: test 600 dialogues / 8,975 turns / 713
  labels (clinician-annotated by two licensed psychologists, one PhD
  clinical postdoctoral resident, and one licensed clinical social worker,
  in independent rounds by two disjoint teams with adjudication);
  validation 420 dialogues / 6,679 turns / 549 labels (GPT-5 synthetic);
  train 3,058 dialogues / 48,557 turns / 3,902 labels (GPT-5 synthetic with
  structured label injection). Per the paper's Table 2: 226 dialogues
  (37.7%) contain at least one Alert label, 417 (69.5%) at least one Confirm
  label, and 160 (26.7%) contain neither; mean 1.18 labels per dialogue.
  Fields: dialogue_id, turn_id, text (prefixed User: or Listener:), labels
  (semicolon-separated or empty). Average ~15 turns per test dialogue. The
  paper also releases a fine-tuned Qwen3-32B crisis-detection model
  (SungJoo/cradle-dialogue-qwen3-32b-2epoch); model licensing not reviewed.
  HF dataset is open and ungated (220 downloads at read time; card last
  modified 2026-04-21, before the June 2026 arXiv v1). Companion resources
  not reviewed: the post-level CRADLE-Bench benchmark
  (SungJoo/CRADLE-Bench, EACL 2026) that supplied the seed posts.
