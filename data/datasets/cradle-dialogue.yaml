notes: >-
  Counted from the Hugging Face parquet files on 2026-11-04. Test 8,975 rows,
  validation 6,679 rows, and train 48,557 rows, matching the card split
  counts and the paper figures exactly. The files carry only turn_id, text,
  and labels columns. Dialogue counts were recovered from turn_id resets
  in file order and match the published figures, with test 600 dialogues,
  validation 420 dialogues, and train 3,058 dialogues, for 4,078 dialogues
  and 64,211 turns in total. The card README data-fields section names a
  dialogue_id field that is absent from the shipped files, so dialogue
  boundaries in the files rest on turn_id resets in file order, recorded
  here as an assumption, not a documented field. Test split statistics from
  the paper are 713 crisis labels, 226 dialogues with at least one Alert
  label, 417 with at least one Confirm label, and 160 with neither, with an
  average of 14.96 turns per test dialogue. Annotation agreement on
  crisis-labeled turns was Cohen kappa 0.51 to 0.75 across two disjoint
  annotator teams, with adjudication by a third annotator and senior-expert
  tie-break. The language is English in all paper examples and card text
  read, and no separate language statement was found. No dialogue text is
  reproduced in this record.
