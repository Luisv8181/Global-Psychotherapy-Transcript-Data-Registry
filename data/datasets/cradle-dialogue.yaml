id: cradle-dialogue
title: "CRADLE-Dialogue: Clinician-Annotated Turn-Level Crisis Detection Benchmark"
canonical_url: https://huggingface.co/datasets/SungJoo/Cradle-Dialogue
status: verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: crisis_support
source_context: >-
  A benchmark for turn-level crisis detection in multi-turn conversations,
  introduced in "Expert-Level Crisis Detection in Mental Health Conversations"
  (Byun et al., arXiv 2606.10380). Dialogues were generated with GPT-5 from
  real high-risk Reddit posts in CRADLE Bench, conditioned on an assigned
  crisis label and one of seven disclosure scenarios, with a controlled
  crisis reveal timing of early, mid, or late. The test split is annotated at
  the turn level by four mental health professionals. Each crisis event gets
  at most one Alert label for the earliest ambiguous signal and one Confirm
  label for the turn where a specific crisis type becomes explicitly
  identifiable, each with an ongoing or past temporal state. The train and
  validation splits are synthetic dialogues with labels injected during
  generation, not clinician-annotated. The paper states the dialogues are
  generated rather than drawn from naturally occurring counseling, hotline,
  or peer-support conversations, so no real client session stands behind any
  dialogue. The seven scenarios are talking to a close friend or family
  member, a therapy or counseling session, a private conversation with a
  teacher or professor, a doctor visit, reporting to an authority figure,
  an anonymous help post in a support forum, and casual online talk, so only
  a subset of dialogues are set in counseling sessions.
