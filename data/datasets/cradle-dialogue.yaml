id: cradle-dialogue
title: "CRADLE-Dialogue: Expert-Level Crisis Detection in Mental Health Conversations"
canonical_url: https://huggingface.co/datasets/SungJoo/Cradle-Dialogue
status: partially-verified
dataset_type: hybrid
dialogue_structure: multi_turn
domain: crisis_support
source_context: >-
  Turn-level mental-health crisis detection benchmark (Byun et al., Emory
  University; WMHS Workshop @ NeurIPS 2026). Dialogues are generated with
  GPT-5 from real Reddit posts that seed CRADLE-Bench (Byun et al., EACL
  2026), conditioned on seven clinical scenarios (including a
  therapy/counseling session with a licensed mental health professional, a
  conversation with a close friend or family member, and a doctor visit)
  with controlled crisis-reveal timing (early/mid/late). Speaker roles are
  User and Listener, not therapist and client, and the released artifact is
  an evaluation benchmark for turn-level crisis detection, not a therapy
  corpus; it is recorded as adjacent crisis-support material. The released
  HF dataset combines a 600-dialogue clinician-annotated test set with
  synthetic validation and training splits. The official release channel is
  the Emory NLP repository emorynlp/CradleBench, whose README endorses the
  SungJoo Hugging Face uploads.
languages:
  - unknown
sessions: 4078
longitudinal: false
annotations:
  - turn-level multi-label crisis annotations (alert_ongoing/alert_past; confirm_<type>_ongoing/past)
  - 7 crisis types: SI_passive, SI_active, SH, DV, CA, SHA, RA
  - inter-annotator agreement (Cohen's kappa 0.51-0.75 on crisis-labeled turns, two disjoint clinician teams)
