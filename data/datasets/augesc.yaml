notes: >-
  Counted from augesc.txt on 2026-09-26, 65,077 dialogues with 1,738,446 turns (26.7 per dialogue
  on average). Per the paper, the completing model starts from available dialogue posts, so each
  dialogue is seeded by real text and completed by the model; the source of the posts is described
  in the paper and not reviewed here. Published in Findings of ACL 2023.
