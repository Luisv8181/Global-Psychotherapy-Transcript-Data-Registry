source_context: >-
  Response-comparison resource built from mental-health question-and-answer
  prompts. The dataset card states that each example contains either a human
  answer from the original source or an LLM-generated answer, with empathy,
  appropriateness, and relevance ratings and explanations from LLM raters.
  Four rating/generation models are listed: Llama 3.2 1B, Llama 3.2 3B,
  Llama 3.1 8B, and Qwen 2.5 7B.
