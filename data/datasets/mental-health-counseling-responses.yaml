notes: >-
  The dataset card reports 26,140 rows and describes the response field as
  either a human response from the original source or a generated response.
  It also includes a boolean human/generated indicator, model identity, three
  0-5 LLM ratings, and a natural-language explanation. This is useful as a
  response-quality evaluation resource, but the displayed MIT metadata is not
  treated as sufficient to settle rights in reused upstream text. The upstream
  page reports a separate RAIL-D license and commercial-use conditions; rights
  compatibility between the two repositories has not been established.
