source_context: >-
  Vietnamese single-turn question-answer pairs about emotional distress and
  mental-health support, released as two Parquet shards on Hugging Face by the
  uploader chillies. The card carries no README prose, no paper, no stated
  source for the conversations, and no license. The two columns are question and
  answer. A content check of shard 0 on 2026-11-05 found the pairs read as
  dialogue turns rather than standalone questions, with about a third starting
  with conversational continuers, so the rows appear to have been cut from
  longer exchanges. The dataset's own name claims student counseling, but that
  characterization is not supported by the content checked, with only 1.9
  percent of shard-0 questions carrying student or school terms, and it is left
  unconfirmed here. Counseling or therapy terms appear in 9.1 percent of shard-0
  answers. Off-topic turns occur, including at least one about business
  planning, so the set is not a clean counseling corpus. Provenance is unknown,
  and the pairs may be human-written, scraped, translated, or model-generated;
  no evidence reviewed settles that.

