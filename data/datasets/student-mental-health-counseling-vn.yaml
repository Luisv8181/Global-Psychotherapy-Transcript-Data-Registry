notes: >-
  Counted from the dataset card's own dataset_info on 2026-11-05, with shard 0
  counted from the downloaded Parquet file the same day. The card reports
  750,169 rows in the train split across two shards; shard 0 holds 375,085 rows
  with question and answer columns, median question length 237 characters and
  median answer length 281 characters, no empty questions or answers in the
  shard. The Hugging Face datasets-server rows and size endpoints return 404 for
  this dataset, so counts come from the card metadata and the downloaded file,
  not the viewer. Content-check figures are from shard 0 only. Three English
  derivatives exist on Hugging Face and confirm the upstream identity but add no
  provenance, with arafatanam/Student-Mental-Health-Counseling-750K translating
  all 750,169 rows with Helsinki-NLP/opus-mt-vi-en, simxxran123/Student-Mental-
  Health-Counseling-50K translating the first 50,000 rows with Google
  Translator, and Tsovinar/student-mental-health-counseling-data republishing a
  100,000-row labeled variant. The derivatives are recorded here as lineage, not
  as independent corpora. Uploader chillies, first published 2024-05-05
  (lastModified). Dataset_type stays unknown until a source for the conversations
  is established, and the student label stays unconfirmed.

