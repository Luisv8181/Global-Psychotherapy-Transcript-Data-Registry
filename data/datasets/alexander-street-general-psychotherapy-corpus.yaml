notes: >-
  Imel et al. describe a general corpus of 1,398 psychotherapy and drug-therapy transcripts,
  approximately 2.0 million talk turns and 8.3 million word tokens, available by library
  subscription. A later study reports 2,354 session transcripts and 514,118 talk turns in the
  Alexander Street corpus. The count changed as the commercial collection expanded, so this record
  preserves both reported snapshots rather than treating them as contradictory. The collection
  includes sessions conducted across multiple approaches and may include more than one session for
  some patients. Published descriptions indicate real therapy sessions, but the registry does not
  infer exact collection dates for every transcript.
