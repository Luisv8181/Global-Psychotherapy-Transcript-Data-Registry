notes: >-
  The official Psy-Chronicle repository states that CPCD is synthetic and organizes each student
  trajectory around a student profile, temporal stress event graph, cross-session counseling
  dialogues and structured memory summaries. It reports 100 student profiles and 90,000 counseling
  dialogue units, covering a semester-level trajectory, and CPCD-Bench with session-response,
  memory-recall and temporal-causal reasoning tasks. The Hugging Face dataset card labels the dataset
  Apache-2.0 and reports the same core statistics. The source describes raw counseling dialogue files
  in the public repository; this registry does not reproduce them. A session count is not recorded
  because the sources report dialogue units and semester trajectories rather than a definitive total
  number of sessions.
