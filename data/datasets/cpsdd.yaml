last_verified: 2026-10-03
notes: >-
  The project README reports 68,136 dialogues and about 1.3 million utterances,
  spanning 13 user groups, 16 psychological problems, 13 causes and 12 support
  focuses. It identifies CPsDD as generated by PGSim rather than naturally
  occurring counseling sessions. The repository also exposes 65 KB of
  expert-annotated real counseling samples and expert rewrite references used
  during preparation; these should not be mistaken for the 68,136 generated
  dialogues. Dataset-specific redistribution terms beyond the research-only
  statement, privacy/de-identification details, consent and ethics-review
  documentation remain unknown.
