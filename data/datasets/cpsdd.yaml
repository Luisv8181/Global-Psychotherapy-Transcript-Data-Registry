id: cpsdd
title: "CPsDD: Chinese Psychological Support Dialogue Dataset"
canonical_url: https://github.com/FakerBoom/CPsDD
status: partially-verified
dataset_type: synthetic
dialogue_structure: multi_turn
domain: psychological_support
source_context: >-
  Synthetic Chinese psychological support dialogues generated with the PGSim
  path-guided simulation framework. The authors describe expert-annotated seed
  dialogues, a Dialog Modifier based on Qwen2.5-7B with LoRA, and a Dialog
  Generator based on GLM4-9B with LoRA, followed by generation and filtering.
  The repository separately includes a small set of expert-annotated real-world
  counseling samples and rewrite references; those seed materials are not the
  same as the generated CPsDD corpus.
